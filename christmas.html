<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02040c">
<title>Merry Christmas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02040c; }
  body { -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .word {
    position: fixed; left: 0; right: 0; bottom: max(5.2vh, 22px);
    text-align: center; pointer-events: none;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Songti SC", serif;
    font-size: clamp(16px, 4.2vw, 30px);
    letter-spacing: .46em; text-indent: .46em;
    color: rgba(226, 242, 255, .92);
    text-shadow: 0 0 22px rgba(140, 205, 255, .55), 0 0 60px rgba(90, 160, 255, .3);
    opacity: 0; transform: translateY(10px);
    animation: rise 2.6s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
  }
  .sub {
    position: fixed; left: 0; right: 0; bottom: max(2.8vh, 10px);
    text-align: center; pointer-events: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 10.5px; letter-spacing: .3em; color: rgba(160, 190, 220, .3);
    opacity: 0; animation: rise 2s ease 2.8s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .music {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(150, 205, 255, .28);
    background: rgba(14, 22, 40, .55); backdrop-filter: blur(8px);
    color: rgba(198, 228, 255, .82); font-size: 19px; line-height: 1;
    font-family: Georgia, serif; display: flex; align-items: center; justify-content: center;
    transition: all .3s ease; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .music.playing {
    color: #eaf6ff; border-color: rgba(150, 210, 255, .8);
    background: rgba(28, 52, 90, .6);
    box-shadow: 0 0 26px rgba(110, 180, 255, .45), 0 6px 20px rgba(0,0,0,.4);
  }
  .music:active { transform: scale(.94); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="word">MERRY CHRISTMAS</div>
<div class="sub">轻触屏幕 · 右下角可播放音乐</div>
<button id="music" class="music" aria-label="播放音乐">♪</button>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var geo = { cx: 0, topY: 0, baseY: 0, h: 0, maxR: 0 };

  var treeDots = [];    // 树身粒子（静态烘焙）
  var gems = [];        // 会呼吸的亮粒子
  var snowflakes = [];  // 小雪花图形
  var bgStars = [];
  var snow = [];
  var dust = [];        // 上升的光尘
  var fgSnow = [];      // 近景虚化雪
  var sparks = [];

  var treeCanvas = null, bgCanvas = null;
  var glowSprite = null, softSprite = null, flakeSprite = null;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ---------- 尺寸 ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    geo.cx = W / 2;
    geo.topY = H * 0.18;
    geo.baseY = H * 0.85;
    geo.h = geo.baseY - geo.topY;
    geo.maxR = Math.min(W * 0.31, geo.h * 0.29);

    build();
    bakeSprites();
    bakeBackground();
    bakeTree();
  }

  // ---------- 生成 ----------
  function build() {
    treeDots = [];
    gems = [];
    snowflakes = [];

    // 分层枝盘：每层沿椭圆外缘排一圈粒子，形成清晰的层边
    var TIERS = 27;
    for (var ti = 0; ti < TIERS; ti++) {
      var k = (ti + 1) / TIERS;
      var y0 = geo.topY + geo.h * k + rnd(-3.5, 3.5);
      var R = geo.maxR * Math.pow(k, 1.16) * rnd(0.93, 1.06);
      if (R < 2.5) continue;

      // 外缘一圈
      var rimN = Math.round(34 + 110 * k);
      for (var i = 0; i < rimN; i++) {
        var th = Math.random() * Math.PI * 2;
        var front = Math.sin(th) > 0;
        if (!front && Math.random() < 0.55) continue;      // 背面少一半

        var rr = R * rnd(0.80, 1.03);
        var px = geo.cx + Math.cos(th) * rr;
        var py = y0 + Math.sin(th) * rr * 0.19 + rnd(-1.4, 1.4);
        var edge = rr / R;

        treeDots.push({
          x: px, y: py,
          r: rnd(0.55, 1.25) * (0.75 + 0.45 * edge),
          a: rnd(0.22, 0.55) * (0.7 + 0.5 * edge),
          hue: rnd(192, 207),
          lig: rnd(74, 96)
        });
      }

      // 内部填充（暗一些，做体积）
      var fillN = Math.round(10 + 40 * k);
      for (var f = 0; f < fillN; f++) {
        var th2 = Math.random() * Math.PI * 2;
        if (Math.sin(th2) < 0 && Math.random() < 0.6) continue;
        var rr2 = R * rnd(0.15, 0.80);
        treeDots.push({
          x: geo.cx + Math.cos(th2) * rr2,
          y: y0 + Math.sin(th2) * rr2 * 0.19,
          r: rnd(0.35, 0.85),
          a: rnd(0.06, 0.20),
          hue: rnd(192, 206),
          lig: rnd(62, 86)
        });
      }

      // 层缘晶体
      var gemsN = Math.round(1 + 4 * k);
      for (var g2 = 0; g2 < gemsN; g2++) {
        var ga = Math.PI * (0.08 + 0.84 * Math.random());
        gems.push({
          x: geo.cx + Math.cos(ga) * R * rnd(0.86, 1.04),
          y: y0 + Math.sin(ga) * R * 0.19,
          r: rnd(1.2, 2.4),
          ph: rnd(0, Math.PI * 2),
          sp: rnd(0.6, 1.6),
          hue: rnd(190, 204)
        });
      }
    }
    // 雪花图形
    for (var f2 = 0; f2 < 14; f2++) {
      snowflakes.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        s: rnd(5, 11),
        vy: rnd(6, 15),
        vx: rnd(-4, 4),
        rot: rnd(0, Math.PI * 2),
        vr: rnd(-0.25, 0.25),
        a: rnd(0.10, 0.34)
      });
    }

    // 背景星
    bgStars = [];
    var sn = Math.round(Math.min(220, W / 4.6));
    for (var s2 = 0; s2 < sn; s2++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.92,
        r: rnd(0.3, 1.25),
        a: rnd(0.15, 0.8),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.4, 1.6)
      });
    }

    // 落雪
    snow = [];
    var nf = Math.round(Math.min(150, Math.max(50, W / 5.4)));
    for (var f3 = 0; f3 < nf; f3++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rnd(0.5, 1.9),
        vy: rnd(10, 36),
        drift: rnd(-8, 8),
        ph: rnd(0, Math.PI * 2),
        a: rnd(0.15, 0.6)
      });
    }

    // 上升光尘
    dust = [];
    for (var d = 0; d < 60; d++) {
      dust.push({
        x: geo.cx + rnd(-geo.maxR * 1.4, geo.maxR * 1.4),
        y: geo.baseY + rnd(-40, 30),
        vy: rnd(-26, -8),
        vx: rnd(-6, 6),
        r: rnd(0.6, 1.9),
        a: rnd(0.15, 0.55),
        ph: rnd(0, Math.PI * 2)
      });
    }

    // 近景虚化雪
    fgSnow = [];
    var fgn = Math.round(Math.min(24, Math.max(10, W / 36)));
    for (var fg = 0; fg < fgn; fg++) {
      fgSnow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rnd(16, 44),
        vy: rnd(40, 92),
        drift: rnd(-14, 14),
        ph: rnd(0, Math.PI * 2),
        a: rnd(0.04, 0.13)
      });
    }
  }

  // ---------- 精灵 ----------
  function bakeSprites() {
    // 光点
    var s1 = 64, c1 = document.createElement('canvas');
    c1.width = s1; c1.height = s1;
    var g1 = c1.getContext('2d');
    var rg1 = g1.createRadialGradient(s1/2, s1/2, 0, s1/2, s1/2, s1/2);
    rg1.addColorStop(0, 'rgba(255,255,255,1)');
    rg1.addColorStop(0.12, 'rgba(226,244,255,0.95)');
    rg1.addColorStop(0.32, 'rgba(150,212,255,0.45)');
    rg1.addColorStop(0.62, 'rgba(90,160,255,0.12)');
    rg1.addColorStop(1, 'rgba(60,120,220,0)');
    g1.fillStyle = rg1;
    g1.fillRect(0, 0, s1, s1);
    glowSprite = c1;

    // 软团（近景雪）
    var s2 = 128, c2 = document.createElement('canvas');
    c2.width = s2; c2.height = s2;
    var g2 = c2.getContext('2d');
    var rg2 = g2.createRadialGradient(s2/2, s2/2, 0, s2/2, s2/2, s2/2);
    rg2.addColorStop(0, 'rgba(255,255,255,0.9)');
    rg2.addColorStop(0.35, 'rgba(235,246,255,0.5)');
    rg2.addColorStop(0.65, 'rgba(210,235,255,0.16)');
    rg2.addColorStop(1, 'rgba(200,230,255,0)');
    g2.fillStyle = rg2;
    g2.fillRect(0, 0, s2, s2);
    softSprite = c2;

    // 雪花图形
    var s3 = 64, c3 = document.createElement('canvas');
    c3.width = s3; c3.height = s3;
    var g3 = c3.getContext('2d');
    g3.translate(s3/2, s3/2);
    g3.strokeStyle = 'rgba(220,242,255,1)';
    g3.lineWidth = 2;
    g3.lineCap = 'round';
    for (var i = 0; i < 6; i++) {
      g3.save();
      g3.rotate(i * Math.PI / 3);
      g3.beginPath();
      g3.moveTo(0, 0);
      g3.lineTo(0, -22);
      g3.moveTo(0, -12);
      g3.lineTo(-6, -17);
      g3.moveTo(0, -12);
      g3.lineTo(6, -17);
      g3.stroke();
      g3.restore();
    }
    flakeSprite = c3;
  }

  // ---------- 背景 ----------
  function bakeBackground() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    var rg = g.createRadialGradient(W * 0.5, H * 0.30, 0, W * 0.5, H * 0.30, Math.max(W, H) * 0.95);
    rg.addColorStop(0, '#0a1730');
    rg.addColorStop(0.30, '#061024');
    rg.addColorStop(0.62, '#030915');
    rg.addColorStop(1, '#010206');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    // 星云
    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 5; i++) {
      var nx = W * rnd(0.15, 0.85);
      var ny = H * rnd(0.05, 0.55);
      var nr = Math.max(W, H) * rnd(0.16, 0.34);
      var ng = g.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, 'rgba(50, 110, 200,' + rnd(0.03, 0.07) + ')');
      ng.addColorStop(1, 'rgba(30, 70, 150, 0)');
      g.fillStyle = ng;
      g.fillRect(0, 0, W, H);
    }
    g.globalCompositeOperation = 'source-over';
    bgCanvas = c;
  }

  // ---------- 树的烘焙 ----------
  function bakeTree() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 树体底光
    g.globalCompositeOperation = 'lighter';
    var bg2 = g.createRadialGradient(geo.cx, geo.topY + geo.h * 0.58, 0, geo.cx, geo.topY + geo.h * 0.58, geo.maxR * 1.25);
    bg2.addColorStop(0, 'rgba(70, 140, 230, 0.16)');
    bg2.addColorStop(0.45, 'rgba(50, 110, 200, 0.07)');
    bg2.addColorStop(1, 'rgba(30, 70, 150, 0)');
    g.fillStyle = bg2;
    g.fillRect(0, 0, W, H);

    // 粒子
    for (var i = 0; i < treeDots.length; i++) {
      var p = treeDots[i];
      var sz = p.r * 5.2;
      g.globalAlpha = p.a * 0.9;
      g.drawImage(glowSprite, p.x - sz, p.y - sz, sz * 2, sz * 2);
      g.globalAlpha = p.a;
      g.fillStyle = 'hsl(' + p.hue + ', 90%, ' + p.lig + '%)';
      g.beginPath();
      g.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2);
      g.fill();
    }

    // 树心的暗色，压出层次
    g.globalCompositeOperation = 'source-over';
    var core = g.createRadialGradient(geo.cx, geo.topY + geo.h * 0.55, 0, geo.cx, geo.topY + geo.h * 0.55, geo.maxR * 0.85);
    core.addColorStop(0, 'rgba(2, 8, 20, 0.30)');
    core.addColorStop(0.55, 'rgba(2, 8, 20, 0.10)');
    core.addColorStop(1, 'rgba(2, 8, 20, 0)');
    g.fillStyle = core;
    g.fillRect(0, 0, W, H);

    // 地面光池
    g.globalCompositeOperation = 'lighter';
    var pool = g.createRadialGradient(geo.cx, geo.baseY + 6, 0, geo.cx, geo.baseY + 6, geo.maxR * 1.15);
    pool.addColorStop(0, 'rgba(120, 190, 255, 0.20)');
    pool.addColorStop(0.5, 'rgba(70, 130, 220, 0.07)');
    pool.addColorStop(1, 'rgba(40, 80, 160, 0)');
    g.fillStyle = pool;
    g.beginPath();
    g.ellipse(geo.cx, geo.baseY + 6, geo.maxR * 1.15, geo.maxR * 0.16, 0, 0, Math.PI * 2);
    g.fill();

    // 树干（冷色剪影）
    g.globalCompositeOperation = 'source-over';
    var topY = geo.topY + geo.h * 0.80;
    var botY = geo.baseY + geo.maxR * 0.03;
    var wT = geo.maxR * 0.030;
    var wB = geo.maxR * 0.055;
    g.beginPath();
    g.moveTo(geo.cx - wT, topY);
    g.quadraticCurveTo(geo.cx - wT * 1.6, (topY + botY) * 0.5, geo.cx - wB, botY);
    g.lineTo(geo.cx + wB, botY);
    g.quadraticCurveTo(geo.cx + wT * 1.6, (topY + botY) * 0.5, geo.cx + wT, topY);
    g.closePath();
    var tg = g.createLinearGradient(geo.cx - wB, 0, geo.cx + wB, 0);
    tg.addColorStop(0, 'rgba(6, 14, 28, 0.9)');
    tg.addColorStop(0.35, 'rgba(24, 46, 80, 0.85)');
    tg.addColorStop(0.6, 'rgba(16, 32, 58, 0.9)');
    tg.addColorStop(1, 'rgba(4, 10, 20, 0.95)');
    g.fillStyle = tg;
    g.fill();

    // 树干边缘的冷光
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = 'rgba(120, 190, 255, 0.20)';
    g.lineWidth = 1;
    g.stroke();

    // 礼物盒
    g.globalCompositeOperation = 'source-over';
    drawGifts(g);

    treeCanvas = c;
  }

  function drawGifts(g) {
    var baseY = geo.baseY + geo.maxR * 0.03;
    var spec = [
      { dx: -0.76, w: 0.24, h: 0.17, hue: 205, sat: 60, lig: 46 },
      { dx: 0.66, w: 0.21, h: 0.15, hue: 42, sat: 62, lig: 48 },
      { dx: -0.38, w: 0.15, h: 0.11, hue: 190, sat: 72, lig: 50 },
      { dx: 0.30, w: 0.16, h: 0.12, hue: 350, sat: 55, lig: 44 }
    ];

    spec.forEach(function (b) {
      var w = geo.maxR * b.w;
      var h = geo.maxR * b.h;
      var x = geo.cx + geo.maxR * b.dx;
      var y = baseY - h * 0.5;
      var dp = h * 0.5;
      var off = w * 0.28;

      g.globalAlpha = 0.45;
      var sh = g.createRadialGradient(x, baseY + 2, 0, x, baseY + 2, w * 1.5);
      sh.addColorStop(0, 'rgba(0,0,0,0.6)');
      sh.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh;
      g.beginPath();
      g.ellipse(x, baseY + 2, w * 1.5, h * 0.3, 0, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 1;

      g.save();
      g.translate(x, y);

      var fg = g.createLinearGradient(-w / 2, 0, w / 2, 0);
      fg.addColorStop(0, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 16) + '%)');
      fg.addColorStop(0.45, 'hsl(' + b.hue + ',' + b.sat + '%,' + b.lig + '%)');
      fg.addColorStop(1, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 22) + '%)');
      g.fillStyle = fg;
      g.beginPath();
      g.moveTo(-w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, h / 2 + dp * 0.5);
      g.lineTo(-w / 2, h / 2 + dp * 0.5);
      g.closePath();
      g.fill();

      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 10) + '%,' + (b.lig + 14) + '%)';
      g.beginPath();
      g.moveTo(-w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2 - off, -h / 2 - dp * 0.5);
      g.lineTo(-w / 2 - off, -h / 2 - dp * 0.5);
      g.closePath();
      g.fill();

      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 4) + '%,' + (b.lig - 26) + '%)';
      g.beginPath();
      g.moveTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2 - off, -h / 2 - dp * 0.5);
      g.lineTo(w / 2 - off, h / 2 - dp * 0.5);
      g.lineTo(w / 2, h / 2 + dp * 0.5);
      g.closePath();
      g.fill();

      g.fillStyle = 'hsla(200, 90%, 88%, 0.9)';
      g.fillRect(-w * 0.06, -h / 2 + dp * 0.5, w * 0.12, h);

      g.restore();
    });
  }

  // ---------- 每帧 ----------
  function drawBgStars(t) {
    for (var i = 0; i < bgStars.length; i++) {
      var s = bgStars[i];
      var tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#dcefff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGems(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < gems.length; i++) {
      var g = gems[i];
      var tw = 0.35 + 0.65 * Math.sin(t * g.sp + g.ph);
      var size = g.r * (2.4 + 2.6 * tw);
      ctx.globalAlpha = 0.35 + 0.55 * tw;
      ctx.drawImage(glowSprite, g.x - size, g.y - size, size * 2, size * 2);
      ctx.globalAlpha = 0.6 + 0.4 * tw;
      ctx.fillStyle = 'hsl(' + g.hue + ', 100%, 94%)';
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawStar(t) {
    var x = geo.cx, y = geo.topY - geo.h * 0.03;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.4);
    var R = Math.min(W, H) * 0.026 + pulse * 2.4;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 大光晕
    var halo = ctx.createRadialGradient(x, y, 0, x, y, R * 9);
    halo.addColorStop(0, 'rgba(220, 242, 255,' + (0.55 + 0.2 * pulse) + ')');
    halo.addColorStop(0.12, 'rgba(150, 210, 255, 0.35)');
    halo.addColorStop(0.35, 'rgba(90, 160, 240, 0.10)');
    halo.addColorStop(1, 'rgba(60, 120, 220, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, R * 9, 0, Math.PI * 2);
    ctx.fill();

    // 光芒
    for (var i = 0; i < 8; i++) {
      var ang = i * Math.PI / 4 + t * 0.12;
      var long = (i % 2 === 0);
      var len = R * (long ? 8.5 : 4.2) * (0.9 + 0.2 * pulse);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      var lg = ctx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(235, 248, 255,' + (0.7 + 0.25 * pulse) + ')');
      lg.addColorStop(0.25, 'rgba(150, 210, 255, 0.16)');
      lg.addColorStop(1, 'rgba(90, 150, 240, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, -R * (long ? 0.13 : 0.07));
      ctx.lineTo(len, 0);
      ctx.lineTo(0, R * (long ? 0.13 : 0.07));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 星核
    var core = ctx.createRadialGradient(x, y, 0, x, y, R * 2.2);
    core.addColorStop(0, 'rgba(255,255,255,1)');
    core.addColorStop(0.18, 'rgba(225, 245, 255, 0.95)');
    core.addColorStop(0.5, 'rgba(140, 205, 255, 0.35)');
    core.addColorStop(1, 'rgba(90, 160, 240, 0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(x, y, R * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawSnow(dt, t) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.8 + f.ph) * 5) * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;
      ctx.globalAlpha = f.a * (0.7 + 0.3 * Math.sin(t * 2 + f.ph));
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFlakes(dt, t) {
    ctx.save();
    for (var i = 0; i < snowflakes.length; i++) {
      var s = snowflakes[i];
      s.y += s.vy * dt;
      s.x += (s.vx + Math.sin(t * 0.6 + i) * 4) * dt;
      s.rot += s.vr * dt;
      if (s.y > H + 20) { s.y = -20; s.x = Math.random() * W; }
      ctx.globalAlpha = s.a;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.drawImage(flakeSprite, -s.s, -s.s, s.s * 2, s.s * 2);
      ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawDust(dt, t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.y += d.vy * dt;
      d.x += (d.vx + Math.sin(t * 0.7 + d.ph) * 5) * dt;
      if (d.y < geo.topY - 20) {
        d.y = geo.baseY + rnd(-20, 30);
        d.x = geo.cx + rnd(-geo.maxR * 1.3, geo.maxR * 1.3);
      }
      var s = d.r * 5;
      ctx.globalAlpha = d.a * (0.5 + 0.5 * Math.sin(t * 1.6 + d.ph));
      ctx.drawImage(glowSprite, d.x - s, d.y - s, s * 2, s * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFG(dt, t) {
    if (!softSprite) return;
    for (var i = 0; i < fgSnow.length; i++) {
      var f = fgSnow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.55 + f.ph) * 12) * dt;
      if (f.y - f.r > H + 30) { f.y = -f.r * 1.6; f.x = Math.random() * W; }
      if (f.x < -f.r * 2) f.x = W + f.r;
      if (f.x > W + f.r * 2) f.x = -f.r;
      ctx.globalAlpha = f.a * (0.7 + 0.3 * Math.sin(t * 1.4 + f.ph));
      ctx.drawImage(softSprite, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 42 * dt;
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      var a = Math.max(0, s.life / s.max);
      var sz = 16 * a + 5;
      ctx.globalAlpha = a * 0.6;
      ctx.drawImage(glowSprite, s.x - sz, s.y - sz, sz * 2, sz * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- 交互 ----------
  function burst(px, py) {
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rnd(40, 170);
      sparks.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rnd(10, 50),
        life: rnd(0.6, 1.4),
        max: 1.4
      });
    }
  }
  canvas.addEventListener('pointerdown', function (e) { burst(e.clientX, e.clientY); });

  // ---------- 音乐 ----------
  var A = { ctx: null, master: null, on: false, nextTime: 0, idx: 0, timer: null };
  var BEAT = 0.46;
  var MELODY = [
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [64,1],[62,1],[62,1],[64,1],[62,1],[67,3],
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [67,1],[67,1],[65,1],[62,1],[60,4]
  ];

  function midi2freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function bell(freq, when, dur) {
    var c = A.ctx;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.20, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.5, dur * 1.9));
    g.connect(A.master);

    var o1 = c.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = freq;
    o1.connect(g);

    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, when);
    g2.gain.exponentialRampToValueAtTime(0.055, when + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.35, dur * 1.2));
    g2.connect(A.master);

    var o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.006;
    o2.connect(g2);

    o1.start(when); o2.start(when);
    o1.stop(when + dur * 2 + 0.4);
    o2.stop(when + dur * 2 + 0.4);
  }

  function schedule() {
    if (!A.on) return;
    var c = A.ctx;
    while (A.nextTime < c.currentTime + 0.3) {
      var n = MELODY[A.idx % MELODY.length];
      bell(midi2freq(n[0]), A.nextTime, n[1] * BEAT);
      if (A.idx % 8 === 0) bell(midi2freq(A.idx % 16 === 0 ? 48 : 43), A.nextTime, 1.6);
      A.nextTime += n[1] * BEAT;
      A.idx++;
      if (A.idx % MELODY.length === 0) A.nextTime += BEAT * 2.2;
    }
  }

  var musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (!A.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.32;
      A.master.connect(A.ctx.destination);
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();
    A.on = !A.on;
    musicBtn.classList.toggle('playing', A.on);
    musicBtn.textContent = A.on ? '❙❙' : '♪';
    musicBtn.style.fontSize = A.on ? '15px' : '19px';
    if (A.on) {
      A.nextTime = A.ctx.currentTime + 0.15;
      A.idx = 0;
      if (!A.timer) A.timer = setInterval(schedule, 60);
      schedule();
    }
  });
  musicBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  // ---------- 主循环 ----------
  var last = performance.now(), t0 = last;

  function renderScene(t, dt) {
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
    drawBgStars(t);

    var cam = 1 + Math.sin(t * 0.4) * 0.005;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam, cam);
    ctx.translate(-W / 2, -H / 2);

    if (treeCanvas) ctx.drawImage(treeCanvas, 0, 0, W, H);
    drawGems(t);
    drawStar(t);

    ctx.restore();

    drawDust(dt, t);
    drawSnow(dt, t);
    drawFlakes(dt, t);
    drawFG(dt, t);
    drawSparks(dt);
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    renderScene((now - t0) / 1000, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  resize();
  renderScene(1.2, 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
