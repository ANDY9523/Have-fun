<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03060f">
<title>Merry Christmas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03060f; }
  body { -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .word {
    position: fixed; left: 0; right: 0; bottom: max(5.2vh, 22px);
    text-align: center; pointer-events: none;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Songti SC", serif;
    font-size: clamp(16px, 4.2vw, 30px);
    letter-spacing: .46em; text-indent: .46em;
    color: rgba(255, 244, 224, .93);
    text-shadow: 0 0 22px rgba(255, 205, 140, .5), 0 0 60px rgba(255, 170, 90, .26);
    opacity: 0; transform: translateY(10px);
    animation: rise 2.6s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
  }
  .sub {
    position: fixed; left: 0; right: 0; bottom: max(2.8vh, 10px);
    text-align: center; pointer-events: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 10.5px; letter-spacing: .3em; color: rgba(170, 195, 220, .3);
    opacity: 0; animation: rise 2s ease 2.8s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .music {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255, 220, 160, .3);
    background: rgba(16, 22, 34, .55); backdrop-filter: blur(8px);
    color: rgba(255, 232, 190, .85); font-size: 19px; line-height: 1;
    font-family: Georgia, serif; display: flex; align-items: center; justify-content: center;
    transition: all .3s ease; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .music.playing {
    color: #fff6e2; border-color: rgba(255, 210, 140, .8);
    background: rgba(60, 46, 24, .6);
    box-shadow: 0 0 26px rgba(255, 195, 110, .4), 0 6px 20px rgba(0,0,0,.4);
  }
  .music:active { transform: scale(.94); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="word">MERRY CHRISTMAS</div>
<div class="sub">轻触屏幕 · 右下角可播放音乐</div>
<button id="music" class="music" aria-label="播放音乐">♪</button>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var geo = { cx: 0, topY: 0, baseY: 0, h: 0, maxR: 0 };

  var branches = [];   // 枝桠
  var lights = [];     // 暖色灯珠
  var orns = [];       // 彩球
  var stars = [];      // 夜空星
  var snow = [];       // 雪
  var fgSnow = [];     // 近景虚化雪
  var sparks = [];

  var treeCanvas = null;   // 清晰的树
  var glowCanvas = null;   // 模糊的辉光层
  var bgCanvas = null;
  var glowSprite = null, softSprite = null, ornSprites = {};

  var ORN_COLORS = [
    { h: 352, s: 80, l: 54 },
    { h: 44,  s: 90, l: 58 },
    { h: 196, s: 80, l: 60 },
    { h: 320, s: 68, l: 64 },
    { h: 156, s: 58, l: 50 }
  ];

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function quad(a, c, b, t) { var u = 1 - t; return u * u * a + 2 * u * t * c + t * t * b; }

  // ---------- 尺寸 ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    geo.cx = W / 2;
    geo.topY = H * 0.17;
    geo.baseY = H * 0.86;
    geo.h = geo.baseY - geo.topY;
    geo.maxR = Math.min(W * 0.33, geo.h * 0.31);

    build();
    bakeSprites();
    bakeBackground();
    bakeTree();
  }

  // ---------- 生成枝干 ----------
  function build() {
    branches = [];
    var LEVELS = 56;                     // 层数越多越细密
    for (var li = 0; li < LEVELS; li++) {
      var k = li / (LEVELS - 1);         // 0 顶 → 1 底
      if (k > 0.94) continue;            // 底部留给树干
      var y = geo.topY + geo.h * k;
      var R = geo.maxR * Math.pow(k, 1.08);
      if (R < 2) continue;

      var n = Math.round(8 + 15 * k);
      for (var b = 0; b < n; b++) {
        var side = (b % 2 === 0) ? -1 : 1;
        var spread = R * rnd(0.58, 1.05);
        var x0 = geo.cx + rnd(-R * 0.09, R * 0.09);
        var y0 = y + rnd(-4, 4);
        var x1 = geo.cx + side * spread;
        var y1 = y0 + spread * rnd(0.12, 0.30);
        var cxp = x0 + side * spread * 0.55;
        var cyp = Math.min(y0, y1) - spread * rnd(0.02, 0.09);

        var depthK = k;                  // 越靠下越靠前
        var br = {
          x0: x0, y0: y0, cxp: cxp, cyp: cyp, x1: x1, y1: y1,
          side: side, depth: depthK,
          w: rnd(0.7, 1.9) * (0.5 + 0.9 * k),
          light: rnd(12, 24) + k * 8,
          hue: 146 + rnd(-8, 14),
          sat: rnd(24, 44)
        };
        branches.push(br);

        // 子枝：让枝看起来有分叉
        var subs = Math.round(rnd(1, 3));
        for (var s = 0; s < subs; s++) {
          var tt = rnd(0.45, 0.9);
          var sx = quad(br.x0, br.cxp, br.x1, tt);
          var sy = quad(br.y0, br.cyp, br.y1, tt);
          var sLen = spread * rnd(0.18, 0.38);
          branches.push({
            x0: sx, y0: sy,
            x1: sx + side * sLen,
            y1: sy + sLen * rnd(0.25, 0.6),
            cxp: sx + side * sLen * 0.5,
            cyp: sy + sLen * 0.05,
            side: side, depth: depthK + 0.01,
            w: rnd(0.4, 0.95),
            light: br.light + rnd(1, 6),
            hue: br.hue, sat: br.sat
          });
        }
      }
    }
    branches.sort(function (a, b) { return a.depth - b.depth; });

    // 灯珠：沿枝随机取点
    lights = [];
    var picks = branches.slice();
    for (var i = picks.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t2 = picks[i]; picks[i] = picks[j]; picks[j] = t2;
    }
    var lightN = Math.round(Math.min(110, Math.max(50, W / 5.5)));
    for (var l = 0; l < lightN && l < picks.length; l++) {
      var pb = picks[l];
      var tt2 = rnd(0.35, 1.0);
      lights.push({
        x: quad(pb.x0, pb.cxp, pb.x1, tt2),
        y: quad(pb.y0, pb.cyp, pb.y1, tt2),
        r: rnd(0.9, 1.7),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.8, 2.2),
        warm: Math.random() < 0.78
      });
    }

    // 彩球
    orns = [];
    var ornN = Math.round(Math.min(46, Math.max(22, W / 12)));
    for (var o = 0; o < ornN && o < picks.length; o++) {
      var ob = picks[picks.length - 1 - o];
      var ot = rnd(0.55, 1.0);
      orns.push({
        x: quad(ob.x0, ob.cxp, ob.x1, ot),
        y: quad(ob.y0, ob.cyp, ob.y1, ot) + rnd(1, 3),
        r: rnd(2.6, 5.0),
        col: ORN_COLORS[o % ORN_COLORS.length],
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.5, 1.3)
      });
    }

    // 背景星
    stars = [];
    var sn = Math.round(Math.min(200, W / 5));
    for (var s2 = 0; s2 < sn; s2++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.88,
        r: rnd(0.3, 1.2),
        a: rnd(0.12, 0.65),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.4, 1.4)
      });
    }

    // 雪
    snow = [];
    var nf = Math.round(Math.min(150, Math.max(50, W / 5.4)));
    for (var f = 0; f < nf; f++) {
      snow.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rnd(0.5, 2.0), vy: rnd(10, 36), drift: rnd(-8, 8),
        ph: rnd(0, Math.PI * 2), a: rnd(0.15, 0.62)
      });
    }

    // 近景虚化雪
    fgSnow = [];
    var fgn = Math.round(Math.min(24, Math.max(10, W / 36)));
    for (var fg = 0; fg < fgn; fg++) {
      fgSnow.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rnd(16, 46), vy: rnd(40, 92), drift: rnd(-14, 14),
        ph: rnd(0, Math.PI * 2), a: rnd(0.04, 0.13)
      });
    }
  }

  // ---------- 精灵 ----------
  function bakeSprites() {
    var s1 = 96, c1 = document.createElement('canvas');
    c1.width = s1; c1.height = s1;
    var g1 = c1.getContext('2d');
    var rg = g1.createRadialGradient(s1/2, s1/2, 0, s1/2, s1/2, s1/2);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.16, 'rgba(255,240,200,0.9)');
    rg.addColorStop(0.42, 'rgba(255,200,120,0.25)');
    rg.addColorStop(1, 'rgba(255,180,90,0)');
    g1.fillStyle = rg;
    g1.fillRect(0, 0, s1, s1);
    glowSprite = c1;

    var s2 = 128, c2 = document.createElement('canvas');
    c2.width = s2; c2.height = s2;
    var g2 = c2.getContext('2d');
    var rg2 = g2.createRadialGradient(s2/2, s2/2, 0, s2/2, s2/2, s2/2);
    rg2.addColorStop(0, 'rgba(255,255,255,0.92)');
    rg2.addColorStop(0.35, 'rgba(240,248,255,0.5)');
    rg2.addColorStop(0.65, 'rgba(220,238,255,0.16)');
    rg2.addColorStop(1, 'rgba(210,232,255,0)');
    g2.fillStyle = rg2;
    g2.fillRect(0, 0, s2, s2);
    softSprite = c2;

    ornSprites = {};
    ORN_COLORS.forEach(function (col, idx) {
      var S = 96, cc = document.createElement('canvas');
      cc.width = S; cc.height = S;
      var gg = cc.getContext('2d');
      var cx = S/2, cy = S/2, R = S * 0.30;
      var bg = gg.createRadialGradient(cx - R*0.35, cy - R*0.4, R*0.08, cx, cy, R);
      bg.addColorStop(0, 'hsl(' + col.h + ',' + col.s + '%,' + Math.min(94, col.l + 36) + '%)');
      bg.addColorStop(0.45, 'hsl(' + col.h + ',' + col.s + '%,' + col.l + '%)');
      bg.addColorStop(1, 'hsl(' + col.h + ',' + col.s + '%,' + Math.max(12, col.l - 32) + '%)');
      gg.fillStyle = bg;
      gg.beginPath(); gg.arc(cx, cy, R, 0, Math.PI * 2); gg.fill();
      gg.fillStyle = 'rgba(255,255,255,0.75)';
      gg.beginPath(); gg.ellipse(cx - R*0.33, cy - R*0.4, R*0.24, R*0.17, -0.6, 0, Math.PI * 2); gg.fill();
      gg.fillStyle = 'hsla(' + col.h + ', 60%, 88%, 0.2)';
      gg.beginPath(); gg.ellipse(cx + R*0.12, cy + R*0.5, R*0.42, R*0.16, 0.2, 0, Math.PI * 2); gg.fill();
      ornSprites[idx] = cc;
    });
  }

  // ---------- 背景 ----------
  function bakeBackground() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = g.createRadialGradient(W*0.5, H*0.28, 0, W*0.5, H*0.28, Math.max(W, H) * 0.92);
    rg.addColorStop(0, '#0b1a33');
    rg.addColorStop(0.32, '#071226');
    rg.addColorStop(0.66, '#040a16');
    rg.addColorStop(1, '#010308');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 4; i++) {
      var nx = W * rnd(0.2, 0.8), ny = H * rnd(0.06, 0.5), nr = Math.max(W, H) * rnd(0.18, 0.34);
      var ng = g.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, 'rgba(50, 110, 200,' + rnd(0.025, 0.06) + ')');
      ng.addColorStop(1, 'rgba(30, 70, 150, 0)');
      g.fillStyle = ng; g.fillRect(0, 0, W, H);
    }
    g.globalCompositeOperation = 'source-over';
    bgCanvas = c;
  }

  // ---------- 树 ----------
  function bakeTree() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 内芯（挡住天空）
    for (var kk = 0; kk <= 1.0001; kk += 1 / 46) {
      var yy = geo.topY + geo.h * kk;
      var rx = geo.maxR * Math.pow(kk, 1.07) * 0.98;
      var ry = Math.max(0.8, rx * 0.15);
      g.fillStyle = 'hsla(150, 30%, ' + (9 + 5 * kk).toFixed(1) + '%, ' + (0.96 + 0.03 * kk) + ')';
      g.beginPath(); g.ellipse(geo.cx, yy, rx, ry, 0, 0, Math.PI * 2); g.fill();
    }

    // 树干（后半段）
    g.beginPath();
    g.moveTo(geo.cx - geo.maxR * 0.040, geo.baseY + 6);
    g.quadraticCurveTo(geo.cx - geo.maxR * 0.030, geo.topY + geo.h * 0.62, geo.cx, geo.topY + geo.h * 0.42);
    g.lineTo(geo.cx + geo.maxR * 0.040, geo.baseY + 6);
    g.closePath();
    var tg = g.createLinearGradient(geo.cx - 20, 0, geo.cx + 20, 0);
    tg.addColorStop(0, '#080503'); tg.addColorStop(0.4, '#170f08');
    tg.addColorStop(0.7, '#120c06'); tg.addColorStop(1, '#040302');
    g.fillStyle = tg; g.fill();

    // 枝 + 针叶
    g.lineCap = 'round';
    for (var i = 0; i < branches.length; i++) drawBranch(g, branches[i]);

    // 前向填充：用短针叶把缝隙补满，避免"正前方透过去"
    g.lineCap = 'round';
    var fillN = Math.round(Math.min(5200, Math.max(2200, W * 6)));
    for (var fi = 0; fi < fillN; fi++) {
      var fk = Math.pow(Math.random(), 0.85);
      var fy = geo.topY + geo.h * fk;
      var fR = geo.maxR * Math.pow(fk, 1.06);
      var fang = Math.random() * Math.PI * 2;
      if (Math.sin(fang) < 0 && Math.random() < 0.55) continue;   // 后半圈少一些
      var frr = fR * rnd(0.04, 1.0);
      var fx = geo.cx + Math.cos(fang) * frr;
      var fyy = fy + Math.sin(fang) * frr * 0.16;
      var flen = rnd(1.6, 4.4);
      var fa = rnd(-Math.PI, Math.PI);
      g.beginPath();
      g.moveTo(fx, fyy);
      g.lineTo(fx + Math.cos(fa) * flen, fyy + Math.sin(fa) * flen);
      g.lineWidth = rnd(0.3, 0.72);
      g.strokeStyle = 'hsla(' + rnd(144, 160) + ',' + rnd(24, 46) + '%,' + rnd(9, 22) + '%,' + rnd(0.4, 0.85) + ')';
      g.stroke();
    }
    // 明暗
    g.globalCompositeOperation = 'source-atop';
    var sg = g.createLinearGradient(geo.cx - geo.maxR, 0, geo.cx + geo.maxR, 0);
    sg.addColorStop(0, 'rgba(0,0,0,0.44)');
    sg.addColorStop(0.36, 'rgba(0,0,0,0.05)');
    sg.addColorStop(0.64, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(0,0,0,0.30)');
    g.fillStyle = sg; g.fillRect(0, 0, W, H);

    var vg = g.createLinearGradient(0, geo.topY, 0, geo.baseY + 20);
    vg.addColorStop(0, 'rgba(0,0,0,0.12)');
    vg.addColorStop(0.55, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.48)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);

    // 冷月光
    g.globalCompositeOperation = 'lighter';
    var hg = g.createRadialGradient(geo.cx - geo.maxR * 0.5, geo.topY + geo.h * 0.25, 0, geo.cx - geo.maxR * 0.5, geo.topY + geo.h * 0.25, geo.maxR * 1.2);
    hg.addColorStop(0, 'rgba(150, 210, 255, 0.12)');
    hg.addColorStop(1, 'rgba(150, 210, 255, 0)');
    g.fillStyle = hg; g.fillRect(0, 0, W, H);

    // 雪地 + 树干 + 礼物
    g.globalCompositeOperation = 'source-over';
    drawGround(g);
    drawTrunk(g);
    drawGifts(g);

    treeCanvas = c;

    // 辉光层：缩小再放大，得到柔和的光晕
    var sc = 1 / 7;
    var gc = document.createElement('canvas');
    gc.width = Math.max(1, Math.round(W * sc));
    gc.height = Math.max(1, Math.round(H * sc));
    var gg2 = gc.getContext('2d');
    gg2.drawImage(c, 0, 0, gc.width, gc.height);
    gg2.globalCompositeOperation = 'source-in';
    gg2.fillStyle = 'rgba(120, 190, 255, 0.95)';
    gg2.fillRect(0, 0, gc.width, gc.height);
    glowCanvas = gc;
  }

  function drawBranch(g, b) {
    g.beginPath();
    g.moveTo(b.x0, b.y0);
    g.quadraticCurveTo(b.cxp, b.cyp, b.x1, b.y1);
    g.lineWidth = b.w;
    g.strokeStyle = 'hsl(' + b.hue + ',' + (b.sat * 0.55) + '%,' + (b.light * 0.5) + '%)';
    g.stroke();

    var steps = 15;
    for (var s = 1; s <= steps; s++) {
      var t = s / steps;
      var px = quad(b.x0, b.cxp, b.x1, t);
      var py = quad(b.y0, b.cyp, b.y1, t);
      var dx = 2 * (1 - t) * (b.cxp - b.x0) + 2 * t * (b.x1 - b.cxp);
      var dy = 2 * (1 - t) * (b.cyp - b.y0) + 2 * t * (b.y1 - b.cyp);
      var ang = Math.atan2(dy, dx);
      var fan = 3 + Math.round(2 * (1 - t));

      for (var n = 0; n < fan; n++) {
        var na = ang + rnd(-0.95, 0.95) + (b.side > 0 ? 0.2 : -0.2);
        var len = rnd(2, 7) * (0.55 + 0.75 * t);
        g.beginPath();
        g.moveTo(px, py);
        g.lineTo(px + Math.cos(na) * len, py + Math.sin(na) * len + 1.4);
        g.lineWidth = rnd(0.35, 0.8);
        var lum = rnd(b.light - 7, b.light + 18);
        g.strokeStyle = 'hsla(' + b.hue + ',' + rnd(22, 50) + '%,' + lum + '%,' + rnd(0.5, 0.95) + ')';
        g.stroke();
      }
    }

    for (var k2 = 0; k2 < 5; k2++) {
      var ta = rnd(-1.3, 1.3) + (b.y1 > b.y0 ? 0.55 : 0);
      var tl = rnd(4, 10);
      g.beginPath();
      g.moveTo(b.x1, b.y1);
      g.lineTo(b.x1 + Math.cos(ta) * tl, b.y1 + Math.sin(ta) * tl);
      g.lineWidth = rnd(0.45, 0.85);
      g.strokeStyle = 'hsla(' + b.hue + ', 40%, ' + rnd(b.light + 9, b.light + 26) + '%, 0.9)';
      g.stroke();
    }
  }

  function drawTrunk(g) {
    var topY = geo.topY + geo.h * 0.905;
    var botY = geo.baseY + geo.maxR * 0.04;
    var wT = geo.maxR * 0.034;
    var wB = geo.maxR * 0.050;

    g.save();
    g.beginPath();
    g.moveTo(geo.cx, topY - geo.maxR * 0.02);
    g.quadraticCurveTo(geo.cx - wB * 0.45, (topY + botY) * 0.45, geo.cx - wB, botY);
    g.lineTo(geo.cx + wB, botY);
    g.quadraticCurveTo(geo.cx + wB * 0.45, (topY + botY) * 0.45, geo.cx, topY - geo.maxR * 0.02);
    g.closePath();

    var grd = g.createLinearGradient(geo.cx - wB, 0, geo.cx + wB, 0);
    grd.addColorStop(0, '#0a0704');
    grd.addColorStop(0.25, '#2c1d10');
    grd.addColorStop(0.45, '#382415');
    grd.addColorStop(0.72, '#1d1209');
    grd.addColorStop(1, '#070402');
    g.fillStyle = grd;
    g.fill();

    // 树皮
    g.save();
    g.clip();
    for (var i = 0; i < 14; i++) {
      var xx = geo.cx + rnd(-wB * 0.95, wB * 0.95);
      g.strokeStyle = 'rgba(8,5,2,' + rnd(0.18, 0.45) + ')';
      g.lineWidth = rnd(0.5, 1.6);
      g.beginPath();
      g.moveTo(xx, topY + rnd(0, 6));
      g.quadraticCurveTo(xx + rnd(-4, 4), (topY + botY) * 0.5, xx + rnd(-6, 6), botY);
      g.stroke();
    }
    g.restore();



    g.restore();
  }
  function drawGround(g) {
    var mounds = [
      { x: geo.cx, y: geo.baseY + 10, rx: geo.maxR * 1.30, ry: geo.maxR * 0.20, a: 0.20 },
      { x: geo.cx - geo.maxR * 0.26, y: geo.baseY + 6, rx: geo.maxR * 0.70, ry: geo.maxR * 0.13, a: 0.14 },
      { x: geo.cx + geo.maxR * 0.30, y: geo.baseY + 8, rx: geo.maxR * 0.58, ry: geo.maxR * 0.11, a: 0.12 }
    ];
    mounds.forEach(function (m) {
      var mg = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.rx);
      mg.addColorStop(0, 'rgba(226, 240, 255,' + m.a + ')');
      mg.addColorStop(0.55, 'rgba(200, 222, 250,' + (m.a * 0.55) + ')');
      mg.addColorStop(1, 'rgba(180, 205, 240, 0)');
      g.fillStyle = mg;
      g.beginPath(); g.ellipse(m.x, m.y, m.rx, m.ry, 0, 0, Math.PI * 2); g.fill();
    });

    g.save();
    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 80; i++) {
      g.globalAlpha = rnd(0.05, 0.18);
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(geo.cx + rnd(-geo.maxR * 1.15, geo.maxR * 1.15), geo.baseY + rnd(-4, geo.maxR * 0.14), rnd(0.4, 1.2), 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
    g.globalAlpha = 1;
  }

  function drawGifts(g) {
    var baseY = geo.baseY + geo.maxR * 0.05;
    var spec = [
      { dx: -0.76, w: 0.27, h: 0.20, hue: 352, sat: 66, lig: 42 },
      { dx: 0.66, w: 0.23, h: 0.17, hue: 44, sat: 74, lig: 50 },
      { dx: -0.40, w: 0.17, h: 0.13, hue: 156, sat: 42, lig: 36 },
      { dx: 0.34, w: 0.19, h: 0.14, hue: 196, sat: 58, lig: 44 }
    ];
    spec.forEach(function (b) {
      var w = geo.maxR * b.w, h = geo.maxR * b.h;
      var x = geo.cx + geo.maxR * b.dx, y = baseY - h * 0.5;
      var dp = h * 0.55, off = w * 0.28;

      g.globalAlpha = 0.4;
      var sh = g.createRadialGradient(x, baseY + 2, 0, x, baseY + 2, w * 1.5);
      sh.addColorStop(0, 'rgba(0,0,0,0.6)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh;
      g.beginPath(); g.ellipse(x, baseY + 2, w * 1.5, h * 0.32, 0, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;

      g.save(); g.translate(x, y);
      var fg = g.createLinearGradient(-w/2, 0, w/2, 0);
      fg.addColorStop(0, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 15) + '%)');
      fg.addColorStop(0.45, 'hsl(' + b.hue + ',' + b.sat + '%,' + b.lig + '%)');
      fg.addColorStop(1, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 22) + '%)');
      g.fillStyle = fg;
      g.beginPath();
      g.moveTo(-w/2, -h/2 + dp*0.5); g.lineTo(w/2, -h/2 + dp*0.5);
      g.lineTo(w/2, h/2 + dp*0.5); g.lineTo(-w/2, h/2 + dp*0.5);
      g.closePath(); g.fill();

      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 12) + '%,' + (b.lig + 13) + '%)';
      g.beginPath();
      g.moveTo(-w/2, -h/2 + dp*0.5); g.lineTo(w/2, -h/2 + dp*0.5);
      g.lineTo(w/2 - off, -h/2 - dp*0.5); g.lineTo(-w/2 - off, -h/2 - dp*0.5);
      g.closePath(); g.fill();

      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 6) + '%,' + (b.lig - 25) + '%)';
      g.beginPath();
      g.moveTo(w/2, -h/2 + dp*0.5); g.lineTo(w/2 - off, -h/2 - dp*0.5);
      g.lineTo(w/2 - off, h/2 - dp*0.5); g.lineTo(w/2, h/2 + dp*0.5);
      g.closePath(); g.fill();

      g.fillStyle = 'hsla(44, 92%, 74%, 0.95)';
      g.fillRect(-w*0.07, -h/2 + dp*0.5, w*0.14, h);
      g.beginPath();
      g.moveTo(-w/2, -h*0.06 + dp*0.5); g.lineTo(w/2, -h*0.06 + dp*0.5);
      g.lineTo(w/2 - off, -h*0.06 - dp*0.5); g.lineTo(-w/2 - off, -h*0.06 - dp*0.5);
      g.closePath(); g.fill();

      var bw = w*0.26, bh = h*0.2;
      g.fillStyle = 'hsla(44, 95%, 80%, 0.98)';
      g.beginPath(); g.ellipse(-bw*0.55, -h/2 - dp*0.15, bw*0.55, bh*0.75, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(bw*0.55, -h/2 - dp*0.15, bw*0.55, bh*0.75, 0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'hsla(44, 95%, 64%, 1)';
      g.beginPath(); g.arc(0, -h/2 - dp*0.15, bw*0.26, 0, Math.PI * 2); g.fill();
      g.restore();
    });
  }

  // ---------- 每帧 ----------
  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#e2eeff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLights(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < lights.length; i++) {
      var L = lights[i];
      var tw = 0.35 + 0.65 * Math.sin(t * L.sp + L.ph);
      var size = (5 + 8 * tw) * (L.warm ? 1 : 0.9);
      ctx.globalAlpha = 0.25 + 0.55 * tw;
      ctx.drawImage(glowSprite, L.x - size, L.y - size, size * 2, size * 2);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = L.warm ? 'rgba(255, 240, 200, 1)' : 'rgba(215, 238, 255, 1)';
      ctx.beginPath(); ctx.arc(L.x, L.y, L.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawOrns(t) {
    for (var i = 0; i < orns.length; i++) {
      var o = orns[i];
      var pulse = 0.62 + 0.38 * Math.sin(t * o.sp + o.ph);
      var r = o.r * (1 + 0.05 * pulse);

      ctx.strokeStyle = 'rgba(200, 215, 205, 0.16)';
      ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(o.x, o.y - r - 5); ctx.lineTo(o.x, o.y - r); ctx.stroke();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.2 * pulse;
      var gs = r * 3.4;
      ctx.drawImage(glowSprite, o.x - gs, o.y - gs, gs * 2, gs * 2);
      ctx.restore();

      ctx.drawImage(ornSprites[i % ORN_COLORS.length], o.x - r*1.6, o.y - r*1.6, r*3.2, r*3.2);
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(t) {
    var x = geo.cx, y = geo.topY - geo.h * 0.035;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.5);
    var R = Math.min(W, H) * 0.029 + pulse * 2.2;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 8; i++) {
      var ang = i * Math.PI / 4 + t * 0.16;
      var long = (i % 2 === 0);
      var len = R * (long ? 6.2 : 3.2) * (0.9 + 0.2 * pulse);
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      var lg = ctx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255, 244, 214,' + (0.55 + 0.25 * pulse) + ')');
      lg.addColorStop(0.3, 'rgba(255, 214, 140, 0.11)');
      lg.addColorStop(1, 'rgba(255, 190, 90, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, -R * (long ? 0.13 : 0.07));
      ctx.lineTo(len, 0);
      ctx.lineTo(0, R * (long ? 0.13 : 0.07));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    var gg = ctx.createRadialGradient(x, y, 0, x, y, R * 4.2);
    gg.addColorStop(0, 'rgba(255, 248, 210,' + (0.5 + 0.22 * pulse) + ')');
    gg.addColorStop(0.3, 'rgba(255, 208, 120, 0.15)');
    gg.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, R * 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.beginPath();
    for (var p = 0; p < 10; p++) {
      var rr = (p % 2 === 0) ? R : R * 0.42;
      var pa = -Math.PI / 2 + p * Math.PI / 5;
      var px = x + Math.cos(pa) * rr, py = y + Math.sin(pa) * rr;
      if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var sg = ctx.createRadialGradient(x, y - R * 0.25, 0, x, y, R);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(0.45, '#fff3c4');
    sg.addColorStop(1, '#eeb042');
    ctx.fillStyle = sg;
    ctx.shadowColor = 'rgba(255, 220, 140, .9)';
    ctx.shadowBlur = 24 + pulse * 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawSnow(dt, t) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.8 + f.ph) * 5) * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;
      ctx.globalAlpha = f.a * (0.7 + 0.3 * Math.sin(t * 2 + f.ph));
      ctx.fillStyle = '#eaf4ff';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFG(dt, t) {
    if (!softSprite) return;
    for (var i = 0; i < fgSnow.length; i++) {
      var f = fgSnow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.55 + f.ph) * 12) * dt;
      if (f.y - f.r > H + 30) { f.y = -f.r * 1.6; f.x = Math.random() * W; }
      if (f.x < -f.r * 2) f.x = W + f.r;
      if (f.x > W + f.r * 2) f.x = -f.r;
      ctx.globalAlpha = f.a * (0.7 + 0.3 * Math.sin(t * 1.4 + f.ph));
      ctx.drawImage(softSprite, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 44 * dt; s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      var a = Math.max(0, s.life / s.max);
      var sz = 16 * a + 5;
      ctx.globalAlpha = a * 0.6;
      ctx.drawImage(glowSprite, s.x - sz, s.y - sz, sz * 2, sz * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function burst(px, py) {
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2, sp = rnd(40, 170);
      sparks.push({
        x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rnd(10, 50),
        life: rnd(0.6, 1.4), max: 1.4
      });
    }
  }
  canvas.addEventListener('pointerdown', function (e) { burst(e.clientX, e.clientY); });

  // ---------- 音乐 ----------
  var A = { ctx: null, master: null, on: false, nextTime: 0, idx: 0, timer: null };
  var BEAT = 0.46;
  var MELODY = [
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [64,1],[62,1],[62,1],[64,1],[62,1],[67,3],
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [67,1],[67,1],[65,1],[62,1],[60,4]
  ];
  function midi2freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function bell(freq, when, dur) {
    var c = A.ctx;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.2, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.5, dur * 1.9));
    g.connect(A.master);
    var o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq; o1.connect(g);
    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, when);
    g2.gain.exponentialRampToValueAtTime(0.055, when + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.35, dur * 1.2));
    g2.connect(A.master);
    var o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.006; o2.connect(g2);
    o1.start(when); o2.start(when);
    o1.stop(when + dur * 2 + 0.4); o2.stop(when + dur * 2 + 0.4);
  }

  function schedule() {
    if (!A.on) return;
    var c = A.ctx;
    while (A.nextTime < c.currentTime + 0.3) {
      var n = MELODY[A.idx % MELODY.length];
      bell(midi2freq(n[0]), A.nextTime, n[1] * BEAT);
      if (A.idx % 8 === 0) bell(midi2freq(A.idx % 16 === 0 ? 48 : 43), A.nextTime, 1.6);
      A.nextTime += n[1] * BEAT;
      A.idx++;
      if (A.idx % MELODY.length === 0) A.nextTime += BEAT * 2.2;
    }
  }

  var musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (!A.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.32;
      A.master.connect(A.ctx.destination);
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();
    A.on = !A.on;
    musicBtn.classList.toggle('playing', A.on);
    musicBtn.textContent = A.on ? '❙❙' : '♪';
    musicBtn.style.fontSize = A.on ? '15px' : '19px';
    if (A.on) {
      A.nextTime = A.ctx.currentTime + 0.15;
      A.idx = 0;
      if (!A.timer) A.timer = setInterval(schedule, 60);
      schedule();
    }
  });
  musicBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  // ---------- 主循环 ----------
  var last = performance.now(), t0 = last;

  function renderScene(t, dt) {
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
    drawStars(t);

    var cam = 1 + Math.sin(t * 0.4) * 0.005;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam, cam);
    ctx.translate(-W / 2, -H / 2);

    // 蓝色辉光
    if (glowCanvas) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.30 + 0.06 * Math.sin(t * 0.9);
      ctx.drawImage(glowCanvas, 0, 0, W, H);
      ctx.restore();
    }

    if (treeCanvas) ctx.drawImage(treeCanvas, 0, 0, W, H);

    drawLights(t);
    drawOrns(t);
    drawStar(t);

    ctx.restore();

    drawSnow(dt, t);
    drawFG(dt, t);
    drawSparks(dt);
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    renderScene((now - t0) / 1000, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  resize();
  renderScene(1.2, 0);
  requestAnimationFrame(frame);
})();
</script>
