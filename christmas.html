<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Merry Christmas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
  body { -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .word {
    position: fixed; left: 0; right: 0; bottom: max(5.4vh, 24px);
    text-align: center; pointer-events: none;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Songti SC", serif;
    font-size: clamp(17px, 4.4vw, 32px);
    letter-spacing: .42em; text-indent: .42em;
    color: rgba(255, 240, 214, .9);
    text-shadow: 0 0 24px rgba(255, 205, 120, .42), 0 0 60px rgba(255, 170, 80, .2);
    opacity: 0; transform: translateY(10px);
    animation: rise 2.4s cubic-bezier(.2,.7,.2,1) 1.4s forwards;
  }
  .sub {
    position: fixed; left: 0; right: 0; bottom: max(3vh, 12px);
    text-align: center; pointer-events: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 10.5px; letter-spacing: .3em; color: rgba(190, 205, 230, .3);
    opacity: 0; animation: rise 2s ease 2.6s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .music {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255, 225, 170, .28);
    background: rgba(20, 26, 40, .55); backdrop-filter: blur(8px);
    color: rgba(255, 232, 190, .82); font-size: 19px; line-height: 1;
    font-family: Georgia, serif; display: flex; align-items: center; justify-content: center;
    transition: all .3s ease; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .music.playing {
    color: #fff3d2; border-color: rgba(255, 214, 140, .75);
    background: rgba(70, 52, 24, .6);
    box-shadow: 0 0 24px rgba(255, 200, 120, .35), 0 6px 20px rgba(0,0,0,.35);
  }
  .music:active { transform: scale(.94); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="word">MERRY CHRISTMAS</div>
<div class="sub">轻触屏幕 · 右下角可播放音乐</div>`n<button id="music" class="music" aria-label="播放音乐">♪</button>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var geo = { cx: 0, topY: 0, baseY: 0, h: 0, maxR: 0 };

  var branches = [];   // 枝桠
  var lights = [];     // 树上的暖灯
  var orns = [];       // 挂饰
  var stars = [];      // 夜空星
  var snow = [];       // 雪
  var sparks = [];     // 点击迸发
  var fgSnow = [];     // 近景虚化雪
  var gifts = [];      // 礼物盒

  var treeCanvas = null;   // 烘焙好的树
  var bgCanvas = null;     // 烘焙好的背景
  var glowSprite = null;   // 通用光晕
  var ornSprites = {};     // 挂饰预渲染
  var softSnow = null;     // 近景雪精灵

  var ORN_COLORS = [
    { h: 352, s: 78, l: 52 },   // 红
    { h: 44,  s: 88, l: 56 },   // 金
    { h: 196, s: 78, l: 58 },   // 冰蓝
    { h: 322, s: 62, l: 62 },   // 粉
    { h: 156, s: 55, l: 48 }    // 翠绿
  ];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ---------- 尺寸 ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    geo.cx = W / 2;
    geo.topY = H * 0.17;
    geo.baseY = H * 0.87;
    geo.h = geo.baseY - geo.topY;
    geo.maxR = Math.min(W * 0.32, geo.h * 0.30);

    build();
    bakeBackground();
    bakeTree();
    bakeSprites();
  }

  // ---------- 生成结构 ----------
  function build() {
    branches = [];
    var LEVELS = 54;
    for (var li = 0; li < LEVELS; li++) {
      var k = li / (LEVELS - 1);              // 0 顶 → 1 底
      var y = geo.topY + geo.h * k;
      if (k > 0.905) continue;
      var R = geo.maxR * Math.pow(k, 1.06);
      if (R < 2) continue;
      var n = Math.round(7 + 11 * k);          // 底部枝更多
      for (var b = 0; b < n; b++) {
        var side = (b % 2 === 0) ? -1 : 1;
        var spread = R * rnd(0.55, 1.06);
        var x0 = geo.cx + rnd(-R * 0.10, R * 0.10);
        var y0 = y + rnd(-5, 5);
        var x1 = geo.cx + side * spread;
        var y1 = y0 + spread * rnd(0.10, 0.26);      // 下垂
        var cxp = x0 + side * spread * 0.55;
        var cyp = Math.min(y0, y1) - spread * rnd(0.02, 0.10);
        branches.push({
          x0: x0, y0: y0, cxp: cxp, cyp: cyp, x1: x1, y1: y1,
          side: side,
          depth: k,                                   // 越靠下越前
          w: rnd(0.7, 1.9) * (0.55 + 0.9 * k),
          light: rnd(15, 30) + k * 9,                 // 明度
          hue: 146 + rnd(-8, 14),
          sat: rnd(26, 46)
        });
      }
    }
    // 让下层后画（在前面）
    branches.sort(function (a, b) { return a.depth - b.depth; });

    // ---- 灯与挂饰 ----
    lights = [];
    orns = [];
    var picks = branches.slice();
    for (var i = picks.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = picks[i]; picks[i] = picks[j]; picks[j] = tmp;
    }
    var lightN = Math.round(Math.min(90, Math.max(46, W / 6)));
    for (var l = 0; l < lightN && l < picks.length; l++) {
      var br = picks[l];
      var tt = rnd(0.35, 1.0);
      lights.push({
        x: quad(br.x0, br.cxp, br.x1, tt),
        y: quad(br.y0, br.cyp, br.y1, tt),
        r: rnd(0.9, 1.7),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.8, 2.2),
        warm: Math.random() < 0.7
      });
    }
    var ornN = Math.round(Math.min(52, Math.max(26, W / 11)));
    for (var o = 0; o < ornN && o < picks.length; o++) {
      var ob = picks[picks.length - 1 - o];
      var ot = rnd(0.45, 1.0);
      orns.push({
        x: quad(ob.x0, ob.cxp, ob.x1, ot),
        y: quad(ob.y0, ob.cyp, ob.y1, ot) + rnd(1, 4),
        r: rnd(3.0, 5.6),
        col: ORN_COLORS[o % ORN_COLORS.length],
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.5, 1.3)
      });
    }

    // ---- 星空 ----
    stars = [];
    var sn = Math.round(Math.min(170, W / 6));
    for (var s = 0; s < sn; s++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.80,
        r: rnd(0.3, 1.2),
        a: rnd(0.12, 0.6),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.4, 1.3)
      });
    }

    // ---- 雪 ----
    snow = [];
    var sf = Math.round(Math.min(170, Math.max(60, W / 5)));
    for (var f2 = 0; f2 < sf; f2++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rnd(0.6, 2.2),
        vy: rnd(10, 38),
        drift: rnd(-8, 8),
        ph: rnd(0, Math.PI * 2),
        a: rnd(0.18, 0.7)
      });
    }

    // ---- 近景虚化雪 ----
    fgSnow = [];
    var fgn = Math.round(Math.min(26, Math.max(10, W / 34)));
    for (var fg = 0; fg < fgn; fg++) {
      fgSnow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rnd(16, 46),
        vy: rnd(38, 90),
        drift: rnd(-14, 14),
        ph: rnd(0, Math.PI * 2),
        a: rnd(0.05, 0.16)
      });
    }
  }

  function quad(a, c, b, t) {
    var mt = 1 - t;
    return mt * mt * a + 2 * mt * t * c + t * t * b;
  }

  // ---------- 烘焙：背景 ----------
  function bakeBackground() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    var rg = g.createRadialGradient(W * 0.5, H * 0.28, 0, W * 0.5, H * 0.28, Math.max(W, H) * 0.9);
    rg.addColorStop(0, '#16223d');
    rg.addColorStop(0.35, '#0c1326');
    rg.addColorStop(0.72, '#060a15');
    rg.addColorStop(1, '#020307');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    // 极淡的极光
    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 3; i++) {
      var ay = H * (0.14 + i * 0.11);
      var ag = g.createLinearGradient(0, ay - 90, 0, ay + 90);
      ag.addColorStop(0, 'rgba(60,140,200,0)');
      ag.addColorStop(0.5, 'rgba(70,150,210,' + (0.03 - i * 0.007) + ')');
      ag.addColorStop(1, 'rgba(60,140,200,0)');
      g.fillStyle = ag;
      g.fillRect(0, ay - 90, W, 180);
    }
    g.globalCompositeOperation = 'source-over';
    bgCanvas = c;
  }

  // ---------- 烘焙：树 ----------
  function bakeTree() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 树干（只露下半段，上半段被树枝盖住）
    g.beginPath();
    g.moveTo(geo.cx - geo.maxR * 0.040, geo.baseY + 6);
    g.quadraticCurveTo(geo.cx - geo.maxR * 0.030, geo.topY + geo.h * 0.62, geo.cx - geo.maxR * 0.012, geo.topY + geo.h * 0.45);
    g.lineTo(geo.cx + geo.maxR * 0.012, geo.topY + geo.h * 0.45);
    g.quadraticCurveTo(geo.cx + geo.maxR * 0.030, geo.topY + geo.h * 0.62, geo.cx + geo.maxR * 0.040, geo.baseY + 6);
    g.closePath();
    var tg = g.createLinearGradient(geo.cx - 20, 0, geo.cx + 20, 0);
    tg.addColorStop(0, '#080503');
    tg.addColorStop(0.4, '#150e07');
    tg.addColorStop(0.7, '#100b06');
    tg.addColorStop(1, '#040302');
    g.fillStyle = tg;
    g.fill();

    // 内芯：不透明的暗色锥体，防止枝桠缝隙透出天空
    (function () {
      var steps2 = 44;
      for (var kk = 0; kk <= 1.0001; kk += 1 / steps2) {
        var yy = geo.topY + geo.h * kk;
        var rx = geo.maxR * Math.pow(kk, 1.06) * 0.985;
        var ry = Math.max(0.8, rx * 0.15);
        g.fillStyle = 'hsla(152, 34%, ' + (7 + 5 * kk).toFixed(1) + '%, ' + (0.88 + 0.09 * kk) + ')';
        g.beginPath();
        g.ellipse(geo.cx, yy, rx, ry, 0, 0, Math.PI * 2);
        g.fill();
      }
      // 中心的深阴影，做出圆柱受光的暗部
      var ig = g.createRadialGradient(geo.cx, geo.topY + geo.h * 0.62, 0, geo.cx, geo.topY + geo.h * 0.62, geo.maxR * 0.75);
      ig.addColorStop(0, 'rgba(0,0,0,0.28)');
      ig.addColorStop(0.62, 'rgba(0,0,0,0.10)');
      ig.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = ig;
      g.beginPath();
      g.ellipse(geo.cx, geo.topY + geo.h * 0.62, geo.maxR * 0.9, geo.h * 0.42, 0, 0, Math.PI * 2);
      g.fill();
    })();
    // 枝桠 + 针叶
    g.lineCap = 'round';
    for (var i = 0; i < branches.length; i++) {
      drawBranch(g, branches[i]);
    }

    // 针叶上的薄雪
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (var sd = 0; sd < 260; sd++) {
      var sb = branches[Math.floor(Math.random() * branches.length)];
      var st = rnd(0.5, 1.0);
      var sx = quad(sb.x0, sb.cxp, sb.x1, st) + rnd(-4, 4);
      var sy = quad(sb.y0, sb.cyp, sb.y1, st) + rnd(-3, 2);
      g.globalAlpha = rnd(0.10, 0.34);
      g.fillStyle = '#e8f2ff';
      g.beginPath();
      g.arc(sx, sy, rnd(0.5, 1.3), 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
    g.globalAlpha = 1;
    // 侧面明暗（整体体积）
    g.globalCompositeOperation = 'source-atop';
    var sg = g.createLinearGradient(geo.cx - geo.maxR, 0, geo.cx + geo.maxR, 0);
    sg.addColorStop(0, 'rgba(0,0,0,0.42)');
    sg.addColorStop(0.38, 'rgba(0,0,0,0.06)');
    sg.addColorStop(0.62, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(0,0,0,0.30)');
    g.fillStyle = sg;
    g.fillRect(0, 0, W, H);

    var vg = g.createLinearGradient(0, geo.topY, 0, geo.baseY + 20);
    vg.addColorStop(0, 'rgba(0,0,0,0.10)');
    vg.addColorStop(0.55, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.46)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    // 一点点月光从左上打过来
    g.globalCompositeOperation = 'lighter';
    var hg = g.createRadialGradient(geo.cx - geo.maxR * 0.45, geo.topY + geo.h * 0.28, 0, geo.cx - geo.maxR * 0.45, geo.topY + geo.h * 0.28, geo.maxR * 1.1);
    hg.addColorStop(0, 'rgba(150, 210, 255, 0.10)');
    hg.addColorStop(1, 'rgba(150, 210, 255, 0)');
    g.fillStyle = hg;
    g.fillRect(0, 0, W, H);

    // ---------- 积雪地面 ----------
    g.globalCompositeOperation = 'source-over';
    var mounds = [
      { x: geo.cx, y: geo.baseY + 10, rx: geo.maxR * 1.30, ry: geo.maxR * 0.20, a: 0.20 },
      { x: geo.cx - geo.maxR * 0.24, y: geo.baseY + 6, rx: geo.maxR * 0.72, ry: geo.maxR * 0.13, a: 0.14 },
      { x: geo.cx + geo.maxR * 0.30, y: geo.baseY + 8, rx: geo.maxR * 0.58, ry: geo.maxR * 0.11, a: 0.12 }
    ];
    mounds.forEach(function (m) {
      var mg = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.rx);
      mg.addColorStop(0, 'rgba(226, 240, 255,' + m.a + ')');
      mg.addColorStop(0.55, 'rgba(200, 222, 250,' + (m.a * 0.55) + ')');
      mg.addColorStop(1, 'rgba(180, 205, 240, 0)');
      g.fillStyle = mg;
      g.beginPath();
      g.ellipse(m.x, m.y, m.rx, m.ry, 0, 0, Math.PI * 2);
      g.fill();
    });

    g.save();
    g.globalCompositeOperation = 'lighter';
    for (var hsp = 0; hsp < 90; hsp++) {
      var hx = geo.cx + rnd(-geo.maxR * 1.15, geo.maxR * 1.15);
      var hy = geo.baseY + rnd(-4, geo.maxR * 0.14);
      g.globalAlpha = rnd(0.06, 0.20);
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(hx, hy, rnd(0.4, 1.2), 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
    g.globalAlpha = 1;

    // ---------- 可见树干 ----------
    drawFrontTrunk(g);

    // ---------- 礼物盒 ----------
    drawGifts(g);

    treeCanvas = c;
  }

  // ---------- 可见的下半段树干 ----------
  function drawFrontTrunk(g) {
    var topY = geo.topY + geo.h * 0.845;
    var botY = geo.baseY + geo.maxR * 0.040;
    var wT = geo.maxR * 0.040;
    var wB = geo.maxR * 0.062;

    g.save();
    g.beginPath();
    g.moveTo(geo.cx - wT, topY);
    g.quadraticCurveTo(geo.cx - wT * 2.2, (topY + botY) * 0.5, geo.cx - wB, botY - geo.maxR * 0.02);
    g.quadraticCurveTo(geo.cx - wB * 1.6, botY + geo.maxR * 0.012, geo.cx - wB * 2.0, botY + geo.maxR * 0.018);
    g.lineTo(geo.cx + wB * 2.0, botY + geo.maxR * 0.018);
    g.quadraticCurveTo(geo.cx + wB * 1.6, botY + geo.maxR * 0.012, geo.cx + wB, botY - geo.maxR * 0.02);
    g.quadraticCurveTo(geo.cx + wT * 2.2, (topY + botY) * 0.5, geo.cx + wT, topY);
    g.closePath();

    var grd = g.createLinearGradient(geo.cx - wB, 0, geo.cx + wB, 0);
    grd.addColorStop(0, '#1c1209');
    grd.addColorStop(0.2, '#63421f');
    grd.addColorStop(0.42, '#7a5228');
    grd.addColorStop(0.66, '#4d3419');
    grd.addColorStop(1, '#160d06');
    g.fillStyle = grd;
    g.fill();

    g.save();
    g.clip();
    for (var i = 0; i < 16; i++) {
      var xx = geo.cx + rnd(-wB * 0.95, wB * 0.95);
      g.strokeStyle = 'rgba(10,6,2,' + rnd(0.2, 0.5) + ')';
      g.lineWidth = rnd(0.5, 1.7);
      g.beginPath();
      g.moveTo(xx, topY + rnd(0, geo.h * 0.06));
      g.quadraticCurveTo(xx + rnd(-5, 5), (topY + botY) * 0.5, xx + rnd(-7, 7), botY + 4);
      g.stroke();
    }
    // 顶部与枝叶衔接：压一层暗绿，避免切口
    g.save();
    g.globalCompositeOperation = 'source-over';
    var blend = g.createLinearGradient(0, topY - 6, 0, topY + geo.maxR * 0.10);
    blend.addColorStop(0, 'hsla(150, 34%, 7%, 0.95)');
    blend.addColorStop(1, 'hsla(150, 34%, 7%, 0)');
    g.fillStyle = blend;
    g.fillRect(geo.cx - geo.maxR * 0.5, topY - 8, geo.maxR, geo.maxR * 0.12);
    g.restore();
    var rim = g.createLinearGradient(geo.cx + wB * 0.05, 0, geo.cx + wB * 1.15, 0);
    rim.addColorStop(0, 'rgba(255,196,120,0)');
    rim.addColorStop(1, 'rgba(255,196,120,0.26)');
    g.fillStyle = rim;
    g.fillRect(geo.cx - wB * 2, topY - 10, wB * 4, botY - topY + 30);
    g.restore();
    g.restore();
  }

  function drawBranch(g, b) {
    // 主枝
    g.beginPath();
    g.moveTo(b.x0, b.y0);
    g.quadraticCurveTo(b.cxp, b.cyp, b.x1, b.y1);
    g.lineWidth = b.w;
    g.strokeStyle = 'hsl(' + b.hue + ',' + (b.sat * 0.55) + '%,' + (b.light * 0.55) + '%)';
    g.stroke();

    // 针叶
    var steps = 12;
    for (var s = 1; s <= steps; s++) {
      var t = s / steps;
      var px = quad(b.x0, b.cxp, b.x1, t);
      var py = quad(b.y0, b.cyp, b.y1, t);
      // 切线方向
      var dx = 2 * (1 - t) * (b.cxp - b.x0) + 2 * t * (b.x1 - b.cxp);
      var dy = 2 * (1 - t) * (b.cyp - b.y0) + 2 * t * (b.y1 - b.cyp);
      var ang = Math.atan2(dy, dx);
      var fan = 3 + Math.round(2 * (1 - t));

      for (var n = 0; n < fan; n++) {
        var na = ang + rnd(-0.85, 0.85) + (b.side > 0 ? 0.18 : -0.18);
        var len = rnd(3, 9) * (0.6 + 0.7 * t);
        g.beginPath();
        g.moveTo(px, py);
        g.lineTo(px + Math.cos(na) * len, py + Math.sin(na) * len + 1.2);
        g.lineWidth = rnd(0.5, 1.05);
        g.strokeStyle = 'hsla(' + b.hue + ',' + rnd(24, 52) + '%,' + rnd(b.light - 6, b.light + 16) + '%,' + rnd(0.55, 0.95) + ')';
        g.stroke();
      }
    }

    // 枝尖一小簇亮针
    for (var k2 = 0; k2 < 4; k2++) {
      var ta = rnd(-1.2, 1.2) + (b.y1 > b.y0 ? 0.6 : 0);
      var tl = rnd(4, 9);
      g.beginPath();
      g.moveTo(b.x1, b.y1);
      g.lineTo(b.x1 + Math.cos(ta) * tl, b.y1 + Math.sin(ta) * tl);
      g.lineWidth = rnd(0.5, 0.9);
      g.strokeStyle = 'hsla(' + b.hue + ', 42%, ' + rnd(b.light + 10, b.light + 26) + '%, 0.9)';
      g.stroke();
    }
  }

  // ---------- 礼物盒 ----------
  function drawGifts(g) {
    var baseY = geo.baseY + geo.maxR * 0.06;
    var spec = [
      { dx: -0.74, w: 0.20, h: 0.15, hue: 352, sat: 68, lig: 44, rot: -0.05 },
      { dx: 0.62, w: 0.17, h: 0.13, hue: 44, sat: 78, lig: 52, rot: 0.06 },
      { dx: -0.40, w: 0.12, h: 0.10, hue: 156, sat: 45, lig: 38, rot: 0.03 },
      { dx: 0.34, w: 0.14, h: 0.11, hue: 196, sat: 60, lig: 46, rot: -0.04 }
    ];

    spec.forEach(function (b) {
      var w = geo.maxR * b.w;
      var h = geo.maxR * b.h;
      var x = geo.cx + geo.maxR * b.dx;
      var y = baseY - h * 0.5;
      var dp = h * 0.55;          // 顶面深度
      var off = w * 0.30;         // 侧面宽度

      // 地面投影
      g.save();
      g.globalAlpha = 0.35;
      var sh = g.createRadialGradient(x, baseY + 2, 0, x, baseY + 2, w * 1.5);
      sh.addColorStop(0, 'rgba(0,0,0,0.55)');
      sh.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh;
      g.beginPath();
      g.ellipse(x, baseY + 2, w * 1.5, h * 0.34, 0, 0, Math.PI * 2);
      g.fill();
      g.restore();

      g.save();
      g.translate(x, y);
      g.rotate(b.rot);

      // 正面
      var fg2 = g.createLinearGradient(-w / 2, 0, w / 2, 0);
      fg2.addColorStop(0, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 14) + '%)');
      fg2.addColorStop(0.45, 'hsl(' + b.hue + ',' + b.sat + '%,' + b.lig + '%)');
      fg2.addColorStop(1, 'hsl(' + b.hue + ',' + b.sat + '%,' + (b.lig - 20) + '%)');
      g.fillStyle = fg2;
      g.beginPath();
      g.moveTo(-w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, h / 2 + dp * 0.5);
      g.lineTo(-w / 2, h / 2 + dp * 0.5);
      g.closePath();
      g.fill();

      // 顶面
      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 12) + '%,' + (b.lig + 12) + '%)';
      g.beginPath();
      g.moveTo(-w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2 - off, -h / 2 - dp * 0.5);
      g.lineTo(-w / 2 - off, -h / 2 - dp * 0.5);
      g.closePath();
      g.fill();

      // 侧面
      g.fillStyle = 'hsl(' + b.hue + ',' + (b.sat - 6) + '%,' + (b.lig - 24) + '%)';
      g.beginPath();
      g.moveTo(w / 2, -h / 2 + dp * 0.5);
      g.lineTo(w / 2 - off, -h / 2 - dp * 0.5);
      g.lineTo(w / 2 - off, h / 2 - dp * 0.5);
      g.lineTo(w / 2, h / 2 + dp * 0.5);
      g.closePath();
      g.fill();

      // 缎带（正面竖 + 顶面横）
      g.fillStyle = 'hsla(44, 92%, 72%, 0.95)';
      g.fillRect(-w * 0.07, -h / 2 + dp * 0.5, w * 0.14, h);
      g.beginPath();
      g.moveTo(-w / 2, -h * 0.06 + dp * 0.5);
      g.lineTo(w / 2, -h * 0.06 + dp * 0.5);
      g.lineTo(w / 2 - off, -h * 0.06 - dp * 0.5);
      g.lineTo(-w / 2 - off, -h * 0.06 - dp * 0.5);
      g.closePath();
      g.fill();

      // 蝴蝶结
      var bw = w * 0.26, bh = h * 0.20;
      g.fillStyle = 'hsla(44, 95%, 78%, 0.98)';
      g.beginPath();
      g.ellipse(-bw * 0.55, -h / 2 - dp * 0.15, bw * 0.55, bh * 0.75, -0.5, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.ellipse(bw * 0.55, -h / 2 - dp * 0.15, bw * 0.55, bh * 0.75, 0.5, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = 'hsla(44, 95%, 62%, 1)';
      g.beginPath();
      g.arc(0, -h / 2 - dp * 0.15, bw * 0.26, 0, Math.PI * 2);
      g.fill();

      g.restore();
    });
  }
  // ---------- 烘焙：光晕精灵 ----------
  function bakeSprites() {
    var size = 96;
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.18, 'rgba(255,236,190,0.85)');
    rg.addColorStop(0.45, 'rgba(255,190,110,0.22)');
    rg.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, size, size);
    glowSprite = c;

    // 近景虚化雪的软精灵
    var ss = 128;
    var sc = document.createElement('canvas');
    sc.width = ss; sc.height = ss;
    var sg2 = sc.getContext('2d');
    var srg = sg2.createRadialGradient(ss/2, ss/2, 0, ss/2, ss/2, ss/2);
    srg.addColorStop(0, 'rgba(255,255,255,0.95)');
    srg.addColorStop(0.35, 'rgba(245,250,255,0.55)');
    srg.addColorStop(0.62, 'rgba(235,244,255,0.20)');
    srg.addColorStop(1, 'rgba(230,240,255,0)');
    sg2.fillStyle = srg;
    sg2.fillRect(0, 0, ss, ss);
    softSnow = sc;

    ornSprites = {};
    ORN_COLORS.forEach(function (col, idx) {
      var s2 = 96;
      var cc = document.createElement('canvas');
      cc.width = s2; cc.height = s2;
      var gg = cc.getContext('2d');
      var cx = s2 / 2, cy = s2 / 2, R = s2 * 0.31;

      // 球体
      var bg = gg.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.08, cx, cy, R);
      bg.addColorStop(0, 'hsl(' + col.h + ',' + col.s + '%,' + Math.min(92, col.l + 34) + '%)');
      bg.addColorStop(0.45, 'hsl(' + col.h + ',' + col.s + '%,' + col.l + '%)');
      bg.addColorStop(1, 'hsl(' + col.h + ',' + col.s + '%,' + Math.max(14, col.l - 30) + '%)');
      gg.fillStyle = bg;
      gg.beginPath();
      gg.arc(cx, cy, R, 0, Math.PI * 2);
      gg.fill();

      // 高光
      gg.fillStyle = 'rgba(255,255,255,0.72)';
      gg.beginPath();
      gg.ellipse(cx - R * 0.33, cy - R * 0.4, R * 0.24, R * 0.17, -0.6, 0, Math.PI * 2);
      gg.fill();

      // 底部反光
      gg.fillStyle = 'hsla(' + col.h + ', 60%, 85%, 0.18)';
      gg.beginPath();
      gg.ellipse(cx + R * 0.15, cy + R * 0.5, R * 0.42, R * 0.16, 0.2, 0, Math.PI * 2);
      gg.fill();

      ornSprites[idx] = cc;
    });
  }

  // ---------- 每帧 ----------
  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#e6eeff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGround(t) {
    var pulse = 0.6 + 0.12 * Math.sin(t * 0.8);
    var g = ctx.createRadialGradient(geo.cx, geo.baseY + 12, 0, geo.cx, geo.baseY + 12, geo.maxR * 1.45);
    g.addColorStop(0, 'rgba(120, 220, 170,' + (0.10 * pulse) + ')');
    g.addColorStop(0.5, 'rgba(60, 140, 110,' + (0.04 * pulse) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(geo.cx, geo.baseY + 12, geo.maxR * 1.45, geo.maxR * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 雪地
    var sg = ctx.createRadialGradient(geo.cx, geo.baseY + 8, 0, geo.cx, geo.baseY + 8, geo.maxR * 1.2);
    sg.addColorStop(0, 'rgba(200, 225, 255, 0.09)');
    sg.addColorStop(0.7, 'rgba(170, 200, 245, 0.035)');
    sg.addColorStop(1, 'rgba(150, 180, 230, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(geo.cx, geo.baseY + 10, geo.maxR * 1.2, geo.maxR * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLights(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < lights.length; i++) {
      var L = lights[i];
      var tw = 0.45 + 0.55 * Math.sin(t * L.sp + L.ph);
      var size = (5 + 7 * tw) * (L.warm ? 1 : 0.9);
      ctx.globalAlpha = 0.30 + 0.55 * tw;
      ctx.drawImage(glowSprite, L.x - size, L.y - size, size * 2, size * 2);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = L.warm ? 'rgba(255, 236, 190, 1)' : 'rgba(220, 240, 255, 1)';
      ctx.beginPath();
      ctx.arc(L.x, L.y, L.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawOrns(t) {
    for (var i = 0; i < orns.length; i++) {
      var o = orns[i];
      var pulse = 0.62 + 0.38 * Math.sin(t * o.sp + o.ph);
      var r = o.r * (1 + 0.05 * pulse);
      var idx = i % ORN_COLORS.length;

      // 挂线
      ctx.strokeStyle = 'rgba(210, 220, 210, 0.18)';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - r - 5);
      ctx.lineTo(o.x, o.y - r);
      ctx.stroke();

      // 光晕
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.22 * pulse;
      var gs = r * 3.6;
      ctx.drawImage(glowSprite, o.x - gs, o.y - gs, gs * 2, gs * 2);
      ctx.restore();

      // 球
      ctx.drawImage(ornSprites[idx], o.x - r * 1.6, o.y - r * 1.6, r * 3.2, r * 3.2);
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(t) {
    var x = geo.cx, y = geo.topY - geo.h * 0.035;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.5);
    var R = Math.min(W, H) * 0.030 + pulse * 2.2;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 4; i++) {
      var ang = t * 0.22 + i * Math.PI / 2;
      var len = R * (5.0 + pulse * 1.4);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      var lg = ctx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255, 238, 185, ' + (0.42 + 0.22 * pulse) + ')');
      lg.addColorStop(0.4, 'rgba(255, 210, 120, 0.07)');
      lg.addColorStop(1, 'rgba(255, 190, 90, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.14);
      ctx.lineTo(len, 0);
      ctx.lineTo(0, R * 0.14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    var gg = ctx.createRadialGradient(x, y, 0, x, y, R * 4);
    gg.addColorStop(0, 'rgba(255, 246, 205, ' + (0.5 + 0.22 * pulse) + ')');
    gg.addColorStop(0.32, 'rgba(255, 205, 110, 0.14)');
    gg.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, R * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    for (var p = 0; p < 10; p++) {
      var rr = (p % 2 === 0) ? R : R * 0.42;
      var pa = -Math.PI / 2 + p * Math.PI / 5;
      var px = x + Math.cos(pa) * rr;
      var py = y + Math.sin(pa) * rr;
      if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var sg = ctx.createRadialGradient(x, y - R * 0.25, 0, x, y, R);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(0.45, '#fff4c8');
    sg.addColorStop(1, '#efb247');
    ctx.fillStyle = sg;
    ctx.shadowColor = 'rgba(255, 220, 140, .85)';
    ctx.shadowBlur = 22 + pulse * 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawSnow(dt, t) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.8 + f.ph) * 5) * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;

      ctx.globalAlpha = f.a * (0.75 + 0.25 * Math.sin(t * 2 + f.ph));
      ctx.fillStyle = '#eaf2ff';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 46 * dt;
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      var a = Math.max(0, s.life / s.max);
      ctx.globalAlpha = a * 0.9;
      var sz = 18 * a + 6;
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(glowSprite, s.x - sz, s.y - sz, sz * 2, sz * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a;
      ctx.fillStyle = 'hsl(' + s.hue + ', 95%, 72%)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFG(dt, t) {
    if (!softSnow) return;
    for (var i = 0; i < fgSnow.length; i++) {
      var f = fgSnow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.55 + f.ph) * 12) * dt;
      if (f.y - f.r > H + 30) { f.y = -f.r * 1.6; f.x = Math.random() * W; }
      if (f.x < -f.r * 2) f.x = W + f.r;
      if (f.x > W + f.r * 2) f.x = -f.r;

      ctx.globalAlpha = f.a * (0.7 + 0.3 * Math.sin(t * 1.4 + f.ph));
      ctx.drawImage(softSnow, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
    ctx.globalAlpha = 1;
  }
  // ---------- 交互 ----------
  function burst(px, py) {
    for (var i = 0; i < 24; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rnd(40, 180);
      sparks.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rnd(10, 50),
        r: rnd(1.1, 2.6),
        hue: rnd(30, 55),
        life: rnd(0.6, 1.4),
        max: 1.4
      });
    }
  }

  canvas.addEventListener('pointerdown', function (e) { burst(e.clientX, e.clientY); });

  // ---------- 音乐（点击才播） ----------
  var A = { ctx: null, master: null, on: false, nextTime: 0, idx: 0, timer: null };
  var BEAT = 0.46;

  // 铃儿响叮当（C 大调，简化为音乐盒式单音）
  var MELODY = [
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [64,1],[62,1],[62,1],[64,1],[62,1],[67,3],
    [64,1],[64,1],[64,1],[64,1],[64,1],[64,1],
    [64,1],[67,1],[60,1],[62,1],[64,3],
    [65,1],[65,1],[65,1],[65,1],[65,1],[64,1],[64,1],[64,1],
    [67,1],[67,1],[65,1],[62,1],[60,4]
  ];

  function midi2freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function bell(freq, when, dur) {
    var c = A.ctx;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.20, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.5, dur * 1.9));
    g.connect(A.master);

    var o1 = c.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = freq;
    o1.connect(g);

    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, when);
    g2.gain.exponentialRampToValueAtTime(0.055, when + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.35, dur * 1.2));
    g2.connect(A.master);

    var o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.006;
    o2.connect(g2);

    o1.start(when); o2.start(when);
    o1.stop(when + dur * 2 + 0.4);
    o2.stop(when + dur * 2 + 0.4);
  }

  function schedule() {
    if (!A.on) return;
    var c = A.ctx;
    while (A.nextTime < c.currentTime + 0.3) {
      var n = MELODY[A.idx % MELODY.length];
      bell(midi2freq(n[0]), A.nextTime, n[1] * BEAT);
      if (A.idx % 8 === 0) bell(midi2freq(A.idx % 16 === 0 ? 48 : 43), A.nextTime, 1.6);
      A.nextTime += n[1] * BEAT;
      A.idx++;
      if (A.idx % MELODY.length === 0) A.nextTime += BEAT * 2.2;
    }
  }

  var musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (!A.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.32;
      A.master.connect(A.ctx.destination);
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();

    A.on = !A.on;
    musicBtn.classList.toggle('playing', A.on);
    musicBtn.textContent = A.on ? '❙❙' : '♪';
    musicBtn.style.fontSize = A.on ? '15px' : '19px';

    if (A.on) {
      A.nextTime = A.ctx.currentTime + 0.15;
      A.idx = 0;
      if (!A.timer) A.timer = setInterval(schedule, 60);
      schedule();
    }
  });
  musicBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });


  // ---------- 主循环 ----------
  var last = performance.now(), t0 = last;

  function renderScene(t, dt) {
    // 背景（烘焙 + 星星）
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
    drawStars(t);

    var camScale = 1 + Math.sin(t * 0.4) * 0.005;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(camScale, camScale);
    ctx.translate(-W / 2, -H / 2);

    drawGround(t);
    if (treeCanvas) ctx.drawImage(treeCanvas, 0, 0, W, H);
    drawLights(t);
    drawOrns(t);
    drawStar(t);

    ctx.restore();

    drawSnow(dt, t);
    drawFG(dt, t);
    drawSparks(dt);
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    renderScene((now - t0) / 1000, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  resize();
  renderScene(1.2, 0);
  requestAnimationFrame(frame);
})();
</script>
