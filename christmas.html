<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Merry Christmas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
  body { -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .word {
    position: fixed; left: 0; right: 0; bottom: max(6vh, 28px);
    text-align: center; pointer-events: none;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Songti SC", serif;
    font-size: clamp(18px, 4.6vw, 34px);
    letter-spacing: .42em; text-indent: .42em;
    color: rgba(255, 240, 214, .92);
    text-shadow: 0 0 24px rgba(255, 205, 120, .45), 0 0 60px rgba(255, 170, 80, .22);
    opacity: 0; transform: translateY(10px);
    animation: rise 2.4s cubic-bezier(.2,.7,.2,1) 1.1s forwards;
  }
  .sub {
    position: fixed; left: 0; right: 0; bottom: max(3.4vh, 14px);
    text-align: center; pointer-events: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 11px; letter-spacing: .3em; color: rgba(190, 205, 230, .34);
    opacity: 0; animation: rise 2s ease 2.2s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="word">MERRY CHRISTMAS</div>
<div class="sub">轻触屏幕</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var tree = [];      // 树身粒子
  var orns = [];      // 挂饰
  var garland = [];   // 灯串
  var tips = [];      // 外缘碎枝
  var stars = [];     // 背景星
  var snow = [];      // 雪
  var sparks = [];    // 点击迸发

  var geo = { cx: 0, topY: 0, baseY: 0, h: 0, maxR: 0 };

  var PALETTE = [
    { h: 350, s: 85, l: 62 },  // 红
    { h: 42,  s: 95, l: 64 },  // 金
    { h: 190, s: 90, l: 66 },  // 冰蓝
    { h: 320, s: 80, l: 70 },  // 粉
    { h: 150, s: 70, l: 60 }   // 翠绿
  ];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function build() {
    geo.cx = W / 2;
    geo.topY = H * 0.19;
    geo.baseY = H * 0.88;
    geo.h = geo.baseY - geo.topY;
    geo.maxR = Math.min(W * 0.33, geo.h * 0.31);

    // ---- 树身 ----
    tree = [];
    var count = Math.round(Math.min(760, Math.max(340, (W * H) / 1400)));
    for (var i = 0; i < count; i++) {
      var t = Math.pow(Math.random(), 0.78);          // 下密上疏
      var y = geo.topY + geo.h * t;
      var r = geo.maxR * Math.pow(t, 1.06) * rnd(0.55, 1.0);
      var a = rnd(0, Math.PI * 2);
      var bright = Math.random() < 0.12;
      tree.push({
        x: geo.cx + Math.cos(a) * r,
        y: y + rnd(-3, 3),
        r: bright ? rnd(1.4, 2.4) : rnd(0.6, 1.5),
        hue: 140 + rnd(-12, 16),
        light: bright ? rnd(72, 88) : rnd(38, 64),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.5, 1.6)
      });
    }

    // ---- 外缘碎枝 ----
    tips = [];
    var tn = Math.round(Math.min(240, Math.max(90, W / 2.4)));
    for (var ti2 = 0; ti2 < tn; ti2++) {
      var kk2 = Math.pow(Math.random(), 0.75);
      var ty2 = geo.topY + geo.h * kk2;
      var tr2 = geo.maxR * Math.pow(kk2, 1.05);
      var side = Math.random() < 0.5 ? -1 : 1;
      tips.push({
        x: geo.cx + side * tr2,
        y: ty2 + rnd(-2, 2),
        dx: side * rnd(2, 10) * (0.55 + 0.6 * kk2),
        dy: rnd(2, 9),
        w: rnd(0.7, 1.8),
        l: rnd(24, 44),
        a: rnd(0.28, 0.62),
        ph: rnd(0, Math.PI * 2)
      });
    }
    // ---- 灯串（螺旋） ----
    garland = [];
    var seg = 260;
    for (var g = 0; g <= seg; g++) {
      var gt = g / seg;
      var gr = geo.maxR * Math.pow(gt, 1.04) * 0.95;
      var ga = gt * Math.PI * 2 * 6.5;
      garland.push({ x: geo.cx + Math.cos(ga) * gr, y: geo.topY + geo.h * gt + Math.sin(ga) * gr * 0.10 });
    }

    // ---- 挂饰 ----
    orns = [];
    var on = Math.round(Math.min(64, Math.max(32, W / 14)));
    for (var k = 0; k < on; k++) {
      var ot = Math.pow(rnd(0.08, 1), 0.9);
      var oa = rnd(0, Math.PI * 2);
      var orr = geo.maxR * Math.pow(ot, 1.02) * rnd(0.82, 1.0);
      var col = PALETTE[k % PALETTE.length];
      orns.push({
        x: geo.cx + Math.cos(oa) * orr,
        y: geo.topY + geo.h * ot,
        r: rnd(3.2, 6.2),
        hue: col.h, sat: col.s, lig: col.l,
        ph: rnd(0, Math.PI * 2),
        speed: rnd(0.6, 1.4)
      });
    }

    // ---- 背景星 ----
    stars = [];
    var sn = Math.round(Math.min(160, W / 6));
    for (var s = 0; s < sn; s++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.78,
        r: rnd(0.3, 1.3),
        a: rnd(0.15, 0.75),
        ph: rnd(0, Math.PI * 2),
        sp: rnd(0.4, 1.3)
      });
    }

    // ---- 雪 ----
    snow = [];
    var snw = Math.round(Math.min(180, Math.max(60, W / 5)));
    for (var f = 0; f < snw; f++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rnd(0.7, 2.4),
        vy: rnd(12, 42),
        drift: rnd(-9, 9),
        ph: rnd(0, Math.PI * 2),
        a: rnd(0.22, 0.8)
      });
    }
  }

  // ---------- 绘制 ----------
  function drawBg(t) {
    var g = ctx.createRadialGradient(W * 0.5, H * 0.30, 0, W * 0.5, H * 0.30, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#111d38');
    g.addColorStop(0.45, '#0a1122');
    g.addColorStop(1, '#04060d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 极淡的极光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 3; i++) {
      var ay = H * (0.12 + i * 0.10) + Math.sin(t * 0.25 + i) * 12;
      var ag = ctx.createLinearGradient(0, ay - 80, 0, ay + 80);
      ag.addColorStop(0, 'rgba(60,140,200,0)');
      ag.addColorStop(0.5, 'rgba(70,150,210,' + (0.035 - i * 0.008) + ')');
      ag.addColorStop(1, 'rgba(60,140,200,0)');
      ctx.fillStyle = ag;
      ctx.fillRect(0, ay - 80, W, 160);
    }
    ctx.restore();

    // 星星
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var tw = 0.55 + 0.45 * Math.sin(t * st.sp + st.ph);
      ctx.globalAlpha = st.a * tw;
      ctx.fillStyle = '#dfe9ff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGroundGlow(t) {
    var g = ctx.createRadialGradient(geo.cx, geo.baseY + 16, 0, geo.cx, geo.baseY + 16, geo.maxR * 1.5);
    var pulse = 0.55 + 0.15 * Math.sin(t * 0.9);
    g.addColorStop(0, 'rgba(90, 200, 150,' + (0.14 * pulse) + ')');
    g.addColorStop(0.55, 'rgba(40, 120, 100,' + (0.05 * pulse) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(geo.cx, geo.baseY + 16, geo.maxR * 1.5, geo.maxR * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTree(t) {
    // 实体树身：分层枝桠，每层一个下垂的扇形
    var TIERS = 6;
    for (var ti3 = 0; ti3 < TIERS; ti3++) {
      var k0 = ti3 / TIERS;
      var k1 = (ti3 + 1) / TIERS;
      var yTop = geo.topY + geo.h * k0 * 0.94;
      var yBot = geo.topY + geo.h * Math.min(1, k1 + 0.03);
      var halfW = geo.maxR * Math.pow(k1, 1.02);
      var sag = halfW * 0.13;

      ctx.beginPath();
      ctx.moveTo(geo.cx, yTop);
      ctx.quadraticCurveTo(geo.cx - halfW * 0.55, yBot - sag * 0.6, geo.cx - halfW, yBot);
      ctx.quadraticCurveTo(geo.cx, yBot + sag, geo.cx + halfW, yBot);
      ctx.quadraticCurveTo(geo.cx + halfW * 0.55, yBot - sag * 0.6, geo.cx, yTop);
      ctx.closePath();

      var gTop = ctx.createLinearGradient(0, yTop, 0, yBot + sag);
      var l0 = 13 + ti3 * 0.6;
      var l1 = 18 + ti3 * 0.8;
      gTop.addColorStop(0, 'hsla(158, 46%, ' + l0 + '%, 0.95)');
      gTop.addColorStop(0.72, 'hsla(154, 42%, ' + l1 + '%, 0.88)');
      gTop.addColorStop(1, 'hsla(150, 38%, ' + (l1 + 6) + '%, 0.55)');
      ctx.fillStyle = gTop;
      ctx.fill();

      // 枝尖亮边
      ctx.strokeStyle = 'rgba(120, 225, 170, 0.13)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // 侧面高光 / 背光，让锥体有体积感
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(geo.cx, geo.topY - 2);
    ctx.lineTo(geo.cx - geo.maxR * 0.99, geo.baseY);
    ctx.lineTo(geo.cx + geo.maxR * 0.99, geo.baseY);
    ctx.closePath();
    ctx.clip();
    var hl = ctx.createLinearGradient(geo.cx - geo.maxR, geo.topY, geo.cx + geo.maxR, geo.baseY);
    hl.addColorStop(0, 'rgba(150, 255, 205, 0.055)');
    hl.addColorStop(0.45, 'rgba(0, 0, 0, 0)');
    hl.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
    ctx.fillStyle = hl;
    ctx.fillRect(geo.cx - geo.maxR, geo.topY, geo.maxR * 2, geo.h);
    ctx.restore();
    // 外缘碎枝：树的毛边
    ctx.save();
    for (var q2 = 0; q2 < tips.length; q2++) {
      var tp = tips[q2];
      ctx.globalAlpha = tp.a * (0.7 + 0.3 * Math.sin(t * 1.2 + tp.ph));
      ctx.strokeStyle = 'hsl(150, 38%, ' + tp.l + '%)';
      ctx.lineWidth = tp.w;
      ctx.beginPath();
      ctx.moveTo(tp.x, tp.y);
      ctx.lineTo(tp.x + tp.dx, tp.y + tp.dy);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // 树下雪堆
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var mound = ctx.createRadialGradient(geo.cx, geo.baseY + 6, 0, geo.cx, geo.baseY + 6, geo.maxR * 1.12);
    mound.addColorStop(0, 'rgba(190, 220, 255, 0.13)');
    mound.addColorStop(0.6, 'rgba(150, 190, 240, 0.05)');
    mound.addColorStop(1, 'rgba(120, 160, 220, 0)');
    ctx.fillStyle = mound;
    ctx.beginPath();
    ctx.ellipse(geo.cx, geo.baseY + 6, geo.maxR * 1.12, geo.maxR * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 柔和的光晕层
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < tree.length; i++) {
      var p = tree[i];
      var tw = 0.55 + 0.45 * Math.sin(t * p.sp + p.ph);
      ctx.globalAlpha = 0.05 * tw;
      ctx.fillStyle = 'hsl(' + p.hue + ',' + 70 + '%,' + Math.min(70, p.light + 8) + '%)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 实心点
    for (var j = 0; j < tree.length; j++) {
      var q = tree[j];
      var tw2 = 0.5 + 0.5 * Math.sin(t * q.sp + q.ph);
      ctx.globalAlpha = 0.35 + 0.45 * tw2;
      ctx.fillStyle = 'hsl(' + q.hue + ',' + (q.light > 70 ? 85 : 60) + '%,' + q.light + '%)';
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGarland(t) {
    if (garland.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 缠绕在树上的小灯珠
    var n = 46;
    for (var k = 0; k < n; k++) {
      var prog = (k / n + (t * 0.035) % 1) % 1;
      var idx = Math.floor(prog * (garland.length - 1));
      var g = garland[idx];
      var flick = 0.45 + 0.55 * Math.sin(t * 2.6 + k * 1.7);
      var warm = k % 5 === 0;

      ctx.globalAlpha = 0.35 + 0.55 * flick;
      ctx.fillStyle = warm ? 'rgba(255, 214, 150, 0.95)' : 'rgba(255, 240, 205, 0.85)';
      ctx.beginPath();
      ctx.arc(g.x, g.y, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.055 * flick;
      ctx.beginPath();
      ctx.arc(g.x, g.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawOrns(t) {
    ctx.save();
    for (var i = 0; i < orns.length; i++) {
      var o = orns[i];
      var pulse = 0.62 + 0.38 * Math.sin(t * o.speed + o.ph);
      var r = o.r * (0.94 + 0.08 * pulse);
      var lig = 44 + 22 * pulse;

      // 外发光
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 4.2);
      g.addColorStop(0, 'hsla(' + o.hue + ',' + o.sat + '%,' + lig + '%,' + (0.32 * pulse) + ')');
      g.addColorStop(1, 'hsla(' + o.hue + ',' + o.sat + '%,50%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r * 4.2, 0, Math.PI * 2);
      ctx.fill();

      // 球体
      ctx.globalCompositeOperation = 'source-over';
      var ball = ctx.createRadialGradient(o.x - r * 0.35, o.y - r * 0.4, r * 0.1, o.x, o.y, r);
      ball.addColorStop(0, 'hsl(' + o.hue + ',' + o.sat + '%,' + (lig + 26) + '%)');
      ball.addColorStop(0.55, 'hsl(' + o.hue + ',' + o.sat + '%,' + lig + '%)');
      ball.addColorStop(1, 'hsl(' + o.hue + ',' + o.sat + '%,' + Math.max(18, lig - 26) + '%)');
      ctx.fillStyle = ball;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.3 * pulse) + ')';
      ctx.beginPath();
      ctx.arc(o.x - r * 0.34, o.y - r * 0.38, r * 0.26, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawStar(t) {
    var x = geo.cx, y = geo.topY - 6;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.6);
    var R = Math.min(W, H) * 0.032 + pulse * 2.5;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 光芒
    for (var i = 0; i < 4; i++) {
      var ang = t * 0.25 + i * Math.PI / 2;
      var len = R * (5.5 + pulse * 1.6);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      var lg = ctx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255, 236, 180, ' + (0.5 + 0.25 * pulse) + ')');
      lg.addColorStop(0.35, 'rgba(255, 210, 120, 0.10)');
      lg.addColorStop(1, 'rgba(255, 190, 90, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.16);
      ctx.lineTo(len, 0);
      ctx.lineTo(0, R * 0.16);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 光晕
    var gg = ctx.createRadialGradient(x, y, 0, x, y, R * 4.5);
    gg.addColorStop(0, 'rgba(255, 245, 200, ' + (0.55 + 0.25 * pulse) + ')');
    gg.addColorStop(0.35, 'rgba(255, 205, 110, 0.16)');
    gg.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, R * 4.5, 0, Math.PI * 2);
    ctx.fill();

    // 五角星本体
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    for (var p = 0; p < 10; p++) {
      var rr = (p % 2 === 0) ? R : R * 0.42;
      var pa = -Math.PI / 2 + p * Math.PI / 5;
      var px = x + Math.cos(pa) * rr;
      var py = y + Math.sin(pa) * rr;
      if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var sg = ctx.createRadialGradient(x, y - R * 0.25, 0, x, y, R);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(0.45, '#fff2c0');
    sg.addColorStop(1, '#f0b64a');
    ctx.fillStyle = sg;
    ctx.shadowColor = 'rgba(255, 220, 140, .9)';
    ctx.shadowBlur = 26 + pulse * 18;
    ctx.fill();
    ctx.restore();
  }

  function drawSnow(dt, t) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.vy * dt;
      f.x += (f.drift + Math.sin(t * 0.8 + f.ph) * 6) * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;

      ctx.globalAlpha = f.a * (0.75 + 0.25 * Math.sin(t * 2 + f.ph));
      ctx.fillStyle = '#e8f1ff';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 46 * dt;
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      var a = Math.max(0, s.life / s.max);
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = 'hsl(' + s.hue + ', 95%, ' + (60 + 20 * a) + '%)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a * 0.22;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * a * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- 交互 ----------
  function burst(px, py) {
    for (var i = 0; i < 26; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rnd(40, 190);
      sparks.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rnd(10, 60),
        r: rnd(1.2, 3.0),
        hue: rnd(28, 58),
        life: rnd(0.6, 1.5),
        max: 1.5
      });
    }
    // 挂饰一起闪一下
    for (var k = 0; k < orns.length; k++) orns[k].ph += 0.9;
  }

  canvas.addEventListener('pointerdown', function (e) {
    burst(e.clientX, e.clientY);
  });

  // ---------- 主循环 ----------
  var last = performance.now();
  var t0 = last;
  var camScale = 1;

  function renderScene(t, dt) {
    camScale = 1 + Math.sin(t * 0.45) * 0.006;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(camScale, camScale);
    ctx.translate(-W / 2, -H / 2);

    drawBg(t);
    drawGroundGlow(t);
    drawGarland(t);
    drawTree(t);
    drawOrns(t);
    drawStar(t);
    drawSnow(dt, t);
    drawSparks(dt);

    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    renderScene((now - t0) / 1000, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  resize();
  renderScene(1.0, 0);   // 先画一帧，避免首屏黑屏
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
