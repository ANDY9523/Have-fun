<style>

  header { flex: 0 0 auto; padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; }

  .brand .sub { font-size: 12px; color: #a08a9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub b { color: #ff6f91; font-weight: 700; }
  .icon-btn {
    flex: 0 0 auto; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    color: #f0e6ee; border-radius: 10px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .icon-btn:active { transform: scale(.96); }

  .tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 2px 14px 8px; }
  .tab {
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #b9a7b4;
    border-radius: 11px; padding: 9px 6px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;

  .tab .n { display: block; font-size: 10.5px; font-weight: 500; opacity: .7; margin-top: 1px; }
  .tab.active { color: #16101a; background: linear-gradient(180deg, #ffd08a, #ff9f6e); border-color: transparent; box-shadow: 0 6px 18px rgba(255,140,90,.25); }
  .tab.active .n { opacity: .75; }

  .picked {
    flex: 0 0 auto; margin: 0 14px 6px; padding: 12px 14px 13px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.09);
    background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    min-height: 86px; position: relative; overflow: hidden;
    transition: border-color .25s ease, background .25s ease;
  }
  .picked::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, #ff6f91, #ffb26b); opacity: .55; transition: opacity .25s;
  }
  .picked.spinning::before { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  .picked.has-result { border-color: rgba(255,111,145,.4); background: linear-gradient(180deg, rgba(255,111,145,.11), rgba(255,255,255,.02)); }
  .picked.has-result::before { opacity: 1; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  .picked .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .picked .tag { font-size: 10.5px; letter-spacing: 1px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.12); color: #d8c9d3; font-weight: 700; flex: 0 0 auto; }
  .picked.has-result .tag { background: #ffd08a; color: #1a1218; }
  .picked .name { font-size: 18px; font-weight: 800; letter-spacing: .5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picked.has-result .name { font-size: 20px; }
  .picked .desc { margin: 0; font-size: 12.5px; line-height: 1.62; color: #b6a4b1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .picked.has-result .desc { color: #d9ccd5; }

  main { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px 6px; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wheel { display: block; border-radius: 50%; box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 8px rgba(255,255,255,.04); touch-action: none; }
  .pointer { position: absolute; top: 0; left: 50%; transform: translate(-50%, -2px); width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 26px solid #ff4155; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); z-index: 3; pointer-events: none; }
  .pointer::after { content: ""; position: absolute; left: -7px; top: -26px; width: 14px; height: 14px; background: #ff4155; border-radius: 50%; }
  #spinBtn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22%; max-width: 92px; aspect-ratio: 1; min-width: 60px; border-radius: 50%; border: none; cursor: pointer; z-index: 2;

  footer { flex: 0 0 auto; padding: 0 16px 12px; text-align: center; font-size: 11.5px; color: #8d7684; line-height: 1.6; }

  .sheet { position: fixed; inset: 0; z-index: 30; background: #150d13; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); padding-top: env(safe-area-inset-top); }

  .tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tools button { border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.06); color: #eee2ea; border-radius: 9px; padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .tools button.danger { color: #ff8a9f; border-color: rgba(255,90,120,.35); background: rgba(255,90,120,.08); }
  .list { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px 30px; }
  .item { display: grid; grid-template-columns: 30px 1fr 34px; gap: 8px; align-items: start; padding: 10px 10px 10px 6px; border-radius: 12px; background: rgba(255,255,255,.035); margin-bottom: 8px; border: 1px solid transparent; }

  .item .fields { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .item input { width: 100%; background: transparent; border: none; outline: none; color: #f4edf2; font-family: inherit; font-size: 14.5px; font-weight: 650; padding: 3px 2px; border-bottom: 1px dashed rgba(255,255,255,.09); }
  .item input.desc { font-size: 12.5px; font-weight: 400; color: #a795a2; }
  .item .del { border: none; background: transparent; color: #6e5a68; font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
  .item .del:active { color: #ff6f91; }
  .empty { text-align: center; color: #7d6876; padding: 40px 10px; font-size: 13px; }

  @media (min-width: 760px) {
    header { padding: 18px 26px 8px; }
    .brand h1 { font-size: 19px; }
    .tabs { margin: 0 26px 10px; }
    .picked { margin: 0 26px 8px; padding: 14px 18px; }
    .picked .name { font-size: 20px; }
    .picked.has-result .name { font-size: 23px; }

    main { padding: 0 20px 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>喝酒轮盘</h1>
    <div class="sub">三个转盘独立抽 · 共 <b id="totalCount">300</b> 条 · 适量饮酒，别上头</div>
  </div>
  <button class="icon-btn" id="editBtn">编辑</button>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="drink">喝酒玩法<span class="n" id="n-drink">92 条</span></button>
  <button class="tab" data-tab="truth">真心话<span class="n" id="n-truth">104 条</span></button>
  <button class="tab" data-tab="dare">大冒险<span class="n" id="n-dare">104 条</span></button>
</div>

<section class="picked" id="picked">
  <div class="row1">
    <span class="tag" id="pTag">待抽取</span>
    <span class="name" id="pName">点中间的「转」开始</span>
  </div>
  <p class="desc" id="pDesc">喝酒玩法、真心话、大冒险三个盘各自独立，转出什么就执行什么。想加减内容点右上角「编辑」。</p>
</section>

<main>
  <div id="stage">
    <canvas id="wheel"></canvas>
    <div class="pointer"></div>
    <button id="spinBtn" aria-label="开始转动">转</button>
  </div>
</main>

<footer>适量饮酒 · 未成年人请勿饮酒 · 大冒险做不到可以换成喝一口</footer>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="row1">
      <h3 id="editTitle">编辑</h3>
      <button class="icon-btn" id="closeEdit">完成</button>
    </div>
    <p class="hint">只改当前这个转盘。标题是轮盘上显示的字（尽量短），说明是抽中后展开的完整内容。改动自动存在本机浏览器里。</p>
    <div class="tools">
      <button id="addBtn">+ 添加一条</button>
      <button id="exportBtn">导出 JSON</button>
      <button id="importBtn">导入 JSON</button>
      <button class="danger" id="resetBtn">恢复默认</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

      ['俯卧撑','做五个俯卧撑，做不了可以用深蹲代替。','体力'],
      ['深蹲','做十个深蹲，边做边报数。','体力'],
      ['平板三十秒','平板支撑三十秒。','体力'],
      ['开合跳','做十五个开合跳。','体力'],
      ['高抬腿','原地高抬腿二十秒。','体力'],
      ['靠墙静蹲','靠墙静蹲三十秒。','体力'],
      ['弓步','左右弓步各五次。','体力'],
      ['踢腿','正踢腿十次，保持平衡。','体力'],
      ['假装呼啦圈','假装转呼啦圈三十秒。','体力'],
      ['假装跳绳','假装跳绳五十下。','体力'],
      ['蹲起唱歌','边深蹲边唱一首歌。','体力'],
      ['单腿平衡','单腿站立一分钟。','体力'],
      // 无道具整活 14
      ['木头人','保持一个姿势一分钟不动，动了重来。','整活'],
      ['只动不说','接下来三轮不许说话，只能用动作表达。','整活'],
      ['只能四字','接下来五分钟只能说四个字的话。','整活'],
      ['倒着说','接下来三句话要倒着说（词序倒）。','整活'],
      ['先拍手','接下来一轮每次说话前先拍两下手。','整活'],
      ['用第三人称','接下来一轮用第三人称称呼自己。','整活'],
      ['唱着说话','接下来五句话都要唱出来。','整活'],
      ['只能点头','接下来三分钟只能点头或摇头。','整活'],
      ['憋笑一分钟','接下来一分钟不许笑。','整活'],
      ['模仿一个人','接下来五分钟模仿在场一个人说话。','整活'],
      ['慢动作','接下来一轮所有动作放慢三倍。','整活'],
      ['先敬礼','每说一句话前先敬个礼。','整活'],
      ['闭眼一分钟','闭眼待一分钟，不能睁开。','整活'],
      ['跳着数数','从 1 数到 100，跳着数，错了重来。','整活'],
      // 社死加强版 16
      ['公放语音','打开和在场某个人的聊天记录，随机点开一条语音公放出来。','社死'],
      ['朋友圈秘密','发一条「我有个秘密要告诉大家」，五分钟后才能删。','社死'],
      ['盲打电话','给通讯录第十个人打电话，说「我最近过得很好」，说完就挂。','社死'],
      ['家庭群报平安','在家庭群发「我今天特别想你们」，等有人回复才能放下手机。','社死'],
      ['最新一张照片','打开手机相册最新一张照片，给大家看并解释它是什么。','社死'],
      ['丑照发圈','用一张自己最丑的自拍发朋友圈，配文随便，五分钟不能删。','社死'],
      ['朗读朋友圈','大声朗读你最近发的一条朋友圈，包括点赞和评论。','社死'],
      ['群发夸夸','在同学群或工作群里夸一个人，等对方回复才能收手。','社死'],
      ['投屏三十秒','把手机交给旁边的人，让他随便打开一个 App 给大家看三十秒。','社死'],
      ['假身份电话','给一个朋友打电话，用假身份演三十秒，最后说「打错了」。','社死'],
      ['大声说秘密','说一个自己的秘密，声音要大到隔壁包间能听见。','社死'],
      ['读聊天记录','把和在场某个人的聊天往上翻十条，念出来。','社死'],
      ['模仿全场','依次模仿在场每个人说一句话，学不像罚一杯。','社死'],
      ['手写名字','用笔在手臂上写下在场一个人的名字，保留到散场。','社死'],
      ['当服务员','接下来十分钟你是全场服务员，随叫随到，被投诉就喝一杯。','社死'],
      ['视频认人','给一个朋友打视频，只露出下巴说「你能认出我吗」。','社死'],
    ]
  };

  var META = {
    drink: { key: 'drink.wheel.v2', title: '喝酒玩法' },
    truth: { key: 'truth.wheel.v1', title: '真心话' },
    dare: { key: 'dare.wheel.v2', title: '大冒险' }
  };
  var PALETTE = ['#ffb3c7', '#ff8e6e', '#ffe45c', '#7be8e0', '#ff9be0', '#c9b6ff', '#b8f3a0', '#ffd9a0'];

  var current = 'drink';
  var store = {};      // tab -> items [{n,d,c}]
  var rotation = -Math.PI / 2;
  var spinning = false;
  var sizePx = 0;

  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var spinBtn = document.getElementById('spinBtn');
  var stage = document.getElementById('stage');
  var picked = document.getElementById('picked');
  var pTag = document.getElementById('pTag');
  var pName = document.getElementById('pName');
  var pDesc = document.getElementById('pDesc');
  var listEl = document.getElementById('list');
  var sheet = document.getElementById('sheet');
  var pointer = document.querySelector('.pointer');

  function clone(arr) { return arr.map(function (a) { return { n: a[0], d: a[1], c: a[2] }; }); }

  function load(tab) {
    try {
      var raw = localStorage.getItem(META[tab].key);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length) {
          return arr.map(function (r) { return { n: String(r.n || '未命名'), d: String(r.d || ''), c: String(r.c || '') }; });
        }
      }
    } catch (e) {}
    return clone(DEFAULTS[tab]);
  }
  function save(tab) {
    try { localStorage.setItem(META[tab].key, JSON.stringify(store[tab])); } catch (e) {}
  }

  Object.keys(META).forEach(function (k) {
    store[k] = load(k);
    var el = document.getElementById('n-' + k);
    if (el) el.textContent = store[k].length + ' 条';
  });
  document.getElementById('totalCount').textContent =
    store.drink.length + store.truth.length + store.dare.length;

  function items() { return store[current]; }

  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var size = Math.max(160, Math.min(w, h));
    sizePx = size;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
    var st = stage.getBoundingClientRect(), cv = canvas.getBoundingClientRect();
    pointer.style.top = Math.max(0, cv.top - st.top - 16) + 'px';
  }

  function draw() {
    var list = items(), N = list.length;
    var S = sizePx, cx = S / 2, cy = S / 2, R = S / 2 - 2, inner = R * 0.24;
    ctx.clearRect(0, 0, S, S);
    if (!N) {
      ctx.fillStyle = '#241722';
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8d7684'; ctx.font = '600 ' + Math.max(12, S * 0.04) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('这个盘还是空的，点右上角「编辑」添加', cx, cy + R * 0.55);
      return;
    }
    var step = Math.PI * 2 / N;
    // 分类配色：同类扇区同色，转盘上能看出结构
    var catIndex = {}, catSeq = [];
    for (var k = 0; k < N; k++) {
      var c0 = list[k].c || '';
      if (!(c0 in catIndex)) { catIndex[c0] = catSeq.length; catSeq.push(c0); }
    }
    for (var i = 0; i < N; i++) {
      var a0 = rotation + i * step, a1 = a0 + step;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * inner, cy + Math.sin(a0) * inner);
      ctx.arc(cx, cy, R, a0, a1);
      ctx.arc(cx, cy, inner, a1, a0, true);
      ctx.closePath();
      ctx.fillStyle = PALETTE[(catIndex[list[i].c || ''] || 0) % PALETTE.length];
      ctx.fill();
      if (N <= 120) {
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = N > 60 ? 0.6 : 1.1;
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a0 + step / 2);
      var arcW = (Math.PI * 2 * R * 0.72) / N;
      var fs = Math.min(19, Math.max(6.8, arcW * 0.68));
      ctx.font = '800 ' + fs.toFixed(1) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.97)';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.3)';
      ctx.shadowBlur = 3;
      var text = list[i].n, maxLen = R * 0.38;
      while (ctx.measureText(text).width > maxLen && text.length > 1) text = text.slice(0, -1);
      if (text !== list[i].n) text += '…';
      ctx.fillText(text, R * 0.94, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, inner * 1.02, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = S * 0.03;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(2, S * 0.008); ctx.stroke();
  }

  function spin() {
    if (spinning || !items().length) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = '…';
    picked.classList.remove('has-result');
    picked.classList.add('spinning');
    pTag.textContent = '转动中';
    pName.textContent = '看看这次抽到什么…';
    pDesc.textContent = '马上出结果。';

    var N = items().length, step = Math.PI * 2 / N;
    var idx = Math.floor(Math.random() * N);
    var target = -Math.PI / 2 - (idx + 0.5) * step + (Math.random() - 0.5) * step * 0.55;
    var start = rotation;
    var delta = ((target - start) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    var turns = 5 + Math.floor(Math.random() * 3);
    var end = start + delta + turns * Math.PI * 2;
    var dur = 4200 + Math.random() * 600;
    var t0 = performance.now();

    function frame(t) {
      var p = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3.4);
      rotation = start + (end - start) * e;
      draw();
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = end % (Math.PI * 2);
        spinning = false;
        spinBtn.disabled = false;
        spinBtn.textContent = '转';
        showResult(idx);
      }
    }
    requestAnimationFrame(frame);
  }

  function showResult(i) {
    var r = items()[i];
    if (!r) return;
    picked.classList.remove('spinning');
    picked.classList.add('has-result');
    pTag.textContent = r.c || META[current].title;
    pName.textContent = r.n;
    pDesc.textContent = r.d || '没有补充说明，现场自由发挥。';
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === current);
    });
    document.getElementById('editTitle').textContent = '编辑 · ' + META[current].title;
  }

  function switchTab(tab) {
    if (spinning || tab === current) return;
    current = tab;
    rotation = -Math.PI / 2;
    picked.classList.remove('has-result', 'spinning');
    pTag.textContent = '待抽取';
    pName.textContent = '点中间的「转」开始';
    pDesc.textContent = '当前是「' + META[tab].title + '」盘，共 ' + store[tab].length + ' 条。';
    renderTabs();
    layout();
  }

  function renderList() {
    var list = items();
    document.getElementById('editTitle').textContent = '编辑 · ' + META[current].title + '（' + list.length + ' 条）';
    listEl.innerHTML = '';
    if (!list.length) {
      listEl.innerHTML = '<div class="empty">这个盘是空的，点上方「+ 添加一条」开始。</div>';
      return;
    }
    list.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'item';

      var idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = i + 1;

      var fields = document.createElement('div');
      fields.className = 'fields';

      var nameInput = document.createElement('input');
      nameInput.value = r.n;
      nameInput.maxLength = 26;
      nameInput.placeholder = '轮盘上显示的字';
      nameInput.addEventListener('input', function () {
        r.n = nameInput.value || '未命名';
        save(current); draw();
      });

      var descInput = document.createElement('input');
      descInput.className = 'desc';
      descInput.value = r.d;
      descInput.placeholder = '完整内容（抽中后展示）';
      descInput.addEventListener('input', function () { r.d = descInput.value; save(current); });

      fields.appendChild(nameInput);
      fields.appendChild(descInput);

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.addEventListener('click', function () {
        list.splice(i, 1);
        save(current); renderList(); draw();
        document.getElementById('n-' + current).textContent = list.length + ' 条';
        document.getElementById('totalCount').textContent = store.drink.length + store.truth.length + store.dare.length;
      });

      row.appendChild(idx);
      row.appendChild(fields);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  }

  function openEditor() { renderList(); sheet.classList.add('show'); }
  function closeEditor() { sheet.classList.remove('show'); layout(); }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) switchTab(b.dataset.tab);
  });
  document.getElementById('editBtn').addEventListener('click', openEditor);
  document.getElementById('closeEdit').addEventListener('click', closeEditor);

  document.getElementById('addBtn').addEventListener('click', function () {
    items().push({ n: '新条目 ' + (items().length + 1), d: '', c: '自定义' });
    save(current); renderList(); draw();
    document.getElementById('n-' + current).textContent = items().length + ' 条';
    document.getElementById('totalCount').textContent = store.drink.length + store.truth.length + store.dare.length;
    listEl.scrollTop = listEl.scrollHeight;
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('恢复「' + META[current].title + '」的默认内容？你改过的会被覆盖。')) return;
    store[current] = clone(DEFAULTS[current]);
    save(current); renderList(); layout();
    document.getElementById('n-' + current).textContent = store[current].length + ' 条';
    document.getElementById('totalCount').textContent = store.drink.length + store.truth.length + store.dare.length;
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(store[current], null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = current + '-wheel.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var arr = JSON.parse(String(fr.result));
        if (!Array.isArray(arr) || !arr.length) throw new Error('bad');
        store[current] = arr.map(function (r) {
          return { n: String(r.n || '未命名'), d: String(r.d || ''), c: String(r.c || '') };
        });
        save(current); renderList(); layout();
        document.getElementById('n-' + current).textContent = store[current].length + ' 条';
      } catch (e) { alert('导入失败：需要一个包含 n / d 的 JSON 数组'); }
      fileInput.value = '';
    };
    fr.readAsText(f);
  });

  spinBtn.addEventListener('click', spin);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !spinning) {
      if (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      e.preventDefault();
      spin();
    }
    if (e.key === 'Escape' && sheet.classList.contains('show')) closeEditor();
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });

  renderTabs();
  layout();

  // 调试：?tab=truth 或 #truth 切换；#result 显示第一条
  var params = new URLSearchParams(location.search);
  var initial = params.get('tab') || (location.hash || '').replace('#', '');
  if (initial && META[initial] && initial !== current) switchTab(initial);
  if (location.hash === '#result') setTimeout(function () { showResult(3); }, 250);
})();
</script>
