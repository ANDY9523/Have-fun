<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1210">
<meta name="color-scheme" content="dark">
<meta name="description" content="离线优先的个人健身记录：训练会话、组记录、休息计时与统计。数据只保存在本机浏览器。">
<meta name="format-detection" content="telephone=no">
<title>训练日志</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1210'/%3E%3Cpath d='M9 9h4v14H9zm10 0h4v14h-4zM13 14h6v4h-6z' fill='%23d9a54a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1210;
  --bg-elevated:#141815;
  --surface:#171b18;
  --surface-2:#1d221e;
  --surface-3:#242a25;
  --line:#2a302b;
  --line-strong:#3a433b;
  --text:#e9ede5;
  --text-2:#aeb6aa;
  --text-3:#838b80;
  --accent:#d9a54a;
  --accent-press:#c7933a;
  --accent-ink:#181308;
  --accent-soft:rgba(217,165,74,.11);
  --accent-line:rgba(217,165,74,.48);
  --ok:#96b67d;
  --ok-soft:rgba(150,182,125,.12);
  --danger:#d7857b;
  --danger-soft:rgba(215,133,123,.10);
  --danger-line:rgba(215,133,123,.38);
  --warning:#c9a06a;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --radius:12px;
  --radius-sm:9px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{
  background:var(--bg);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scrollbar-color:var(--line-strong) transparent;
  scrollbar-width:thin;
}
body{
  margin:0;
  min-width:320px;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{
  min-height:44px;
  padding:0;
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea,select{touch-action:manipulation}
a{color:var(--text)}
p,h1,h2,h3,h4{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
::selection{background:rgba(217,165,74,.3);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{
  font-size:16px;
  min-width:0;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  min-height:46px;
  padding:10px 12px;
}
input::placeholder,textarea::placeholder{color:var(--text-3)}
input:focus,textarea:focus{outline:none;border-color:var(--accent-line)}
textarea{resize:vertical;line-height:1.55}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.muted{color:var(--text-2)}
.tiny{font-size:11.5px;color:var(--text-3)}
.chev{font-style:normal;font-size:16px;line-height:1;color:var(--text-3)}
.sr-only{
  position:absolute!important;width:1px!important;height:1px!important;
  padding:0!important;margin:-1px!important;overflow:hidden!important;
  clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;
}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:12px}

/* Top bar */
.top{
  position:sticky;
  top:0;
  z-index:30;
  padding-top:var(--safe-t);
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
@supports ((-webkit-backdrop-filter:blur(10px)) or (backdrop-filter:blur(10px))){
  .top{background:rgba(15,18,16,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
}
.top-inner{max-width:760px;margin:0 auto;padding:0 16px}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-rule{width:3px;height:24px;flex:none;background:var(--accent)}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand-sub{font-size:10px;font-weight:500;letter-spacing:.06em;color:var(--text-3);margin-top:2px}
.btn-data{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:56px;min-height:44px;padding:0 12px;
  border:1px solid var(--line);border-radius:8px;
  background:transparent;color:var(--text-2);font-size:13px;font-weight:500;
  transition:background-color .12s ease,color .12s ease;
}
.btn-data:active{background:var(--surface-2);color:var(--text)}
.tabs{display:flex;gap:2px;min-width:0}
.tab{
  position:relative;flex:1;min-height:46px;min-width:44px;
  color:var(--text-3);font-size:13.5px;font-weight:500;
  transition:color .12s ease;
}
.tab[aria-current="page"]{color:var(--text);font-weight:600}
.tab[aria-current="page"]::after{
  content:"";position:absolute;left:50%;bottom:-1px;width:26px;height:2px;
  transform:translateX(-50%);background:var(--accent);border-radius:1px;
}
body.db-fatal .tabs{display:none}

/* Page shell */
.view{
  max-width:760px;
  margin:0 auto;
  padding:22px 16px calc(56px + var(--safe-b));
  min-width:0;
}
body.has-dock .view{padding-bottom:calc(136px + var(--safe-b))}
body.has-rest .view{padding-bottom:calc(158px + var(--safe-b))}
.page-head{margin:0 0 18px}
.page-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{
  font-size:10.5px;font-weight:600;letter-spacing:.1em;
  color:var(--text-3);text-transform:uppercase;margin-bottom:7px;
}
.page-head h1{font-size:27px;line-height:1.18;font-weight:650;letter-spacing:-.022em}
.page-sub{margin-top:7px;color:var(--text-2);font-size:13px;line-height:1.5}
.page-sub strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-head h2{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.section-hint{margin-top:3px;font-size:11.5px;color:var(--text-3);line-height:1.4}
.kicker{
  font-size:10.5px;font-weight:600;letter-spacing:.09em;
  color:var(--text-3);text-transform:uppercase;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}
.card + .card{margin-top:12px}
.link-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;margin:-8px -8px -8px 0;padding:0 8px;
  border-radius:8px;color:var(--text-2);font-size:12.5px;font-weight:500;
}
.link-btn:active{background:var(--surface-2);color:var(--text)}
.text-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:0 6px;
  border-radius:7px;color:var(--text-2);font-size:12px;font-weight:500;
}
.text-btn:active{background:var(--surface-2);color:var(--text)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:46px;padding:0 16px;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text);
  font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;
  transition:background-color .12s ease,border-color .12s ease,transform .08s ease,color .12s ease;
}
.btn:active{transform:scale(.985);background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:active{background:var(--accent-press);border-color:var(--accent-press)}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn-outline:active{background:var(--surface-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:active{background:var(--surface-2);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--danger-line);color:var(--danger)}
.btn-danger:active{background:var(--danger-soft)}
.btn-block{width:100%}
.btn-lg{min-height:54px;font-size:15px}
.btn-sm{min-height:44px;padding:0 12px;font-size:13px}

/* Home */
.home-layout{display:block;min-width:0}
.home-main{min-width:0}
.home-side{display:flex;flex-direction:column;gap:12px;margin-top:12px;min-width:0}
.fav-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fav-tile{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  min-width:0;min-height:66px;padding:10px 12px;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  transition:background-color .12s ease,border-color .12s ease;
}
.fav-tile:active{background:var(--accent-soft);border-color:var(--accent-line)}
.fav-name{display:block;width:100%;font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-meta{
  display:block;width:100%;margin-top:4px;
  font-size:10.8px;color:var(--text-3);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.other-ex-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:44px;margin-top:8px;padding:0 3px;
  border-radius:7px;color:var(--text-2);font-size:12.5px;font-weight:500;
}
.other-ex-btn:active{color:var(--text)}
.empty-inline{padding:16px 0 8px;border-top:1px solid var(--line)}
.empty-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.4}
.empty-text{margin-top:4px;font-size:12px;color:var(--text-3);line-height:1.55}
.empty-inline .btn{margin-top:12px}
.last-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  width:100%;min-height:116px;padding:15px 16px;
  text-align:left;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--line);
  transition:background-color .12s ease,border-color .12s ease;
}
button.last-card:active{background:var(--surface-2);border-color:var(--line-strong)}
.last-title{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--text);margin-top:2px}
.last-meta{font-size:11.8px;line-height:1.45;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.last-link{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11.8px;font-weight:500;color:var(--accent)}
.start-button{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:66px;padding:11px 16px;
  border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  text-align:left;
  transition:background-color .12s ease,transform .08s ease;
}
.start-button:active{background:var(--accent-press);transform:scale(.99)}
.start-copy{display:block;min-width:0}
.start-copy strong{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.start-copy span{display:block;margin-top:3px;font-size:10.8px;font-weight:500;line-height:1.35;opacity:.72}
.start-cta{display:inline-flex;align-items:center;gap:2px;flex:none;font-size:13px;font-weight:700}
.start-cta .chev{color:currentColor;font-size:17px}

/* Active session */
.session-card{
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:16px;
}
.session-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--text-2);line-height:1.2}
.live-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--accent)}
.session-start{margin-top:5px;font-size:11px;color:var(--text-3);line-height:1.4}
.session-clock{
  margin-top:11px;color:var(--text);
  font-family:var(--mono);font-size:36px;font-weight:600;line-height:1.05;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.session-sub{margin-top:7px;font-size:11.5px;color:var(--text-3);line-height:1.45}
.exercise-chips{margin:12px 0 10px;min-width:0}
.chip-row{
  display:flex;gap:8px;min-width:0;overflow-x:auto;
  padding:2px 0 4px;overscroll-behavior-x:contain;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 13px;
  border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text-2);
  font-size:12.8px;font-weight:500;white-space:nowrap;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease;
}
.chip:active{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.chip .count{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .count{color:var(--accent)}
.sets-card{padding:16px 16px 6px;margin-top:0}
.set-list{margin-top:8px;border-top:1px solid var(--line)}
.set-row{
  display:flex;align-items:center;gap:2px;
  min-height:60px;border-bottom:1px solid var(--line);
}
.set-mark{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  border-radius:8px;color:var(--ok);
}
.set-mark:active{background:var(--surface-2)}
.set-mark .mark{
  display:grid;place-items:center;width:22px;height:22px;
  border:1px solid var(--line-strong);border-radius:50%;
  color:transparent;font-size:12px;line-height:1;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease;
}
.set-row.is-done .set-mark .mark{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.set-body{
  flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
  min-height:52px;padding:7px 4px;border-radius:6px;text-align:left;
}
.set-body:active{background:var(--surface-2)}
.set-main{
  display:block;min-width:0;text-align:left;color:var(--text);
  font-size:16px;font-weight:600;line-height:1.3;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
}
.set-sub{display:block;margin-top:3px;color:var(--text-3);font-size:11px;line-height:1.35;text-align:left}
.set-row.is-pending .set-main{color:var(--text-2);font-weight:500}
.set-row.is-pending .set-mark .mark{border-style:dashed}
.set-del{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  border-radius:8px;color:var(--text-3);font-size:19px;line-height:1;
}
.set-del:active{background:var(--danger-soft);color:var(--danger)}
.set-footer{
  display:flex;flex-wrap:wrap;gap:4px 14px;
  padding:11px 0 9px;border-bottom:1px solid transparent;
  color:var(--text-3);font-size:11px;line-height:1.4;
}
.set-footer strong{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.set-empty{padding:22px 2px 20px}
.set-empty .empty-title{font-size:13px}
.set-empty .empty-text{max-width:320px}

/* Fixed session dock */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:10px 0 calc(10px + var(--safe-b));
  background:var(--bg-elevated);
  border-top:1px solid var(--line-strong);
}
.dock-inner{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  max-width:760px;margin:0 auto;padding:0 16px;
}
.dock-pick{
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  min-width:0;min-height:50px;padding:2px 4px;border-radius:8px;text-align:left;
}
.dock-pick:active{background:var(--surface-2)}
.dock-kicker{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--text-3);line-height:1.3}
.dock-name{
  display:flex;align-items:center;gap:5px;max-width:100%;
  font-size:14.5px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dock-add{min-width:130px;min-height:50px;font-size:14.5px}

/* Rest timer */
.rest-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  padding:12px 0 calc(10px + var(--safe-b));
  background:var(--surface);
  border-top:1px solid var(--accent);
}
.rest-bar.is-ended{border-top-color:var(--ok)}
.rest-inner{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  max-width:760px;margin:0 auto;padding:0 16px;
}
.rest-info{min-width:0}
.rest-kicker{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--text-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-mainline{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-width:0}
.rest-time{
  font-family:var(--mono);font-size:38px;font-weight:600;line-height:1;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--text);
  transition:color .2s ease;white-space:nowrap;
}
.rest-time.soon{color:var(--accent)}
.rest-bar.is-ended .rest-time{color:var(--ok)}
.rest-caption{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.rest-track{height:2px;margin-top:8px;background:var(--line);border-radius:1px;overflow:hidden}
.rest-fill{display:block;height:100%;background:var(--accent);transform-origin:left center;transition:transform .2s linear;will-change:transform}
.rest-bar.is-ended .rest-fill{background:var(--ok)}
.rest-actions{display:flex;align-items:center;gap:6px;flex:none}
.rest-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:46px;padding:0 8px;
  border:1px solid var(--line-strong);border-radius:8px;
  background:transparent;color:var(--text-2);
  font-size:12px;font-weight:600;white-space:nowrap;
}
.rest-btn:active{background:var(--surface-2);color:var(--text)}
.rest-btn.primary{background:var(--surface-2);color:var(--text);border-color:var(--line-strong)}

/* Sheets */
.sheet-scrim{
  position:fixed;inset:0;z-index:60;
  background:rgba(4,6,4,.66);
  animation:fadeIn .16s ease-out;
}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  width:100%;max-width:600px;margin:0 auto;
  max-height:88vh;max-height:88dvh;
  display:flex;flex-direction:column;
  background:var(--bg-elevated);
  border:1px solid var(--line-strong);border-bottom:0;
  border-radius:16px 16px 0 0;
  padding-bottom:var(--safe-b);
  animation:sheetIn .2s cubic-bezier(.2,.8,.2,1);
}
.sheet-grip{width:36px;height:3px;flex:none;margin:8px auto 0;border-radius:2px;background:var(--line-strong)}
.sheet-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  flex:none;padding:8px 16px 10px;
}
.sheet-title{font-size:19px;font-weight:650;letter-spacing:-.018em;line-height:1.28}
.sheet-sub{margin-top:4px;font-size:11.5px;color:var(--text-3);line-height:1.45}
.sheet-close{
  flex:none;display:grid;place-items:center;
  width:44px;height:44px;margin:-4px -8px 0 0;padding:0;
  border-radius:8px;color:var(--text-2);font-size:22px;line-height:1;font-weight:400;
}
.sheet-close:active{background:var(--surface-2);color:var(--text)}
.sheet-body{
  overflow-y:auto;overscroll-behavior:contain;
  padding:4px 16px 18px;min-height:0;
  -webkit-overflow-scrolling:touch;
}
.sheet-foot{
  flex:none;display:flex;gap:8px;
  padding:12px 16px calc(12px + 0px);
  border-top:1px solid var(--line);
  background:var(--bg-elevated);
}
.sheet-foot .btn{flex:1;min-width:0}
.sheet-foot .btn-danger{flex:0 0 auto;min-width:88px}

/* Record sheet */
.ex-select{
  display:flex;align-items:center;gap:10px;width:100%;min-height:56px;
  padding:9px 12px;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
}
.ex-select:active{background:var(--surface-2);border-color:var(--line-strong)}
.ex-select-main{flex:1;min-width:0}
.ex-select-name{display:block;font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-select-meta{display:block;margin-top:2px;font-size:10.5px;color:var(--text-3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-select-change{flex:none;display:inline-flex;align-items:center;gap:2px;font-size:11.5px;color:var(--accent);font-weight:500}
.ex-lock{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:52px;padding:8px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
  font-size:13px;color:var(--text-2);
}
.ex-lock span:last-child{font-size:10.5px;color:var(--text-3)}
.field{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-bottom:4px}
.field-label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-2)}
.field-inline{display:flex;align-items:baseline;gap:6px;margin-left:8px}
.field-current{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-left:7px}
.value-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:11px;min-width:0}
.value-row .custom-inline{flex:1;margin:0}
.big-value{
  display:flex;align-items:baseline;gap:6px;
  font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.big-unit{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:0;color:var(--text-3)}
.custom-inline{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-width:0}
.custom-inline .num-input{flex:1;min-width:0}
.input-unit{flex:none;font-size:12px;color:var(--text-3)}
.num-input{
  width:100%;min-height:50px;padding:6px 12px;
  font-family:var(--mono);font-size:24px;font-weight:600;
  letter-spacing:-.02em;border-color:var(--accent-line);border-radius:8px;
  background:var(--bg);color:var(--text);
}
.custom-hint{margin:-3px 0 9px;font-size:10.5px;color:var(--text-3);line-height:1.4}
.step-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step-btn{
  min-height:48px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;
  transition:background-color .12s ease,border-color .12s ease;
}
.step-btn:active{background:var(--accent-soft);border-color:var(--accent-line)}
.quick-grid{display:grid;gap:6px;margin-top:2px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.quick-btn{
  min-width:0;min-height:48px;padding:0 2px;
  border:1px solid var(--line-strong);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease;
}
.quick-btn:active{background:var(--surface-2)}
.quick-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:2px}
.rpe-btn{
  min-width:0;min-height:44px;padding:0 2px;
  border:1px solid var(--line-strong);border-radius:8px;
  background:var(--bg);color:var(--text-2);font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease;
}
.rpe-btn.small-label{font-size:11px;font-weight:500}
.rpe-btn:active{background:var(--surface-2)}
.rpe-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.field-custom-link{
  display:flex;align-items:center;justify-content:flex-start;
  min-height:44px;padding:0 2px;color:var(--text-2);font-size:11.5px;
}
.input-hint{margin-top:8px;font-size:10.5px;color:var(--text-3);line-height:1.45}
.check-row{
  display:flex;align-items:center;gap:10px;
  min-height:48px;margin-top:8px;padding:4px 0;
  font-size:12.5px;color:var(--text-2);cursor:pointer;
}
.check-row input{
  flex:none;width:20px;height:20px;min-height:0;
  accent-color:var(--accent);
}

/* Picker */
.search-wrap{margin:2px 0 6px}
.search-input{width:100%;min-height:48px;border-color:var(--line);border-radius:9px}
.picker-list{display:flex;flex-direction:column;margin-top:6px}
.picker-row{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  width:100%;min-height:62px;padding:10px 6px;
  border-bottom:1px solid var(--line);border-radius:0;
  text-align:left;
}
.picker-row:first-child{border-top:1px solid var(--line)}
.picker-row:active{background:var(--surface-2)}
.picker-row-top{display:flex;align-items:center;gap:7px;width:100%;min-width:0}
.picker-name{font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-last{margin-left:auto;flex:none;font-size:10px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.picker-meta{margin-top:3px;font-size:10.5px;color:var(--text-3);line-height:1.35;display:flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.picker-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-row.is-selected .picker-name{color:var(--accent)}
.mini-badge{
  display:inline-flex;align-items:center;flex:none;
  padding:1px 5px;border:1px solid var(--line-strong);border-radius:4px;
  color:var(--text-3);font-size:9px;font-weight:500;line-height:1.4;
}
.mini-badge.accent{color:var(--accent);border-color:var(--accent-line)}
.list-empty{padding:22px 4px;color:var(--text-3);font-size:12.5px;line-height:1.55}

/* Finish / summary */
.summary-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  margin-top:14px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.summary-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.summary-cell{background:var(--bg);padding:12px 13px;min-width:0}
.summary-value{
  font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
}
.summary-value .unit{font-size:10.5px;font-weight:400;color:var(--text-3);margin-left:2px}
.summary-label{margin-top:3px;font-size:10px;font-weight:500;letter-spacing:.05em;color:var(--text-3);line-height:1.35}
.note-field{margin-top:16px}
.note-label{display:block;margin-bottom:6px;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--text-2)}
.finish-note{width:100%;min-height:86px;border-color:var(--line);border-radius:9px}
.warning-line{margin-top:10px;font-size:11.5px;color:var(--warning);line-height:1.5}
.danger-zone{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.text-danger{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;min-width:44px;padding:0 8px;
  color:var(--danger);font-size:12px;font-weight:500;border-radius:7px;
}
.text-danger:active{background:var(--danger-soft)}

/* Data sheet */
.data-section{padding:15px 0;border-top:1px solid var(--line)}
.data-section:first-child{padding-top:2px;border-top:0}
.data-title{font-size:13.5px;font-weight:600;line-height:1.4}
.data-desc{margin-top:5px;font-size:11.5px;color:var(--text-3);line-height:1.55}
.data-strong{color:var(--text-2);font-weight:500}
.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.data-actions .btn{flex:1 1 calc(50% - 4px);min-width:120px;padding:0 10px;font-size:13px}
.status-line{display:flex;align-items:flex-start;gap:7px;margin-top:7px;font-size:11.5px;color:var(--text-2);line-height:1.5}
.status-dot{width:6px;height:6px;flex:none;margin-top:6px;border-radius:50%;background:var(--text-3)}
.status-dot.ok{background:var(--ok)}
.status-dot.warn{background:var(--accent)}
.status-dot.off{background:var(--danger)}
.choice-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.choice-btn{
  min-width:0;min-height:48px;padding:0 2px;
  border:1px solid var(--line-strong);border-radius:8px;
  background:var(--bg);color:var(--text-2);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.choice-btn:active{background:var(--surface-2)}
.choice-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.custom-rest{display:flex;align-items:center;gap:8px;margin-top:9px}
.custom-rest input{flex:1;min-width:0;min-height:44px;font-family:var(--mono);font-size:16px;font-weight:600;padding:6px 10px}
.custom-rest .btn{min-width:64px;min-height:44px;padding:0 10px;font-size:12px;flex:none}
.custom-rest .unit{flex:none;font-size:11px;color:var(--text-3)}
.form-field{margin-top:14px}
.form-label{display:block;margin-bottom:6px;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--text-2)}
.form-input{width:100%;min-height:48px;border-color:var(--line)}
.form-hint{margin-top:5px;font-size:10.5px;color:var(--text-3);line-height:1.45}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.metric-btn{
  min-width:0;min-height:52px;padding:4px 2px;
  border:1px solid var(--line-strong);border-radius:8px;
  background:var(--bg);color:var(--text-2);font-size:11.5px;font-weight:600;
  line-height:1.25;
}
.metric-btn:active{background:var(--surface-2)}
.metric-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.metric-btn:disabled{opacity:.45}
.exercise-form-remove{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.paste-textarea{width:100%;min-height:170px;margin-top:6px;font-family:var(--mono);font-size:12px;line-height:1.5;border-color:var(--line);border-radius:9px}
.fallback-text{width:100%;min-height:180px;margin-top:6px;font-family:var(--mono);font-size:11px;line-height:1.5;border-radius:9px;border-color:var(--line);resize:vertical}
.paste-actions{display:flex;gap:8px;margin-top:10px}

/* Exercise management */
.exercise-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.filter-row{display:flex;gap:5px}
.filter-btn{
  min-height:44px;min-width:44px;padding:0 11px;border-radius:8px;
  border:1px solid transparent;color:var(--text-3);font-size:12.5px;font-weight:500;
}
.filter-btn[aria-pressed="true"]{color:var(--text);background:var(--surface);border-color:var(--line)}
.filter-btn:active{background:var(--surface-2)}
.exercise-list{display:flex;flex-direction:column;gap:8px}
.exercise-row{
  display:flex;align-items:center;gap:6px;
  min-height:66px;padding:6px 6px 6px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
}
.exercise-info{flex:1;min-width:0;padding:7px 0}
.exercise-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:600;line-height:1.35}
.exercise-meta{
  margin-top:3px;font-size:10.8px;color:var(--text-3);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.exercise-actions{display:flex;align-items:center;gap:2px;flex:none}
.fav-toggle{
  min-width:54px;min-height:44px;padding:0 8px;
  border:1px solid var(--line);border-radius:7px;
  color:var(--text-3);font-size:11px;font-weight:500;
}
.fav-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.fav-toggle:active{background:var(--surface-2)}
.edit-btn{
  min-width:44px;min-height:44px;padding:0 8px;
  border-radius:7px;color:var(--text-3);font-size:11px;
}
.edit-btn:active{background:var(--surface-2);color:var(--text)}

/* History */
.history-list{display:flex;flex-direction:column;gap:10px}
.session-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;scroll-margin-top:calc(116px + var(--safe-t));min-width:0;
}
.session-row{
  display:block;width:100%;min-height:86px;padding:14px 16px;
  text-align:left;border-radius:0;
  transition:background-color .12s ease;
}
.session-row:active{background:var(--surface-2)}
.session-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.session-date{font-size:13px;font-weight:600;line-height:1.35}
.session-duration{flex:none;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.session-title{
  display:block;margin-top:5px;font-size:15px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.session-meta{display:flex;flex-wrap:wrap;gap:2px 11px;margin-top:5px;font-size:10.8px;color:var(--text-3);line-height:1.4}
.session-expand{display:flex;justify-content:flex-end;margin-top:2px;font-size:10.5px;color:var(--text-3)}
.session-detail{
  padding:2px 16px 15px;border-top:1px solid var(--line);
  background:var(--bg-elevated);min-width:0;
}
.detail-note{
  margin:12px 0 2px;padding:2px 0 2px 10px;
  border-left:2px solid var(--line-strong);
  color:var(--text-2);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;
}
.history-group{padding-top:13px}
.history-group + .history-group{border-top:1px solid var(--line);margin-top:13px}
.history-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:2px}
.history-group-name{font-size:12.5px;font-weight:600;line-height:1.4}
.history-group-meta{font-size:10px;color:var(--text-3);white-space:nowrap}
.h-set{
  display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:baseline;
  padding:7px 0;border-top:1px solid var(--line);
}
.h-set:first-of-type{border-top:0}
.h-set-idx{font-family:var(--mono);font-size:10px;color:var(--text-3);line-height:1.5}
.h-set-val{font-size:12.5px;color:var(--text);line-height:1.5;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.h-set-meta{font-size:10px;color:var(--text-3);line-height:1.5;text-align:right;white-space:nowrap}
.pending-label{display:inline-block;padding:0 4px;border:1px solid var(--line-strong);border-radius:3px;font-size:9px;color:var(--text-3);line-height:1.4}
.detail-actions{display:flex;justify-content:flex-end;margin-top:12px}

/* Stats */
.segmented{
  display:inline-flex;padding:3px;margin:0 0 14px;
  border:1px solid var(--line);border-radius:9px;background:var(--surface);
}
.segmented button{
  min-width:64px;min-height:44px;padding:0 13px;
  border-radius:7px;color:var(--text-3);font-size:12.5px;font-weight:500;
}
.segmented button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);font-weight:600}
.period-card{padding:15px 16px}
.range-line{font-size:10.5px;color:var(--text-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  margin-top:11px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;
}
.stat-cell{background:var(--surface);padding:12px 13px;min-width:0}
.stat-value{
  font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
}
.stat-unit{font-size:10.5px;font-weight:400;color:var(--text-3);margin-left:4px;letter-spacing:0}
.stat-label{margin-top:3px;font-size:10px;font-weight:500;letter-spacing:.05em;color:var(--text-3);line-height:1.35}
.stat-note{margin-top:9px;font-size:10.5px;color:var(--text-3);line-height:1.5}
.pr-section{margin-top:14px}
.pr-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;
  width:100%;min-height:66px;padding:10px 0;
  border-top:1px solid var(--line);border-radius:0;text-align:left;
}
.pr-row:first-child{border-top:0}
.pr-row:active{background:var(--surface-2)}
.pr-main{min-width:0}
.pr-name{font-size:13.5px;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-meta{margin-top:3px;font-size:10px;color:var(--text-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-name,.pr-meta{display:block}
.pr-values{display:flex;align-items:flex-start;gap:14px;flex:none}
.pr-value{text-align:right;min-width:44px}
.pr-value strong{display:block;font-size:16px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-value strong .unit{font-size:9.5px;font-weight:400;color:var(--text-3);margin-left:2px}
.pr-value span{display:block;margin-top:1px;font-size:9px;color:var(--text-3);line-height:1.3;white-space:nowrap}
.pr-chev{font-size:15px;color:var(--text-3);line-height:1;text-align:right}
.pr-detail{margin-top:4px}
.detail-pr-grid{margin-top:0}
.set-history{border-top:1px solid var(--line);margin-top:14px}
.set-history-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.set-history-date{flex:none;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.set-history-val{flex:1;text-align:right;font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.set-history-rpe{flex:none;font-size:10px;color:var(--text-3);min-width:44px;text-align:right}

/* Empty state */
.empty{
  padding:26px 4px 20px;
  color:var(--text-2);
}
.empty-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
.empty-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
.empty-text{margin-top:5px;font-size:12px;color:var(--text-3);line-height:1.6;max-width:420px}
.empty .btn,.empty-card .btn{margin-top:13px}

/* Dialogs */
.dialog-scrim{
  position:fixed;inset:0;z-index:80;
  background:rgba(4,6,4,.72);
  animation:fadeIn .15s ease-out;
}
.dialog-layer{
  position:fixed;inset:0;z-index:81;
  display:flex;align-items:center;justify-content:center;
  padding:22px;pointer-events:none;
}
.dialog{
  width:100%;max-width:390px;max-height:90vh;overflow-y:auto;
  padding:20px;border-radius:12px;pointer-events:auto;
  background:var(--bg-elevated);border:1px solid var(--line-strong);
  animation:dialogIn .16s ease-out;
  overscroll-behavior:contain;
}
.dialog-title{font-size:17px;font-weight:650;line-height:1.35;letter-spacing:-.015em}
.dialog-message{margin-top:8px;font-size:12.5px;color:var(--text-2);line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
.dialog-actions{display:flex;gap:8px;margin-top:18px}
.dialog-actions .btn{flex:1;min-width:0}

/* Toast */
.toast-root{
  position:fixed;left:0;right:0;z-index:100;
  bottom:calc(18px + var(--safe-b));
  display:flex;justify-content:center;
  padding:0 12px;pointer-events:none;
}
body.has-dock .toast-root{bottom:calc(86px + var(--safe-b))}
body.has-rest .toast-root{bottom:calc(124px + var(--safe-b))}
body.modal-open .toast-root{top:calc(var(--safe-t) + 12px);bottom:auto}
.toast{
  display:flex;align-items:center;gap:10px;
  max-width:min(100%,520px);padding:9px 12px;
  pointer-events:auto;
  border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface-2);color:var(--text);
  font-size:12.5px;line-height:1.4;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  animation:toastIn .18s ease-out;
}
.toast-message{min-width:0;overflow-wrap:anywhere}
.toast-action{
  flex:none;min-width:44px;min-height:44px;padding:0 4px;margin:-8px -4px -8px 0;
  color:var(--accent);font-size:12px;font-weight:700;border-radius:6px;
}
.toast-action:active{background:var(--surface-3)}

/* Loading / fatal */
.boot{padding:44px 4px;color:var(--text-3);font-size:13px}
.fatal-card{margin-top:8px;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fatal-card h1{font-size:22px;font-weight:650;line-height:1.3;letter-spacing:-.02em}
.fatal-card p{margin-top:9px;font-size:12.5px;color:var(--text-2);line-height:1.65}
.fatal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.fatal-detail{margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--text-3);line-height:1.5;word-break:break-word}
.skip-link{
  position:absolute;left:12px;top:-64px;z-index:200;
  display:inline-flex;align-items:center;min-height:44px;
  padding:10px 14px;background:var(--accent);color:var(--accent-ink);
  border-radius:6px;font-size:12px;font-weight:600;
  transition:top .12s ease;
}
.skip-link:focus{top:calc(8px + var(--safe-t))}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes dialogIn{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes toastIn{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}

@media (hover:hover){
  .btn:hover{background:var(--surface-3);border-color:var(--line-strong)}
  .btn-primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
  .btn-outline:hover,.btn-ghost:hover{background:var(--surface-2)}
  .btn-danger:hover{background:var(--danger-soft)}
  .tab:hover{color:var(--text-2)}
  .link-btn:hover,.text-btn:hover{color:var(--text)}
  .fav-tile:hover,.picker-row:hover,.session-row:hover{background:var(--surface-2)}
  .other-ex-btn:hover{color:var(--text)}
  .chip:hover,.rest-btn:hover{background:var(--surface-2)}
  .step-btn:hover,.quick-btn:hover,.rpe-btn:hover,.choice-btn:hover,.metric-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .quick-btn[aria-pressed="true"]:hover{background:var(--accent-press);border-color:var(--accent-press)}
  .rpe-btn[aria-pressed="true"]:hover{background:var(--accent-soft)}
  .exercise-row:hover,.session-item:hover{border-color:var(--line-strong)}
  .pr-row:hover{background:var(--surface-2)}
  .set-body:hover{background:var(--surface-2)}
}
@media (min-width:640px){
  .top-inner{padding:0 24px}
  .view{padding:28px 24px calc(60px + var(--safe-b))}
  .dock-inner,.rest-inner{padding:0 24px}
  .page-head h1{font-size:29px}
  .sheet{border-radius:16px 16px 0 0}
  .empty-card{padding:22px 20px}
}
@media (min-width:820px){
  .home-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;align-items:start}
  .home-side{margin-top:0}
}
@media (max-width:360px), (max-height:740px){
  .view{padding-top:18px}
  .home-layout .page-head{margin-bottom:14px}
  .page-head h1{font-size:26px}
  .page-sub{margin-top:5px;font-size:12.5px}
  .eyebrow{margin-bottom:5px}
  .home-layout .card{padding:14px}
  .home-layout .fav-grid{gap:6px}
  .home-layout .fav-tile{min-height:58px;padding:8px 10px}
  .home-layout .section-head{margin-bottom:9px}
  .home-layout .last-card{min-height:104px;padding:13px 14px}
  .home-layout .start-button{min-height:62px;padding:9px 14px}
  .home-side{gap:10px;margin-top:10px}
}
@media (max-width:360px){
  .rest-caption{display:none}
  .rest-time{font-size:34px}
  .rest-actions{gap:4px}
  .rest-btn{padding:0 6px}
  .dock-add{min-width:118px;padding:0 12px;font-size:14px}
  .session-clock{font-size:33px}
  .page-head h1{font-size:25px}
  .exercise-actions{gap:0}
  .fav-toggle{min-width:50px;padding:0 6px}
  .pr-values{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}

<body>
<a class="skip-link" href="#view">跳到主要内容</a>

<div class="top">
  <div class="top-inner">
    <header class="topbar">
      <div class="brand" aria-label="训练日志">
        <span class="brand-rule" aria-hidden="true"></span>
        <div>
          <div class="brand-name">训练日志</div>
          <div class="brand-sub">本机存储 · IndexedDB</div>
        </div>
      </div>
      <button class="btn-data" type="button" data-act="openData">数据</button>
    </header>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <button class="tab" type="button" data-act="tab" data-tab="train" aria-current="page">训练</button>
      <button class="tab" type="button" data-act="tab" data-tab="history">历史</button>
      <button class="tab" type="button" data-act="tab" data-tab="stats">统计</button>
      <button class="tab" type="button" data-act="tab" data-tab="exercises">动作</button>
    </nav>
  </div>
</div>

<main class="view" id="view" tabindex="-1">
  <div class="boot">正在读取本机数据…</div>
</main>

<div id="dockRoot"></div>
<div id="restRoot"></div>
<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Constants
   * ------------------------------------------------------------------ */

  var DB_NAME = 'training-log-db';
  var DB_VERSION = 1;
  var APP_FORMAT = 'training-log';
  var APP_SCHEMA = 1;
  var DEFAULT_SETTINGS = { restSec: 90 };
  var METRICS = {
    weight_reps: '重量 × 次数',
    reps: '次数',
    duration: '时长'
  };
  var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var PRESETS = [
    { id: 'ex_squat', name: '深蹲', muscle: '腿 / 臀', metric: 'weight_reps', favorite: true },
    { id: 'ex_bench', name: '卧推', muscle: '胸', metric: 'weight_reps', favorite: true },
    { id: 'ex_deadlift', name: '硬拉', muscle: '背 / 腿', metric: 'weight_reps', favorite: true },
    { id: 'ex_pullup', name: '引体向上', muscle: '背', metric: 'reps', favorite: true },
    { id: 'ex_run', name: '跑步', muscle: '心肺', metric: 'duration', favorite: false },
    { id: 'ex_rope', name: '跳绳', muscle: '心肺', metric: 'duration', favorite: false },
    { id: 'ex_row', name: '杠铃划船', muscle: '背', metric: 'weight_reps', favorite: false },
    { id: 'ex_press', name: '站姿推举', muscle: '肩', metric: 'weight_reps', favorite: false },
    { id: 'ex_plank', name: '平板支撑', muscle: '核心', metric: 'duration', favorite: false },
    { id: 'ex_curl', name: '哑铃弯举', muscle: '手臂', metric: 'weight_reps', favorite: false }
  ];

  var nfInt = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 });
  var nfWeight = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 });

  var els = {
    view: document.getElementById('view'),
    tabs: document.getElementById('tabs'),
    dockRoot: document.getElementById('dockRoot'),
    restRoot: document.getElementById('restRoot'),
    sheetRoot: document.getElementById('sheetRoot'),
    dialogRoot: document.getElementById('dialogRoot'),
    toastRoot: document.getElementById('toastRoot'),
    importFile: document.getElementById('importFile')
  };

  var state = {
    loaded: false,
    dbError: null,
    exercises: [],
    sessions: [],
    sets: [],
    settings: Object.assign({}, DEFAULT_SETTINGS),
    persisted: null
  };

  var ui = {
    tab: 'train',
    currentExerciseId: null,
    historyExpanded: new Set(),
    statsPeriod: 'week',
    exerciseFilter: 'all',
    pickerQuery: '',
    sheet: null,
    dialog: null,
    focusSheet: false,
    focusTarget: null,
    dialogBusy: false,
    savingSet: false,
    savingFinish: false,
    starting: false,
    importing: false,
    deletingSet: false,
    savingExercise: false,
    finishEndAt: null
  };

  var db = null;
  var rest = null;
  var tickTimer = null;
  var audioCtx = null;
  var pointerStart = null;
  var toastTimer = null;
  var toastAction = null;
  var favoriteBusy = new Set();
  var suppressClickUntil = 0;

  /* ------------------------------------------------------------------ *
   * Small utilities
   * ------------------------------------------------------------------ */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function sanitizeText(value, maxLength) {
    return String(value == null ? '' : value)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .trim()
      .slice(0, maxLength || 200);
  }
  function safeId(value) {
    return typeof value === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(value);
  }
  function validTimestamp(value) {
    var n = Number(value);
    return Number.isFinite(n) && n > 0 && n < 8640000000000000;
  }
  function escapeAttr(value) { return esc(value); }

  function formatWeight(value) {
    var n = Number(value);
    if (!Number.isFinite(n)) return '—';
    return nfWeight.format(n);
  }
  function formatReps(value) {
    var n = Number(value);
    if (!Number.isFinite(n)) return '—';
    return nfInt.format(n);
  }
  function formatRpe(value) {
    if (value == null || !Number.isFinite(Number(value))) return '';
    var n = Number(value);
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }
  function formatVolume(value) {
    var n = Number(value) || 0;
    return nfInt.format(Math.round(n));
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    if (!Number.isFinite(d.getTime())) return '—';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDay(ts) {
    var d = new Date(ts);
    if (!Number.isFinite(d.getTime())) return '—';
    var now = new Date();
    var year = d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年';
    return year + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
  }
  function fmtDayShort(ts) {
    var d = new Date(ts);
    if (!Number.isFinite(d.getTime())) return '—';
    var now = new Date();
    var year = d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年';
    return year + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function fmtDateTime(ts) {
    if (!validTimestamp(ts)) return '—';
    return fmtDayShort(ts) + ' ' + fmtTime(ts);
  }
  function dateKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDateRange(startMs, endExclusiveMs) {
    var a = new Date(startMs);
    var b = new Date(endExclusiveMs - 86400000);
    function part(d, withYear) {
      return (withYear ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    if (a.getFullYear() !== b.getFullYear()) {
      return part(a, true) + ' – ' + part(b, true);
    }
    if (a.getMonth() !== b.getMonth()) {
      return part(a, false) + ' – ' + part(b, false);
    }
    return part(a, false) + ' – ' + b.getDate() + '日';
  }
  function fmtClockLong(ms) {
    var total = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }
  function fmtClockSec(sec) {
    var total = Math.max(0, Math.floor(Number(sec) || 0));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
    return pad2(m) + ':' + pad2(s);
  }
  function fmtRest(msLeft) {
    var total = Math.max(0, Math.ceil((Number(msLeft) || 0) / 1000));
    return pad2(Math.floor(total / 60)) + ':' + pad2(total % 60);
  }
  function fmtDurationHuman(ms) {
    var total = Math.max(0, Math.round((Number(ms) || 0) / 1000));
    if (total < 60) return total + ' 秒';
    var mins = Math.floor(total / 60);
    var secs = total % 60;
    if (mins < 60) return secs ? mins + ' 分 ' + secs + ' 秒' : mins + ' 分钟';
    var hours = Math.floor(mins / 60);
    var remainMins = mins % 60;
    if (hours >= 24) {
      var days = Math.floor(hours / 24);
      var h = hours % 24;
      return days + ' 天' + (h ? ' ' + h + ' 小时' : '');
    }
    return hours + ' 小时' + (remainMins ? ' ' + remainMins + ' 分' : '');
  }
  function prefersReducedMotion() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (err) {
      return false;
    }
  }

  /* ------------------------------------------------------------------ *
   * IndexedDB
   * ------------------------------------------------------------------ */

  function openDb() {
    return new Promise(function (resolve, reject) {
      if (!('indexedDB' in window)) {
        reject(new Error('当前浏览器不支持 IndexedDB'));
        return;
      }
      var req;
      try {
        req = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(err);
        return;
      }
      req.onupgradeneeded = function () {
        var database = req.result;
        if (!database.objectStoreNames.contains('exercises')) {
          database.createObjectStore('exercises', { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains('sessions')) {
          var sessions = database.createObjectStore('sessions', { keyPath: 'id' });
          sessions.createIndex('startedAt', 'startedAt', { unique: false });
        }
        if (!database.objectStoreNames.contains('sets')) {
          var sets = database.createObjectStore('sets', { keyPath: 'id' });
          sets.createIndex('sessionId', 'sessionId', { unique: false });
          sets.createIndex('exerciseId', 'exerciseId', { unique: false });
        }
        if (!database.objectStoreNames.contains('meta')) {
          database.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = function () {
        var database = req.result;
        database.onversionchange = function () {
          try { database.close(); } catch (err) { /* noop */ }
        };
        resolve(database);
      };
      req.onerror = function () {
        reject(req.error || new Error('无法打开本机数据库'));
      };
      req.onblocked = function () {
        reject(new Error('数据库被另一个页面占用，请关闭其他标签页后重试'));
      };
    });
  }

  function dbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('数据库尚未就绪')); return; }
      var tx;
      try { tx = db.transaction(storeName, 'readonly'); }
      catch (err) { reject(err); return; }
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function () { resolve(Array.isArray(req.result) ? req.result : []); };
      req.onerror = function () { reject(req.error || new Error('读取数据失败')); };
    });
  }

  function dbGet(storeName, key) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('数据库尚未就绪')); return; }
      var tx;
      try { tx = db.transaction(storeName, 'readonly'); }
      catch (err) { reject(err); return; }
      var req = tx.objectStore(storeName).get(key);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('读取数据失败')); };
    });
  }

  function dbPut(storeName, value) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('数据库尚未就绪')); return; }
      var tx;
      try { tx = db.transaction(storeName, 'readwrite'); }
      catch (err) { reject(err); return; }
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error || new Error('写入数据失败')); };
      tx.onabort = function () { reject(tx.error || new Error('写入已取消')); };
      try { tx.objectStore(storeName).put(value); }
      catch (err) { reject(err); }
    });
  }

  function dbDelete(storeName, key) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('数据库尚未就绪')); return; }
      var tx;
      try { tx = db.transaction(storeName, 'readwrite'); }
      catch (err) { reject(err); return; }
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error || new Error('删除数据失败')); };
      tx.onabort = function () { reject(tx.error || new Error('删除已取消')); };
      try { tx.objectStore(storeName).delete(key); }
      catch (err) { reject(err); }
    });
  }

  function dbBatch(ops) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('数据库尚未就绪')); return; }
      var names = [];
      ops.forEach(function (op) {
        if (names.indexOf(op.store) === -1) names.push(op.store);
      });
      var tx;
      try { tx = db.transaction(names, 'readwrite'); }
      catch (err) { reject(err); return; }
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error || new Error('批量写入失败')); };
      tx.onabort = function () { reject(tx.error || new Error('批量写入已取消')); };
      try {
        ops.forEach(function (op) {
          var store = tx.objectStore(op.store);
          if (op.type === 'put') store.put(op.value);
          else if (op.type === 'delete') store.delete(op.key);
          else if (op.type === 'clear') store.clear();
        });
      } catch (err) {
        try { tx.abort(); } catch (abortErr) { /* noop */ }
        reject(err);
      }
    });
  }

  function metaGet(key, fallback) {
    return dbGet('meta', key).then(function (row) {
      return row && Object.prototype.hasOwnProperty.call(row, 'value') ? row.value : fallback;
    });
  }
  function metaSet(key, value) {
    return dbPut('meta', { key: key, value: value });
  }

  /* ------------------------------------------------------------------ *
   * Exit helpers
   * ------------------------------------------------------------------ */

  function getExercise(id) {
    return state.exercises.find(function (ex) { return ex.id === id; }) || null;
  }
  function activeExercises() {
    return state.exercises.filter(function (ex) { return !ex.archived; }).sort(compareExercises);
  }
  function compareExercises(a, b) {
    var af = a.favorite ? 1 : 0;
    var bf = b.favorite ? 1 : 0;
    if (af !== bf) return bf - af;
    var ao = Number(a.order);
    var bo = Number(b.order);
    if (!Number.isFinite(ao)) ao = 1e12;
    if (!Number.isFinite(bo)) bo = 1e12;
    if (ao !== bo) return ao - bo;
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh-CN');
  }
  function activeSession() {
    return state.sessions
      .filter(function (s) { return !s.endedAt; })
      .sort(function (a, b) { return b.startedAt - a.startedAt; })[0] || null;
  }
  function finishedSessions() {
    return state.sessions
      .filter(function (s) { return !!s.endedAt; })
      .sort(function (a, b) { return b.startedAt - a.startedAt; });
  }
  function setsForSession(sessionId) {
    return state.sets
      .filter(function (set) { return set.sessionId === sessionId; })
      .sort(function (a, b) {
        return (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0);
      });
  }
  function lastUsedExerciseId() {
    var last = finishedSessions()[0];
    if (!last) return null;
    var sets = setsForSession(last.id);
    if (!sets.length) return null;
    for (var i = sets.length - 1; i >= 0; i -= 1) {
      var ex = getExercise(sets[i].exerciseId);
      if (ex && !ex.archived) return ex.id;
    }
    return null;
  }
  function chooseValidExerciseId(preferred) {
    if (preferred) {
      var preferredEx = getExercise(preferred);
      if (preferredEx && !preferredEx.archived) return preferredEx.id;
    }
    var ses = activeSession();
    if (ses) {
      var ss = setsForSession(ses.id);
      for (var i = ss.length - 1; i >= 0; i -= 1) {
        var candidate = getExercise(ss[i].exerciseId);
        if (candidate && !candidate.archived) return candidate.id;
      }
    }
    var lastId = lastUsedExerciseId();
    if (lastId) return lastId;
    var first = activeExercises()[0];
    return first ? first.id : null;
  }
  function ensureCurrentExercise() {
    var ex = ui.currentExerciseId ? getExercise(ui.currentExerciseId) : null;
    if (!ex || ex.archived) {
      ex = activeExercises()[0] || null;
      ui.currentExerciseId = ex ? ex.id : null;
    }
    return ex;
  }
  function rememberCurrentExercise() {
    if (!db) return;
    metaSet('ui', { currentExerciseId: ui.currentExerciseId }).catch(function () { /* non-critical */ });
  }
  function metricOf(ex) {
    return ex && METRICS[ex.metric] ? ex.metric : 'weight_reps';
  }
  function volumeOfSet(set) {
    var weight = Number(set.weight);
    var reps = Number(set.reps);
    return weight > 0 && reps > 0 ? weight * reps : 0;
  }
  function lastCompletedSet(exerciseId, exceptId) {
    var latest = null;
    state.sets.forEach(function (set) {
      if (set.exerciseId !== exerciseId || !set.completed) return;
      if (exceptId && set.id === exceptId) return;
      if (!latest || (Number(set.createdAt) || 0) > (Number(latest.createdAt) || 0)) latest = set;
    });
    return latest;
  }
  function setsForExercise(exerciseId) {
    return state.sets.filter(function (set) { return set.exerciseId === exerciseId; });
  }
  function summaryForSession(session) {
    var sessionSets = setsForSession(session.id);
    var done = sessionSets.filter(function (set) { return set.completed; });
    var exerciseIds = new Set(sessionSets.map(function (set) { return set.exerciseId; }));
    var volume = done.reduce(function (sum, set) { return sum + volumeOfSet(set); }, 0);
    return {
      sets: sessionSets,
      setCount: sessionSets.length,
      completedCount: done.length,
      pendingCount: sessionSets.length - done.length,
      exerciseCount: exerciseIds.size,
      volume: volume,
      durationMs: Math.max(0, (session.endedAt || Date.now()) - session.startedAt)
    };
  }
  function recordsForExercise(exerciseId) {
    var maxWeight = null;
    var maxReps = null;
    var maxDuration = null;
    var completed = 0;
    var latest = 0;
    state.sets.forEach(function (set) {
      if (!set.completed || set.exerciseId !== exerciseId) return;
      completed += 1;
      var t = Number(set.createdAt) || 0;
      if (t > latest) latest = t;
      var w = Number(set.weight) || 0;
      var r = Number(set.reps) || 0;
      var d = Number(set.durationSec) || 0;
      if (w > 0 && (!maxWeight || w > maxWeight.weight || (w === maxWeight.weight && r > maxWeight.reps))) {
        maxWeight = { weight: w, reps: r };
      }
      if (r > 0 && (!maxReps || r > maxReps.reps || (r === maxReps.reps && w > maxReps.weight))) {
        maxReps = { reps: r, weight: w };
      }
      if (d > 0 && (!maxDuration || d > maxDuration.durationSec)) {
        maxDuration = { durationSec: d };
      }
    });
    return {
      maxWeight: maxWeight,
      maxReps: maxReps,
      maxDuration: maxDuration,
      completed: completed,
      latest: latest
    };
  }
  function setMainText(set, ex) {
    var metric = metricOf(ex);
    if (metric === 'duration') return fmtClockSec(set.durationSec);
    if (metric === 'reps') return formatReps(set.reps) + ' 次';
    var weight = Number(set.weight) || 0;
    var reps = formatReps(set.reps);
    return weight > 0 ? formatWeight(weight) + ' kg × ' + reps : '自重 × ' + reps;
  }
  function setCompactText(set, ex) {
    var metric = metricOf(ex);
    if (metric === 'duration') return fmtClockSec(set.durationSec);
    if (metric === 'reps') return formatReps(set.reps) + ' 次';
    var weight = Number(set.weight) || 0;
    var reps = formatReps(set.reps);
    return (weight > 0 ? formatWeight(weight) + ' kg' : '自重') + ' × ' + reps;
  }
  function exerciseNamesFromSets(sets, limit) {
    var names = [];
    var seen = new Set();
    sets.forEach(function (set) {
      if (seen.has(set.exerciseId)) return;
      seen.add(set.exerciseId);
      var ex = getExercise(set.exerciseId);
      names.push(ex ? ex.name : '已移除动作');
    });
    var max = limit || 3;
    if (!names.length) return '空白训练';
    return names.slice(0, max).join(' · ') + (names.length > max ? ' 等 ' + names.length + ' 个动作' : '');
  }
  function groupsForSets(sets) {
    var groups = [];
    var map = new Map();
    sets.forEach(function (set) {
      if (!map.has(set.exerciseId)) {
        var group = { exerciseId: set.exerciseId, sets: [] };
        map.set(set.exerciseId, group);
        groups.push(group);
      }
      map.get(set.exerciseId).sets.push(set);
    });
    return groups;
  }
  function periodBounds(period) {
    var now = new Date();
    if (period === 'month') {
      var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      return {
        start: monthStart.getTime(),
        end: monthEnd.getTime(),
        label: fmtDateRange(monthStart.getTime(), monthEnd.getTime())
      };
    }
    var weekStart = new Date(now);
    var day = (weekStart.getDay() + 6) % 7;
    weekStart.setDate(weekStart.getDate() - day);
    weekStart.setHours(0, 0, 0, 0);
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);
    return {
      start: weekStart.getTime(),
      end: weekEnd.getTime(),
      label: fmtDateRange(weekStart.getTime(), weekEnd.getTime())
    };
  }
  function periodStats(period) {
    var bounds = periodBounds(period);
    var sessions = state.sessions.filter(function (s) {
      return !!s.endedAt && s.startedAt >= bounds.start && s.startedAt < bounds.end;
    });
    var ids = new Set(sessions.map(function (s) { return s.id; }));
    var sets = state.sets.filter(function (set) {
      return set.completed && ids.has(set.sessionId);
    });
    var volume = sets.reduce(function (sum, set) { return sum + volumeOfSet(set); }, 0);
    var durationMs = sessions.reduce(function (sum, s) {
      return sum + Math.max(0, s.endedAt - s.startedAt);
    }, 0);
    return {
      sessions: sessions.length,
      sets: sets.length,
      volume: volume,
      durationMs: durationMs,
      label: bounds.label,
      start: bounds.start,
      end: bounds.end
    };
  }
  function statDurationParts(ms) {
    var sec = Math.max(0, Math.round((Number(ms) || 0) / 1000));
    if (sec < 60) return { value: String(sec), unit: '秒' };
    var mins = Math.round(sec / 60);
    if (mins < 60) return { value: String(mins), unit: '分钟' };
    var hours = mins / 60;
    return { value: hours.toFixed(hours >= 10 ? 0 : 1).replace(/\.0$/, ''), unit: '小时' };
  }
  function prValuesFor(ex, records) {
    var metric = metricOf(ex);
    if (metric === 'duration') {
      return [{
        label: '最长时长',
        value: records.maxDuration ? fmtClockSec(records.maxDuration.durationSec) : '—',
        unit: ''
      }, {
        label: '累计组数',
        value: formatReps(records.completed),
        unit: '组'
      }];
    }
    if (metric === 'reps') {
      return [{
        label: '最多次数',
        value: records.maxReps ? formatReps(records.maxReps.reps) : '—',
        unit: records.maxReps ? '次' : ''
      }, {
        label: '累计组数',
        value: formatReps(records.completed),
        unit: '组'
      }];
    }
    return [{
      label: '最高重量',
      value: records.maxWeight ? formatWeight(records.maxWeight.weight) : '—',
      unit: records.maxWeight ? 'kg' : ''
    }, {
      label: '最多次数',
      value: records.maxReps ? formatReps(records.maxReps.reps) : '—',
      unit: records.maxReps ? '次' : ''
    }, {
      label: '累计组数',
      value: formatReps(records.completed),
      unit: '组'
    }];
  }

  /* ------------------------------------------------------------------ *
   * Boot
   * ------------------------------------------------------------------ */

  function boot() {
    state.dbError = null;
    openDb().then(function (database) {
      db = database;
      return Promise.all([
        dbGetAll('exercises'),
        dbGetAll('sessions'),
        dbGetAll('sets'),
        metaGet('seeded', false),
        metaGet('settings', null),
        metaGet('ui', null),
        metaGet('rest', null)
      ]);
    }).then(function (rows) {
      var exercises = rows[0];
      var sessions = rows[1];
      var sets = rows[2];
      var seeded = rows[3];
      var storedSettings = rows[4];
      var storedUi = rows[5];
      var storedRest = rows[6];

      state.exercises = exercises.filter(function (ex) {
        return ex && typeof ex.id === 'string' && typeof ex.name === 'string';
      });
      state.sessions = sessions.filter(function (s) {
        return s && typeof s.id === 'string' && validTimestamp(s.startedAt);
      });
      state.sets = sets.filter(function (set) {
        return set && typeof set.id === 'string' && typeof set.sessionId === 'string' && typeof set.exerciseId === 'string';
      });
      state.settings = Object.assign({}, DEFAULT_SETTINGS);
      if (storedSettings && Number.isFinite(Number(storedSettings.restSec))) {
        state.settings.restSec = clamp(Math.round(Number(storedSettings.restSec)), 15, 900);
      }

      if (!state.exercises.length && !seeded) {
        return seedPresets().then(function (seededExercises) {
          state.exercises = seededExercises;
          return { storedUi: storedUi, storedRest: storedRest };
        });
      }
      if (state.exercises.length && !seeded) {
        metaSet('seeded', true).catch(function () { /* non-critical */ });
      }
      return { storedUi: storedUi, storedRest: storedRest };
    }).then(function (ctx) {
      ui.currentExerciseId = ctx.storedUi && ctx.storedUi.currentExerciseId
        ? ctx.storedUi.currentExerciseId
        : null;
      ui.currentExerciseId = chooseValidExerciseId(ui.currentExerciseId);
      restoreRest(ctx.storedRest);
      state.loaded = true;
      renderAll();
      startTicker();
      checkPersistence();
    }).catch(function (err) {
      state.dbError = err;
      state.loaded = false;
      renderAll();
      console.error('训练日志启动失败', err);
    });
  }

  function seedPresets() {
    var base = Date.now();
    var exercises = PRESETS.map(function (preset, index) {
      return {
        id: preset.id,
        name: preset.name,
        muscle: preset.muscle,
        metric: preset.metric,
        builtin: true,
        favorite: !!preset.favorite,
        archived: false,
        order: index + 1,
        createdAt: base + index
      };
    });
    var ops = exercises.map(function (ex) {
      return { store: 'exercises', type: 'put', value: ex };
    });
    ops.push({ store: 'meta', type: 'put', value: { key: 'seeded', value: true } });
    return dbBatch(ops).then(function () { return exercises; });
  }

  function restoreRest(savedRest) {
    rest = null;
    var session = activeSession();
    if (!session) return;
    if (!savedRest || typeof savedRest !== 'object' || !Number.isFinite(Number(savedRest.targetEnd))) {
      return;
    }
    var targetEnd = Number(savedRest.targetEnd);
    var totalMs = Number(savedRest.totalMs);
    if (!Number.isFinite(totalMs) || totalMs < 1000) totalMs = 90000;
    var exercise = getExercise(savedRest.exerciseId);
    if (!exercise || exercise.archived) {
      ui.currentExerciseId = ensureCurrentExercise() ? ui.currentExerciseId : null;
      exercise = ensureCurrentExercise();
    }
    var exerciseId = exercise ? exercise.id : ui.currentExerciseId;
    if (!exerciseId) return;
    var now = Date.now();
    if (targetEnd > now) {
      rest = {
        targetEnd: targetEnd,
        totalMs: totalMs,
        exerciseId: exerciseId,
        startedAt: Number(savedRest.startedAt) || (targetEnd - totalMs),
        ended: false,
        endedAt: null
      };
    } else if (now - targetEnd < 120000) {
      rest = {
        targetEnd: targetEnd,
        totalMs: totalMs,
        exerciseId: exerciseId,
        startedAt: Number(savedRest.startedAt) || (targetEnd - totalMs),
        ended: true,
        endedAt: targetEnd
      };
    } else {
      metaSet('rest', null).catch(function () { /* non-critical */ });
    }
  }

  function checkPersistence() {
    if (!navigator.storage || typeof navigator.storage.persisted !== 'function') {
      state.persisted = null;
      return;
    }
    navigator.storage.persisted().then(function (isPersisted) {
      if (isPersisted) {
        state.persisted = true;
        return true;
      }
      if (typeof navigator.storage.persist !== 'function') {
        state.persisted = false;
        return false;
      }
      return navigator.storage.persist().then(function (granted) {
        state.persisted = !!granted;
        return granted;
      }).catch(function () {
        state.persisted = false;
        return false;
      });
    }).catch(function () {
      state.persisted = null;
    }).then(function () {
      if (ui.sheet && ui.sheet.type === 'data') refreshSheetKeepScroll();
    });
  }

  /* ------------------------------------------------------------------ *
   * Main rendering
   * ------------------------------------------------------------------ */

  function renderAll() {
    if (state.dbError) {
      renderTabs();
      renderFatal(state.dbError);
      els.dockRoot.innerHTML = '';
      els.restRoot.innerHTML = '';
      renderSheet();
      renderDialog();
      syncLayers();
      return;
    }
    renderTabs();
    renderView();
    renderChrome();
    renderSheet();
    renderDialog();
    syncLayers();
  }

  function renderTabs() {
    $$('#tabs .tab').forEach(function (tab) {
      if (tab.dataset.tab === ui.tab) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  function renderView() {
    if (state.dbError) {
      renderFatal(state.dbError);
      return;
    }
    if (!state.loaded) {
      els.view.innerHTML = '<div class="boot">正在读取本机数据…</div>';
      return;
    }
    if (ui.tab === 'history') els.view.innerHTML = renderHistory();
    else if (ui.tab === 'stats') els.view.innerHTML = renderStats();
    else if (ui.tab === 'exercises') els.view.innerHTML = renderExercises();
    else els.view.innerHTML = renderTrain();
  }

  function renderFatal(error) {
    var detail = error && error.message ? error.message : '未知错误';
    els.view.innerHTML =
      '<header class="page-head">' +
        '<p class="eyebrow">本机存储</p>' +
        '<h1>无法打开数据库</h1>' +
        '<p class="page-sub">训练日志需要浏览器的 IndexedDB 来保存数据。</p>' +
      '</header>' +
      '<div class="fatal-card">' +
        '<h1 style="font-size:18px">数据无法载入</h1>' +
        '<p>请使用最新版 Chrome、Safari、Edge 或 Firefox 打开，并确认没有处在严格隐私模式中。也请检查浏览器是否允许本地文件使用存储。</p>' +
        '<p>如果这个文件是从别的路径移动过来的，浏览器可能无法关联原来的数据。可以先把原文件放回原路径再打开。</p>' +
        '<div class="fatal-actions">' +
          '<button class="btn btn-primary" type="button" data-act="retryBoot">重新尝试</button>' +
        '</div>' +
        '<p class="fatal-detail">' + esc(detail) + '</p>' +
      '</div>';
  }

  function renderChrome() {
    if (state.dbError || !state.loaded) {
      els.dockRoot.innerHTML = '';
      els.restRoot.innerHTML = '';
      return;
    }
    var session = activeSession();
    var showDock = !!session && ui.tab === 'train' && !rest;
    els.dockRoot.innerHTML = showDock ? dockHtml(session) : '';
    els.restRoot.innerHTML = session && rest ? restHtml() : '';
  }

  function syncLayers() {
    var session = activeSession();
    var hasDock = !!session && ui.tab === 'train' && !rest;
    var hasRest = !!session && !!rest;
    document.body.classList.toggle('has-dock', hasDock);
    document.body.classList.toggle('has-rest', hasRest);
    document.body.classList.toggle('modal-open', !!(ui.sheet || ui.dialog));
    document.body.classList.toggle('db-fatal', !!state.dbError);
  }

  /* ------------------------------------------------------------------ *
   * Home
   * ------------------------------------------------------------------ */

  function renderTrain() {
    var session = activeSession();
    return session ? renderActive(session) : renderHome();
  }

  function renderHome() {
    var week = periodStats('week');
    var last = finishedSessions()[0];
    var all = activeExercises();
    var faves = all.filter(function (ex) { return ex.favorite; }).slice(0, 4);
    var hasExercises = all.length > 0;

    var favInner = faves.length
      ? '<div class="fav-grid">' + faves.map(favTileHtml).join('') + '</div>'

          '<p class="empty-title">还没有常用动作</p>' +
          '<p class="empty-text">在动作库里把动作标记为「常用」，它们会排在这里，点一下就能开始训练。</p>' +
          '<button class="btn btn-sm" type="button" data-act="tabExercises">去动作库</button>' +
        '</div>';

    var lastHtml;
    if (last) {

      lastHtml =

          '<span class="last-meta">' + esc(fmtDurationHuman(summary.durationMs)) + ' · ' + summary.setCount + ' 组' + volume + '</span>' +
          '<span class="last-link">查看明细 <span class="chev" aria-hidden="true">›</span></span>' +
        '</button>';
    } else {
      lastHtml =
        '<div class="card last-card is-empty">' +
          '<span class="kicker">上次训练</span>' +
          '<span class="last-title">还没有训练记录</span>' +
          '<span class="last-meta">完成第一次训练后，这里会显示上次练了什么。</span>' +
        '</div>';

    var startCta = hasExercises
      ? '<button class="start-button" type="button" data-act="startSession">' +
          '<span class="start-copy"><strong>快速开始训练</strong><span>计时自动开始，完成一组即进入休息</span></span>' +
          '<span class="start-cta">开始 <span class="chev" aria-hidden="true">›</span></span>' +
        '</button>'
      : '<button class="start-button" type="button" data-act="tabExercises">' +
