  /* ------------------------------------------------------------------ *
   * Data / settings
   * ------------------------------------------------------------------ */

  function openDataSheet() {
    if (state.dbError) {
      toast('本机数据库不可用，无法读取数据');
      return;
    }
    if (!state.loaded) {
      toast('数据还在载入，请稍等');
      return;
    }
    openSheet({ type: 'data' });
  }

  function buildExportObject() {
    return {
      format: APP_FORMAT,
      version: APP_SCHEMA,
      exportedAt: new Date().toISOString(),
      exercises: state.exercises.map(function (ex) { return Object.assign({}, ex); }),
      sessions: state.sessions.map(function (s) {
        var copy = Object.assign({}, s);
        if (copy.endedAt) copy.durationSec = Math.max(0, Math.round((copy.endedAt - copy.startedAt) / 1000));
        return copy;
      }),
      sets: state.sets.map(function (set) { return Object.assign({}, set); }),
      settings: Object.assign({}, state.settings)
    };
  }

  function buildExportJson() {
    return JSON.stringify(buildExportObject(), null, 2);
  }

  function downloadJson(text) {
    try {
      var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'training-log-' + dateKey(Date.now()) + '.json';
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  }

  function exportDataFile() {
    var text = buildExportJson();
    if (downloadJson(text)) {
      toast('备份 JSON 已导出');
    } else {
      ui.sheet = { type: 'textFallback', text: text };
      ui.focusSheet = true;
      renderAll();
      toast('无法直接下载，已打开手动复制');
    }
  }

  function copyText(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return legacyCopy(text);
      });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '0';
      area.style.top = '0';
      area.style.width = '1px';
      area.style.height = '1px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      var focused = document.activeElement;
      area.focus();
      area.select();
      try { area.setSelectionRange(0, text.length); } catch (err) { /* noop */ }
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      area.remove();
      if (focused && typeof focused.focus === 'function') focused.focus({ preventScroll: true });
      return ok;
    } catch (err) {
      return false;
    }
  }

  function copyDataToClipboard() {
    var text = buildExportJson();
    return copyText(text).then(function (ok) {
      if (ok) {
        toast('已复制备份 JSON 到剪贴板');
      } else {
        ui.sheet = { type: 'textFallback', text: text };
        ui.focusSheet = true;
        renderAll();
        toast('无法自动复制，请手动全选');
      }
    });
  }

  function selectFallbackText() {
    var area = document.getElementById('copyFallback');
    if (!area) return;
    area.focus();
    area.select();
    try { area.setSelectionRange(0, area.value.length); } catch (err) { /* noop */ }
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (err) { copied = false; }
    toast(copied ? '已复制到剪贴板' : '已全选，请使用系统复制');
  }

  function pickImportFile() {
    if (!els.importFile) return;
    els.importFile.value = '';
    try {
      els.importFile.click();
    } catch (err) {
      toast('无法打开文件选择器');
    }
  }

  function readFileText(file) {
    if (typeof file.text === 'function') return file.text();
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = function () { reject(reader.error || new Error('无法读取文件')); };
      reader.readAsText(file);
    });
  }

  function handleImportFile(file) {
    if (!file) return Promise.resolve();
    if (file.size > 20 * 1024 * 1024) {
      toast('文件过大，最大支持 20 MB');
      return Promise.resolve();
    }
    return readFileText(file).then(function (text) {
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        throw new Error('JSON 格式不正确');
      }
      var normalized = normalizeImport(parsed);
      promptImport(normalized);
    }).catch(function (err) {
      console.error(err);
      toast('导入失败：' + (err && err.message ? err.message : '文件无法解析'));
    });
  }

  function normalizeImport(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      throw new Error('JSON 根节点必须是对象');
    }
    var source = raw.data && typeof raw.data === 'object' && !Array.isArray(raw.data)
      ? raw.data
      : raw;
    if (!Array.isArray(source.exercises) || !Array.isArray(source.sessions) || !Array.isArray(source.sets)) {
      throw new Error('缺少 exercises、sessions、sets 数组');
    }
    if (source.exercises.length > 2000) throw new Error('动作数量超出限制');
    if (source.sessions.length > 20000) throw new Error('训练会话数量超出限制');
    if (source.sets.length > 200000) throw new Error('组记录数量超出限制');

    var exerciseMap = new Map();
    var usedExercises = new Set();
    var exercises = [];
    var skippedExercises = 0;
    var now = Date.now();

    source.exercises.forEach(function (item, index) {
      if (!item || typeof item !== 'object') { skippedExercises += 1; return; }
      var name = sanitizeText(item.name, 40);
      if (!name) { skippedExercises += 1; return; }
      var oldId = typeof item.id === 'string' ? item.id : '';
      var id = safeId(oldId) && !usedExercises.has(oldId) ? oldId : uid('ex');
      usedExercises.add(id);
      if (oldId && !exerciseMap.has(oldId)) exerciseMap.set(oldId, id);
      var metric = METRICS[item.metric] ? item.metric : 'weight_reps';
      exercises.push({
        id: id,
        name: name,
        muscle: sanitizeText(item.muscle, 30) || '未分类',
        metric: metric,
        builtin: item.builtin === true,
        favorite: item.favorite === true,
        archived: item.archived === true,
        order: Number.isFinite(Number(item.order)) ? clamp(Number(item.order), -1e9, 1e9) : index,
        createdAt: validTimestamp(item.createdAt) ? Number(item.createdAt) : now + index
      });
    });
    if (source.exercises.length && !exercises.length) {
      throw new Error('没有可用的动作数据');
    }

    var sessionMap = new Map();
    var usedSessions = new Set();
    var sessions = [];
    var skippedSessions = 0;
    source.sessions.forEach(function (item) {
      if (!item || typeof item !== 'object' || !validTimestamp(item.startedAt)) {
        skippedSessions += 1;
        return;
      }
      var startedAt = Number(item.startedAt);
      var oldId = typeof item.id === 'string' ? item.id : '';
      var id = safeId(oldId) && !usedSessions.has(oldId) ? oldId : uid('session');
      usedSessions.add(id);
      if (oldId && !sessionMap.has(oldId)) sessionMap.set(oldId, id);
      var endedAt = null;
      if (item.endedAt !== null && item.endedAt !== undefined) {
        if (validTimestamp(item.endedAt) && Number(item.endedAt) >= startedAt) {
          endedAt = Number(item.endedAt);
        }
      }
      sessions.push({
        id: id,
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(item.date || '')) ? String(item.date) : dateKey(startedAt),
        startedAt: startedAt,
        endedAt: endedAt,
        durationSec: endedAt ? Math.max(0, Math.round((endedAt - startedAt) / 1000)) : null,
        note: sanitizeText(item.note, 500)
      });
    });
    if (source.sessions.length && !sessions.length) {
      throw new Error('没有可用的训练会话');
    }

    var sessionById = new Map(sessions.map(function (session) { return [session.id, session]; }));
    var usedSets = new Set();
    var sets = [];
    var skippedSets = 0;
    source.sets.forEach(function (item) {
      if (!item || typeof item !== 'object') { skippedSets += 1; return; }
      var sessionId = sessionMap.get(String(item.sessionId == null ? '' : item.sessionId));
      var exerciseId = exerciseMap.get(String(item.exerciseId == null ? '' : item.exerciseId));
      if (!sessionId || !exerciseId) { skippedSets += 1; return; }
      var weight = null;
      if (item.weight !== null && item.weight !== undefined && Number.isFinite(Number(item.weight))) {
        weight = clamp(Number(item.weight), 0, 2000);
      }
      var reps = null;
      if (item.reps !== null && item.reps !== undefined && Number.isFinite(Number(item.reps))) {
        reps = clamp(Math.round(Number(item.reps)), 0, 100000);
      }
      var durationSec = null;
      if (item.durationSec !== null && item.durationSec !== undefined && Number.isFinite(Number(item.durationSec))) {
        durationSec = clamp(Math.round(Number(item.durationSec)), 0, 604800);
      }
      if (weight === null && reps === null && durationSec === null) {
        skippedSets += 1;
        return;
      }
      var rpe = null;
      if (item.rpe !== null && item.rpe !== undefined && Number.isFinite(Number(item.rpe))) {
        var rawRpe = Number(item.rpe);
        if (rawRpe >= 1 && rawRpe <= 10) rpe = Math.round(rawRpe * 2) / 2;
      }
      var oldId = typeof item.id === 'string' ? item.id : '';
      var id = safeId(oldId) && !usedSets.has(oldId) ? oldId : uid('set');
      usedSets.add(id);
      var parentSession = sessionById.get(sessionId);
      sets.push({
        id: id,
        sessionId: sessionId,
        exerciseId: exerciseId,
        weight: weight,
        reps: reps,
        durationSec: durationSec,
        rpe: rpe,
        completed: item.completed !== false,
        createdAt: validTimestamp(item.createdAt) ? Number(item.createdAt) : (parentSession ? parentSession.startedAt : now),
        updatedAt: validTimestamp(item.updatedAt) ? Number(item.updatedAt) : now
      });
    });
    if (source.sets.length && !sets.length) {
      throw new Error('没有可用的组记录');
    }

    var settings = Object.assign({}, DEFAULT_SETTINGS);
    if (source.settings && Number.isFinite(Number(source.settings.restSec))) {
      settings.restSec = clamp(Math.round(Number(source.settings.restSec)), 15, 900);
    }

    return {
      exercises: exercises,
      sessions: sessions,
      sets: sets,
      settings: settings,
      skippedExercises: skippedExercises,
      skippedSessions: skippedSessions,
      skippedSets: skippedSets
    };
  }

  function promptImport(normalized) {
    var counts = normalized.sessions.length + ' 次训练、' + normalized.sets.length + ' 组记录、' + normalized.exercises.length + ' 个动作';
    var skipped = normalized.skippedExercises + normalized.skippedSessions + normalized.skippedSets;
    var message = '将用导入的 ' + counts + '替换当前全部数据。当前数据会被覆盖，且无法恢复。\n建议先导出备份。';
    if (skipped) message += '\n有 ' + skipped + ' 条无法解析的记录会被跳过。';
    showDialog({
      title: '替换当前数据？',
      message: message,
      confirmLabel: '替换并导入',
      danger: true,
      onConfirm: function () {
        return performImport(normalized);
      }
    });
  }

  function performImport(normalized) {
    if (ui.importing) return Promise.reject(new Error('导入正在进行中'));
    ui.importing = true;
    var ops = [
      { store: 'sets', type: 'clear' },
      { store: 'sessions', type: 'clear' },
      { store: 'exercises', type: 'clear' },
      { store: 'meta', type: 'clear' }
    ];
    normalized.exercises.forEach(function (ex) { ops.push({ store: 'exercises', type: 'put', value: ex }); });
    normalized.sessions.forEach(function (s) { ops.push({ store: 'sessions', type: 'put', value: s }); });
    normalized.sets.forEach(function (set) { ops.push({ store: 'sets', type: 'put', value: set }); });
    ops.push({ store: 'meta', type: 'put', value: { key: 'seeded', value: true } });
    ops.push({ store: 'meta', type: 'put', value: { key: 'settings', value: normalized.settings } });

    return dbBatch(ops).then(function () {
      state.exercises = normalized.exercises;
      state.sessions = normalized.sessions;
      state.sets = normalized.sets;
      state.settings = Object.assign({}, normalized.settings);
      rest = null;
      ui.sheet = null;
      ui.focusSheet = false;
      ui.finishEndAt = null;
      ui.tab = 'train';
      ui.historyExpanded.clear();
      ui.exerciseFilter = 'all';
      ui.pickerQuery = '';
      ui.currentExerciseId = chooseValidExerciseId(null);
      renderAll();
      toast('导入完成 · ' + normalized.sessions.length + ' 次训练 / ' + normalized.sets.length + ' 组');
    }).finally(function () {
      ui.importing = false;
    });
  }

  function openImportPasteSheet() {
    openSheet({ type: 'importPaste' });
  }

  function validatePasteImport() {
    var area = document.getElementById('pasteJson');
    var text = area ? area.value.trim() : '';
    if (!text) {
      toast('请先粘贴 JSON 内容');
      return;
    }
    var normalized;
    try {
      normalized = normalizeImport(JSON.parse(text));
    } catch (err) {
      toast('无法导入：' + (err && err.message ? err.message : 'JSON 格式不正确'));
      return;
    }
    promptImport(normalized);
  }

  function setRestDefault(seconds) {
    var value = Math.round(Number(seconds));
    if (!Number.isFinite(value) || value < 15 || value > 900) {
      toast('休息时长需要在 15–900 秒之间');
      return;
    }
    state.settings.restSec = value;
    metaSet('settings', state.settings).then(function () {
      if (ui.sheet && ui.sheet.type === 'data') refreshSheetKeepScroll();
      toast('默认休息 ' + value + ' 秒');
    }).catch(function (err) {
      console.error(err);
      toast('设置保存失败');
    });
  }

  function saveRestCustom() {
    var area = document.getElementById('restCustomInput');
    if (!area) return;
    var value = parseInt(area.value, 10);
    if (!Number.isFinite(value) || value < 15 || value > 900) {
      toast('请输入 15–900 秒之间的数字');
      return;
    }
    setRestDefault(value);
  }

  function requestNotificationPermission() {
    if (typeof window.Notification !== 'function') {
      toast('当前浏览器不支持系统通知');
      return Promise.resolve();
    }
    if (Notification.permission === 'granted') {
      toast('系统通知已开启');
      return Promise.resolve();
    }
    if (Notification.permission === 'denied') {
      toast('通知已被拒绝，请在站点设置中允许');
      return Promise.resolve();
    }
    var request;
    try {
      request = Notification.requestPermission();
    } catch (err) {
      toast('无法请求通知权限');
      return Promise.resolve();
    }
    var promise = request && typeof request.then === 'function'
      ? request
      : Promise.resolve(Notification.permission);
    return promise.then(function (permission) {
      if (permission === 'granted') toast('已开启休息结束提醒');
      else if (permission === 'denied') toast('通知权限被拒绝');
      else toast('通知权限未开启');
      if (ui.sheet && ui.sheet.type === 'data') refreshSheetKeepScroll();
    }).catch(function (err) {
      console.error(err);
      toast('无法请求通知权限');
    });
  }

  /* ------------------------------------------------------------------ *
   * Rest timer
   * ------------------------------------------------------------------ */

  function beginRest(exerciseId) {
    if (!activeSession()) return;
    var seconds = clamp(Math.round(Number(state.settings.restSec) || 90), 15, 900);
    var now = Date.now();
    rest = {
      targetEnd: now + seconds * 1000,
      totalMs: seconds * 1000,
      exerciseId: exerciseId || ui.currentExerciseId,
      startedAt: now,
      ended: false,
      endedAt: null
    };
    persistRest();
  }

  function persistRest() {
    if (!db) return Promise.resolve();
    return metaSet('rest', rest ? {
      targetEnd: rest.targetEnd,
      totalMs: rest.totalMs,
      exerciseId: rest.exerciseId,
      startedAt: rest.startedAt,
      ended: !!rest.ended,
      endedAt: rest.endedAt || null
    } : null).catch(function (err) {
      console.warn('无法保存休息计时状态', err);
    });
  }

  function adjustRest(deltaSeconds) {
    if (!rest || rest.ended) return;
    var now = Date.now();
    var minEnd = now + 3000;
    rest.targetEnd = Math.max(minEnd, rest.targetEnd + deltaSeconds * 1000);
    rest.totalMs = Math.max(3000, rest.totalMs + deltaSeconds * 1000);
    persistRest();
    renderChrome();
    syncLayers();
    updateRestCountdown();
  }

  function skipRest() {
    if (!rest) return Promise.resolve();
    var ended = rest.ended;
    rest = null;
    persistRest();
    renderAll();
    toast(ended ? '已关闭休息提示' : '已跳过休息');
    return Promise.resolve();
  }

  function restNext() {
    if (!rest) {
      openRecordForCurrent();
      return;
    }
    rest = null;
    persistRest();
    openRecordForCurrent();
  }

  function finishRest() {
    if (!rest || rest.ended) return;
    if (!activeSession()) {
      rest = null;
      persistRest();
      renderChrome();
      syncLayers();
      return;
    }
    rest.ended = true;
    rest.endedAt = Date.now();
    persistRest();
    renderChrome();
    syncLayers();
    playRestEndAlert();
    toast('休息结束，可以开始下一组了');
  }

  function updateRestCountdown() {
    if (!rest) return;
    var left = rest.targetEnd - Date.now();
    var timeEl = document.getElementById('restTime');
    if (timeEl && !rest.ended) {
      var text = fmtRest(left);
      if (timeEl.textContent !== text) timeEl.textContent = text;
      timeEl.classList.toggle('soon', left <= 10000);
    }
    var fill = document.getElementById('restFill');
    if (fill && !rest.ended) {
      var progress = clamp(left / Math.max(1000, rest.totalMs), 0, 1);
      fill.style.transform = 'scaleX(' + progress.toFixed(3) + ')';
    }
  }

  function tick() {
    if (state.dbError || !state.loaded) return;
    var session = activeSession();
    if (session) {
      var clock = document.getElementById('sessionClock');
      if (clock) {
        var displayNow = ui.sheet && ui.sheet.type === 'finish' && ui.finishEndAt ? ui.finishEndAt : Date.now();
        var text = fmtClockLong(displayNow - session.startedAt);
        if (clock.textContent !== text) clock.textContent = text;
      }
    }
    if (!rest) return;
    if (!session) {
      rest = null;
      persistRest();
      renderChrome();
      syncLayers();
      return;
    }
    var left = rest.targetEnd - Date.now();
    if (!rest.ended) {
      if (left <= 0) {
        finishRest();
        return;
      }
      updateRestCountdown();
    }
  }

  function startTicker() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(tick, 250);
  }

  function initAudio() {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function () { /* noop */ });
      }
    } catch (err) {
      audioCtx = null;
    }
  }

  function playRestEndAlert() {
    initAudio();
    if (audioCtx) {
      try {
        var t0 = audioCtx.currentTime + 0.03;
        [660, 660, 880].forEach(function (frequency, index) {
          var start = t0 + index * 0.2;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.07, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.17);
        });
      } catch (err) {
        console.warn('提示音播放失败', err);
      }
    }
    try {
      if (navigator.vibrate) navigator.vibrate([120, 70, 120]);
    } catch (err) { /* noop */ }

    if (document.hidden && typeof window.Notification === 'function' && Notification.permission === 'granted') {
      var exercise = rest ? getExercise(rest.exerciseId) : null;
      try {
        var notification = new Notification('组间休息结束', {
          body: (exercise ? exercise.name + ' · ' : '') + '可以开始下一组了',
          tag: 'training-log-rest'
        });
        notification.onclick = function () {
          try { window.focus(); } catch (err) { /* noop */ }
          notification.close();
        };
      } catch (err) {
        console.warn('系统通知发送失败', err);
      }
    }
  }

  /* ------------------------------------------------------------------ *
   * Action dispatch
   * ------------------------------------------------------------------ */

  function handleAction(action, el) {
    var data = el.dataset || {};
    switch (action) {
      case 'tab':
        switchTab(data.tab);
        return;
      case 'openData':
        openDataSheet();
        return;
      case 'closeSheet':
        closeSheet();
        return;
      case 'retryBoot':
        window.location.reload();
        return;
      case 'startSession':
        return startSession();
      case 'quickStart':
        return startSession(data.id);
      case 'openStartPicker':
        openPicker('start');
        return;
      case 'openPicker':
        openPicker(data.origin || (ui.sheet && ui.sheet.type === 'record' ? 'record' : 'train'));
        return;
      case 'tabExercises':
        switchTab('exercises');
        return;
      case 'openLastSession':
        openLastSession(data.id);
        return;
      case 'finishSession':
        openFinishSheet();
        return;
      case 'selectExercise':
        selectExercise(data.id);
        return;
      case 'toggleSet':
        toggleSet(data.id);
        return;
      case 'editSet':
        openRecordForSet(data.id);
        return;
      case 'deleteSet':
        return deleteSetById(data.id, false);
      case 'openRecord':
        openRecordForCurrent();
        return;
      case 'weightStep':
        stepWeight(Number(data.delta));
        return;
      case 'toggleWeightCustom':
        toggleRecordCustom('weight');
        return;
      case 'repsPick':
        pickReps(Number(data.value));
        return;
      case 'toggleRepsCustom':
        toggleRecordCustom('reps');
        return;
      case 'durationPick':
        pickDuration(Number(data.value));
        return;
      case 'toggleDurationCustom':
        toggleRecordCustom('duration');
        return;
      case 'rpePick':
        pickRpe(data.value);
        return;
      case 'toggleRpeCustom':
        toggleRecordCustom('rpe');
        return;
      case 'saveSet':
        saveDraftSet();
        return;
      case 'deleteSetFromSheet':
        deleteSetFromSheet();
        return;
      case 'finishSessionFromRecord':
        openFinishSheet();
        return;
      case 'saveFinish':
        saveFinishedSession();
        return;
      case 'discardSession':
        promptDiscardSession();
        return;
      case 'toggleHistory':
        toggleHistory(data.id);
        return;
      case 'deleteSession':
        promptDeleteSession(data.id);
        return;
      case 'statsPeriod':
        setStatsPeriod(data.period);
        return;
      case 'openExerciseDetail':
        openExerciseDetail(data.id);
        return;
      case 'addExercise':
        openExerciseForm(null, 'exercises');
        return;
      case 'addExerciseFromPicker':
        addExerciseFromPicker();
        return;
      case 'editExercise':
        openExerciseForm(data.id, 'exercises');
        return;
      case 'toggleFavorite':
        return toggleFavorite(data.id);
      case 'filterExercises':
        setExerciseFilter(data.filter);
        return;
      case 'setExerciseMetric':
        setExerciseMetric(data.metric);
        return;
      case 'saveExercise':
        saveExerciseForm();
        return;
      case 'removeExercise':
        promptRemoveExercise(data.id);
        return;
      case 'chooseExercise':
        return chooseExercise(data.id);
      case 'requestNotify':
        return requestNotificationPermission();
      case 'exportData':
        exportDataFile();
        return;
      case 'copyData':
        return copyDataToClipboard();
      case 'importFile':
        pickImportFile();
        return;
      case 'openImportPaste':
        openImportPasteSheet();
        return;
      case 'validatePasteImport':
        validatePasteImport();
        return;
      case 'setRestDefault':
        setRestDefault(Number(data.sec));
        return;
      case 'saveRestCustom':
        saveRestCustom();
        return;
      case 'restPlus':
        adjustRest(15);
        return;
      case 'restMinus':
        adjustRest(-15);
        return;
      case 'skipRest':
        return skipRest();
      case 'restNext':
        restNext();
        return;
      case 'selectFallback':
        selectFallbackText();
        return;
      case 'closeDialog':
        closeDialog();
        return;
      case 'confirmDialog':
        confirmDialogAction();
        return;
      case 'toastAction':
        runToastAction();
        return;
      default:
        console.warn('未处理的操作', action);
    }
  }

  function switchTab(tab) {
    if (!['train', 'history', 'stats', 'exercises'].includes(tab)) return;
    if (ui.dialog) closeDialog(true);
    if (ui.sheet) {
      ui.sheet = null;
      ui.focusSheet = false;
    }
    ui.finishEndAt = null;
    ui.tab = tab;
    renderAll();
    try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (err) { window.scrollTo(0, 0); }
  }

  function runAction(action, el) {
    if (!action) return;
    if (state.dbError && action !== 'retryBoot' && action !== 'openData') {
      toast('本机数据库不可用');
      return;
    }
    initAudio();
    try {
      var result = handleAction(action, el);
      if (result && typeof result.then === 'function') {
        result.catch(function (err) {
          console.error(err);
          toast(err && err.message ? '操作失败：' + err.message : '操作失败，请重试');
        });
      }
    } catch (err) {
      console.error(err);
      toast(err && err.message ? '操作失败：' + err.message : '操作失败，请重试');
    }
  }

  /* ------------------------------------------------------------------ *
   * Events
   * ------------------------------------------------------------------ */

  document.addEventListener('pointerdown', function (e) {
    initAudio();
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pointerStart = { id: e.pointerId, x: e.clientX, y: e.clientY };
  }, { passive: true });

  document.addEventListener('pointerup', function (e) {
    var start = pointerStart;
    pointerStart = null;
    if (!start || start.id !== e.pointerId) return;
    // A pointer gesture just happened, so suppress the synthetic click that follows.
    suppressClickUntil = Date.now() + 800;
    if (Math.abs(e.clientX - start.x) > 12 || Math.abs(e.clientY - start.y) > 12) return;
    var target = e.target instanceof Element ? e.target.closest('[data-act]') : null;
    if (!target || target.disabled) return;
    runAction(target.dataset.act, target);
  });

  // Fallback for screen readers and browsers without PointerEvent. The 800ms guard
  // prevents a normal tap from activating twice (pointerup + click).
  document.addEventListener('click', function (e) {
    if (Date.now() < suppressClickUntil) return;
    var target = e.target instanceof Element ? e.target.closest('[data-act]') : null;
    if (!target || target.disabled) return;
    runAction(target.dataset.act, target);
  });

  document.addEventListener('pointercancel', function () {
    pointerStart = null;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (ui.dialog) {
        e.preventDefault();
        closeDialog();
        return;
      }
      if (ui.sheet) {
        e.preventDefault();
        closeSheet();
        return;
      }
    }

    if (e.key === 'Tab' && (ui.dialog || ui.sheet)) {
      var root = ui.dialog ? els.dialogRoot : els.sheetRoot;
      var focusables = $$('button:not([disabled]),[href],input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])', root)
        .filter(function (node) { return !node.hidden && node.getAttribute('aria-hidden') !== 'true'; });
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && (document.activeElement === last || !root.contains(document.activeElement))) {
        e.preventDefault();
        if (ui.dialog) first.focus();
        else first.focus();
      }
      return;
    }

    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var target = e.target;
      if (!(target instanceof Element)) return;
      var button = target.closest('button[data-act]');
      if (button && !button.disabled) {
        e.preventDefault();
        runAction(button.dataset.act, button);
      }
    }
  });

  document.addEventListener('input', function (e) {
    var target = e.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.id === 'pickerSearch') {
      ui.pickerQuery = target.value;
      var list = document.getElementById('pickerList');
      if (list) list.innerHTML = pickerRowsHtml(searchExercises(ui.pickerQuery));
      return;
    }
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    var draft = ui.sheet.draft;
    if (target.id === 'weightInput') draft.weightInput = target.value;
    else if (target.id === 'repsInput') draft.repsInput = target.value;
    else if (target.id === 'durationInput') draft.durationInput = target.value;
    else if (target.id === 'rpeInput') draft.rpeInput = target.value;
  });

  document.addEventListener('change', function (e) {
    var target = e.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.id === 'importFile') {
      var file = target.files && target.files[0];
      target.value = '';
      if (file) handleImportFile(file);
      return;
    }
    if (target.id === 'setCompleted' && ui.sheet && ui.sheet.type === 'record') {
      ui.sheet.draft.completed = target.checked;
      return;
    }
    if (target.id === 'exFavorite' && ui.sheet && ui.sheet.type === 'exerciseForm') {
      ui.sheet.form.favorite = target.checked;
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });

  window.addEventListener('pageshow', function (event) {
    if (event.persisted) tick();
  });

  window.addEventListener('beforeunload', function () {
    if (rest) persistRest();
  });

  /* ------------------------------------------------------------------ *
   * Test-only debug hook (enabled with #debug)
   * ------------------------------------------------------------------ */

  if (window.location.hash === '#debug') {
    Object.defineProperty(window, '__TL_DEBUG__', {
      value: {
        snapshot: function () {
          return JSON.parse(JSON.stringify({
            exercises: state.exercises,
            sessions: state.sessions,
            sets: state.sets,
            settings: state.settings,
            activeSessionId: activeSession() ? activeSession().id : null,
            currentExerciseId: ui.currentExerciseId,
            tab: ui.tab,
            rest: rest ? Object.assign({}, rest) : null,
            sheet: ui.sheet ? ui.sheet.type : null
          }));
        },
        tick: tick
      },
      configurable: false,
      enumerable: false,
      writable: false
    });
  }

  /* ------------------------------------------------------------------ *
   * Go
   * ------------------------------------------------------------------ */

  boot();
})();
</script>
</body>
