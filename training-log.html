          '<span class="start-cta">去添加 <span class="chev" aria-hidden="true">›</span></span>' +
        '</button>';

    return '' +
      '<header class="page-head">' +
        '<p class="eyebrow">' + esc(fmtDay(Date.now())) + '</p>' +
        '<h1>今天练什么</h1>' +
        '<p class="page-sub">本周 <strong>' + week.sessions + '</strong> 次 · <strong>' + week.sets + '</strong> 组' +
          (week.volume > 0 ? ' · <strong>' + formatVolume(week.volume) + '</strong> kg 容量' : '') +
        '</p>' +
      '</header>' +
      '<div class="home-layout">' +
        '<div class="home-main">' +
          '<section class="card" aria-labelledby="favTitle">' +
            '<div class="section-head">' +
              '<div><h2 id="favTitle">常用动作</h2><p class="section-hint">点按动作，直接开始训练</p></div>' +
              (hasExercises
                ? '<button class="link-btn" type="button" data-act="openStartPicker">自选动作</button>'
                : '<button class="link-btn" type="button" data-act="tabExercises">管理</button>') +
            '</div>' +
            favInner +
          '</section>' +
        '</div>' +
        '<div class="home-side">' +
          lastHtml +
          startCta +
        '</div>' +
      '</div>';
  }

  function favTileHtml(ex) {
    var last = lastCompletedSet(ex.id);
    var meta = [ex.muscle || '未分类'];
    if (last) meta.push('上次 ' + setCompactText(last, ex));
    return '<button class="fav-tile" type="button" data-act="quickStart" data-id="' + escapeAttr(ex.id) + '" aria-label="开始训练：' + esc(ex.name) + '">' +
      '<span class="fav-name">' + esc(ex.name) + '</span>' +
      '<span class="fav-meta">' + esc(meta.join(' · ')) + '</span>' +
    '</button>';
  }

  /* ------------------------------------------------------------------ *
   * Active session
   * ------------------------------------------------------------------ */

  function renderActive(session) {
    var current = ensureCurrentExercise();
    var allSets = setsForSession(session.id);
    var done = allSets.filter(function (set) { return set.completed; });
    var pending = allSets.length - done.length;
    var volume = done.reduce(function (sum, set) { return sum + volumeOfSet(set); }, 0);
    var displayNow = ui.sheet && ui.sheet.type === 'finish' && ui.finishEndAt ? ui.finishEndAt : Date.now();
    var elapsed = Math.max(0, displayNow - session.startedAt);

    var exerciseIds = [];
    allSets.forEach(function (set) {
      var ex = getExercise(set.exerciseId);
      if (ex && !ex.archived && exerciseIds.indexOf(ex.id) === -1) exerciseIds.push(ex.id);
    });
    if (current && exerciseIds.indexOf(current.id) === -1) exerciseIds.unshift(current.id);

    var chips = exerciseIds.map(function (id) {
      var ex = getExercise(id);
      if (!ex) return '';
      var count = allSets.filter(function (set) { return set.exerciseId === id; }).length;
      var label = esc(ex.name) + (count ? '<span class="count">' + count + '</span>' : '');
      return '<button class="chip" type="button" data-act="selectExercise" data-id="' + escapeAttr(id) + '" aria-pressed="' +
        (current && current.id === id ? 'true' : 'false') + '">' + label + '</button>';
    }).join('');

    var pickerChip = activeExercises().length
      ? '<button class="chip" type="button" data-act="openPicker" data-origin="train">更换动作</button>'
      : '<button class="chip" type="button" data-act="tabExercises">添加动作</button>';

    var setSection;
    if (!current) {
      setSection =
        '<section class="card sets-card">' +
          '<div class="set-empty">' +
            '<p class="empty-title">动作库为空</p>' +
            '<p class="empty-text">先添加一个动作，再开始记录组。</p>' +
            '<button class="btn btn-sm" type="button" data-act="tabExercises">前往动作库</button>' +
          '</div>' +
        '</section>';
    } else {
      var exSets = allSets.filter(function (set) { return set.exerciseId === current.id; });
      var exDone = exSets.filter(function (set) { return set.completed; });
      var exVolume = exDone.reduce(function (sum, set) { return sum + volumeOfSet(set); }, 0);
      var exPending = exSets.length - exDone.length;
      var setRows = exSets.map(function (set, index) {
        return setRowHtml(set, index, current);
      }).join('');
      var setList = exSets.length
        ? '<div class="set-list">' + setRows + '</div>' +
          '<div class="set-footer">' +
            '<span><strong>' + exSets.length + '</strong> 组</span>' +
            (exPending ? '<span><strong>' + exPending + '</strong> 组未完成</span>' : '') +
            (exVolume > 0 ? '<span>容量 <strong>' + formatVolume(exVolume) + '</strong> kg</span>' : '') +
          '</div>'
        : '<div class="set-empty">' +
            '<p class="empty-title">还没有记录</p>' +
            '<p class="empty-text">点下方“记录一组”，先完成今天的第一组。</p>' +
          '</div>';
      setSection =
        '<section class="card sets-card" aria-labelledby="currentExerciseTitle">' +
          '<div class="section-head">' +
            '<div><h2 id="currentExerciseTitle">' + esc(current.name) + '</h2>' +
              '<p class="section-hint">' + esc(current.muscle || '未分类') + ' · ' + esc(METRICS[metricOf(current)]) + '</p>' +
            '</div>' +
            '<button class="link-btn" type="button" data-act="openRecord">记录</button>' +
          '</div>' +
          setList +
        '</section>';
    }

    return '' +
      '<section class="session-card" aria-label="进行中的训练">' +
        '<div class="session-top">' +
          '<div>' +
            '<div class="live-tag"><span class="live-dot" aria-hidden="true"></span>进行中</div>' +
            '<div class="session-start">' + esc(fmtDay(session.startedAt)) + ' · ' + esc(fmtTime(session.startedAt)) + ' 开始</div>' +
          '</div>' +
          '<button class="btn btn-outline btn-sm" type="button" data-act="finishSession">结束</button>' +
        '</div>' +
        '<div class="session-clock" id="sessionClock" role="timer" aria-label="训练总时长">' + fmtClockLong(elapsed) + '</div>' +
        '<div class="session-sub">' + exerciseIds.length + ' 个动作 · ' + allSets.length + ' 组' +
          (pending ? '（' + pending + ' 组未完成）' : '') +
          (volume > 0 ? ' · ' + formatVolume(volume) + ' kg 容量' : '') +
        '</div>' +
      '</section>' +
      '<div class="exercise-chips"><div class="chip-row">' + chips + pickerChip + '</div></div>' +
      setSection;
  }

  function setRowHtml(set, index, ex) {
    var details = ['第 ' + (index + 1) + ' 组'];
    details.push(set.completed ? '已完成' : '未完成');
    if (set.rpe != null) details.push('RPE ' + formatRpe(set.rpe));
    return '<div class="set-row ' + (set.completed ? 'is-done' : 'is-pending') + '">' +
      '<button class="set-mark" type="button" data-act="toggleSet" data-id="' + escapeAttr(set.id) + '" aria-pressed="' +
        (set.completed ? 'true' : 'false') + '" aria-label="' + (set.completed ? '标记为未完成' : '标记为已完成') + '">' +
        '<span class="mark" aria-hidden="true">✓</span>' +
      '</button>' +
      '<button class="set-body" type="button" data-act="editSet" data-id="' + escapeAttr(set.id) + '">' +
        '<span class="set-main">' + esc(setMainText(set, ex)) + '</span>' +
        '<span class="set-sub">' + esc(details.join(' · ')) + '</span>' +
      '</button>' +
      '<button class="set-del" type="button" data-act="deleteSet" data-id="' + escapeAttr(set.id) + '" aria-label="删除第 ' + (index + 1) + ' 组">×</button>' +
    '</div>';
  }

  function dockHtml() {
    var ex = ensureCurrentExercise();
    if (!activeExercises().length) {
      return '<div class="dock"><div class="dock-inner">' +
        '<div class="dock-pick"><span class="dock-kicker">动作库为空</span><span class="dock-name">先添加动作</span></div>' +
        '<button class="btn btn-primary dock-add" type="button" data-act="tabExercises">去添加</button>' +
      '</div></div>';
    }
    return '<div class="dock"><div class="dock-inner">' +
      '<button class="dock-pick" type="button" data-act="openPicker" data-origin="train">' +
        '<span class="dock-kicker">当前动作</span>' +
        '<span class="dock-name">' + esc(ex ? ex.name : '选择动作') + ' <span class="chev" aria-hidden="true">›</span></span>' +
      '</button>' +
      (ex
        ? '<button class="btn btn-primary dock-add" type="button" data-act="openRecord">记录一组</button>'
        : '<button class="btn btn-primary dock-add" type="button" data-act="openPicker" data-origin="train">选择动作</button>') +
    '</div></div>';
  }

  function restHtml() {
    if (!rest) return '';
    var ex = getExercise(rest.exerciseId);
    var left = Math.max(0, rest.targetEnd - Date.now());
    var progress = rest.ended ? 0 : clamp(left / Math.max(1000, rest.totalMs), 0, 1);
    var soon = !rest.ended && left <= 10000;
    var name = ex ? ' · ' + esc(ex.name) : '';
    var actions = rest.ended
      ? '<button class="rest-btn" type="button" data-act="skipRest">关闭</button>' +
        '<button class="rest-btn primary" type="button" data-act="restNext">下一组</button>'
      : '<button class="rest-btn" type="button" data-act="restMinus" aria-label="减少 15 秒">−15</button>' +
        '<button class="rest-btn" type="button" data-act="restPlus" aria-label="增加 15 秒">+15</button>' +
        '<button class="rest-btn" type="button" data-act="skipRest">跳过</button>';
    return '<section class="rest-bar ' + (rest.ended ? 'is-ended' : '') + '" aria-label="组间休息计时器">' +
      '<div class="rest-inner">' +
        '<div class="rest-info">' +
          '<div class="rest-kicker">' + (rest.ended ? '休息结束' : '组间休息') + name + '</div>' +
          '<div class="rest-mainline">' +
            '<span class="rest-time' + (soon ? ' soon' : '') + '" id="restTime" role="timer">' +
              (rest.ended ? '00:00' : fmtRest(left)) +
            '</span>' +
            '<span class="rest-caption" id="restCaption">' + (rest.ended ? '可以开始下一组' : '后继续') + '</span>' +
          '</div>' +
          '<div class="rest-track" aria-hidden="true"><i class="rest-fill" id="restFill" style="transform:scaleX(' + progress.toFixed(3) + ')"></i></div>' +
        '</div>' +
        '<div class="rest-actions">' + actions + '</div>' +
      '</div>' +
    '</section>';
  }

  /* ------------------------------------------------------------------ *
   * History
   * ------------------------------------------------------------------ */

  function renderHistory() {
    var sessions = finishedSessions();
    var head = '<header class="page-head">' +
      '<p class="eyebrow">训练会话</p>' +
      '<h1>历史</h1>' +
      '<p class="page-sub">' + (sessions.length
        ? '共 ' + sessions.length + ' 次训练 · 最近 ' + esc(fmtDayShort(sessions[0].startedAt))
        : '每一次结束的训练都会按日期保存在这里') + '</p>' +
    '</header>';

    if (!sessions.length) {
      var active = activeSession();
      return head +
        '<div class="empty-card">' +
          '<p class="empty-title">还没有已完成的训练</p>' +
          '<p class="empty-text">结束一次训练后，这里会显示当天的动作、每一组明细和备注。</p>' +
          (active
            ? '<button class="btn btn-primary" type="button" data-act="tab" data-tab="train">回到进行中的训练</button>'
            : '<button class="btn btn-primary" type="button" data-act="startSession">开始第一次训练</button>') +
        '</div>';
    }

    return head + '<div class="history-list">' + sessions.map(historySessionHtml).join('') + '</div>';
  }

  function historySessionHtml(session) {
    var summary = summaryForSession(session);
    var expanded = ui.historyExpanded.has(session.id);
    var names = exerciseNamesFromSets(summary.sets, 3);
    var volume = summary.volume > 0 ? '<span>' + formatVolume(summary.volume) + ' kg</span>' : '';
    var meta = '<span>' + esc(fmtTime(session.startedAt)) + ' – ' + esc(fmtTime(session.endedAt)) + '</span>' +
      '<span>' + summary.exerciseCount + ' 个动作</span>' +
      '<span>' + summary.setCount + ' 组</span>' + volume;
    return '<section class="session-item" id="session-' + escapeAttr(session.id) + '">' +
      '<button class="session-row" type="button" data-act="toggleHistory" data-id="' + escapeAttr(session.id) + '" aria-expanded="' + (expanded ? 'true' : 'false') + '">' +
        '<span class="session-row-top">' +
          '<span class="session-date">' + esc(fmtDay(session.startedAt)) + '</span>' +
          '<span class="session-duration">' + esc(fmtDurationHuman(summary.durationMs)) + '</span>' +
        '</span>' +
        '<span class="session-title">' + esc(names) + '</span>' +
        '<span class="session-meta">' + meta + '</span>' +
        '<span class="session-expand">' + (expanded ? '收起明细' : '展开明细') + ' <span class="chev" aria-hidden="true">' + (expanded ? '⌃' : '›') + '</span></span>' +
      '</button>' +
      (expanded ? historyDetailHtml(session) : '') +
    '</section>';
  }

  function historyDetailHtml(session) {
    var summary = summaryForSession(session);
    var groups = groupsForSets(summary.sets);
    var groupsHtml = groups.map(function (group) {
      var ex = getExercise(group.exerciseId);
      var display = ex || { name: '已移除动作', metric: 'weight_reps' };
      var rows = group.sets.map(function (set, index) {
        var metaBits = [];
        if (set.rpe != null) metaBits.push('RPE ' + formatRpe(set.rpe));
        if (!set.completed) metaBits.push('<span class="pending-label">未完成</span>');
        return '<div class="h-set">' +
          '<span class="h-set-idx">' + (index + 1) + '</span>' +
          '<span class="h-set-val">' + esc(setCompactText(set, display)) + '</span>' +
          '<span class="h-set-meta">' + metaBits.join(' · ') + '</span>' +
        '</div>';
      }).join('');
      return '<div class="history-group">' +
        '<div class="history-group-head">' +
          '<span class="history-group-name">' + esc(ex ? ex.name : '已移除动作') + '</span>' +
          '<span class="history-group-meta">' + group.sets.length + ' 组</span>' +
        '</div>' + rows +
      '</div>';
    }).join('');

    return '<div class="session-detail">' +
      (session.note ? '<p class="detail-note">' + esc(session.note) + '</p>' : '') +
      (groupsHtml || '<p class="empty-text">这次训练没有组记录。</p>') +
      '<div class="detail-actions">' +
        '<button class="text-danger" type="button" data-act="deleteSession" data-id="' + escapeAttr(session.id) + '">删除这次训练</button>' +
      '</div>' +
    '</div>';
  }

  /* ------------------------------------------------------------------ *
   * Stats
   * ------------------------------------------------------------------ */

  function renderStats() {
    var stats = periodStats(ui.statsPeriod);
    var rows = state.exercises.map(function (ex) {
      return { ex: ex, records: recordsForExercise(ex.id) };
    }).filter(function (item) {
      return item.records.completed > 0;
    }).sort(function (a, b) {
      return b.records.latest - a.records.latest;
    });

    var totalDuration = statDurationParts(stats.durationMs);
    var active = activeSession();
    var periodNote = active
      ? '进行中的训练会在结束后计入周/月汇总。个人纪录由所有已完成组计算。'
      : '周/月汇总只统计已结束的训练。个人纪录由所有已完成组计算。';

    var prRows = rows.length
      ? rows.map(prRowHtml).join('')
      : '<div class="empty-text" style="padding:16px 0 6px">还没有可以统计的组记录。完成第一组后，这里会自动计算每个动作的个人纪录。</div>';

    return '' +
      '<header class="page-head">' +
        '<p class="eyebrow">实时聚合</p>' +
        '<h1>统计</h1>' +
        '<p class="page-sub">周/月汇总与个人纪录，都从每一组记录实时计算。</p>' +
      '</header>' +
      '<div class="segmented" role="group" aria-label="统计周期">' +
        '<button type="button" data-act="statsPeriod" data-period="week" aria-pressed="' + (ui.statsPeriod === 'week' ? 'true' : 'false') + '">本周</button>' +
        '<button type="button" data-act="statsPeriod" data-period="month" aria-pressed="' + (ui.statsPeriod === 'month' ? 'true' : 'false') + '">本月</button>' +
      '</div>' +
      '<section class="card period-card">' +
        '<p class="range-line">' + esc(stats.label) + '</p>' +
        '<div class="stat-grid">' +
          '<div class="stat-cell"><div class="stat-value">' + stats.sessions + '</div><div class="stat-label">训练次数</div></div>' +
          '<div class="stat-cell"><div class="stat-value">' + stats.sets + '</div><div class="stat-label">总组数</div></div>' +
          '<div class="stat-cell"><div class="stat-value">' + formatVolume(stats.volume) + '<span class="stat-unit">kg</span></div><div class="stat-label">总容量</div></div>' +
          '<div class="stat-cell"><div class="stat-value">' + totalDuration.value + '<span class="stat-unit">' + totalDuration.unit + '</span></div><div class="stat-label">总时长</div></div>' +
        '</div>' +
        '<p class="stat-note">' + esc(periodNote) + '</p>' +
      '</section>' +
      '<section class="card pr-section" aria-labelledby="prTitle">' +
        '<div class="section-head">' +
          '<div><h2 id="prTitle">个人纪录</h2><p class="section-hint">点击动作查看单动作历史</p></div>' +
        '</div>' +
        '<div class="pr-list">' + prRows + '</div>' +
      '</section>';
  }

  function prRowHtml(item) {
    var ex = item.ex;
    var records = item.records;
    var metric = metricOf(ex);
    var values = '';
    if (metric === 'weight_reps') {
      values =
        '<div class="pr-value"><strong>' + (records.maxWeight ? formatWeight(records.maxWeight.weight) : '—') +
          (records.maxWeight ? '<span class="unit">kg</span>' : '') + '</strong><span>最高重量</span></div>' +
        '<div class="pr-value"><strong>' + (records.maxReps ? formatReps(records.maxReps.reps) : '—') +
          (records.maxReps ? '<span class="unit">次</span>' : '') + '</strong><span>最多次数</span></div>';
    } else if (metric === 'reps') {
      values =
        '<div class="pr-value"><strong>' + (records.maxReps ? formatReps(records.maxReps.reps) : '—') +
          (records.maxReps ? '<span class="unit">次</span>' : '') + '</strong><span>最多次数</span></div>';
    } else {
      values =
        '<div class="pr-value"><strong>' + (records.maxDuration ? fmtClockSec(records.maxDuration.durationSec) : '—') +
          '</strong><span>最长时长</span></div>';
    }
    var meta = esc(ex.muscle || '未分类') + ' · 累计 ' + records.completed + ' 组' +
      (records.latest ? ' · ' + esc(fmtDayShort(records.latest)) : '') +
      (ex.archived ? ' · 已移除' : '');
    return '<button class="pr-row" type="button" data-act="openExerciseDetail" data-id="' + escapeAttr(ex.id) + '">' +
      '<span class="pr-main">' +
        '<span class="pr-name">' + esc(ex.name) + '</span>' +
        '<span class="pr-meta">' + meta + '</span>' +
      '</span>' +
      '<span class="pr-values">' + values + '</span>' +
      '<span class="pr-chev" aria-hidden="true">›</span>' +
    '</button>';
  }

  /* ------------------------------------------------------------------ *
   * Exercise library
   * ------------------------------------------------------------------ */

  function renderExercises() {
    var all = activeExercises();
    var filtered = ui.exerciseFilter === 'fav'
      ? all.filter(function (ex) { return ex.favorite; })
      : all;
    var favCount = all.filter(function (ex) { return ex.favorite; }).length;

    var list = filtered.length
      ? filtered.map(exerciseRowHtml).join('')
      : '<div class="empty-card"><p class="empty-title">' +
          (ui.exerciseFilter === 'fav' ? '还没有常用动作' : '动作库为空') +
          '</p><p class="empty-text">' +
          (ui.exerciseFilter === 'fav'
            ? '点动作右侧的「常用」，它会排在记录界面的最前面。'
            : '添加一个动作后，就可以在训练中记录它。') +
          '</p>' +
          (ui.exerciseFilter === 'fav'
            ? '<button class="btn btn-sm" type="button" data-act="filterExercises" data-filter="all">查看全部动作</button>'
            : '<button class="btn btn-primary" type="button" data-act="addExercise">添加动作</button>') +
        '</div>';

    return '' +
      '<header class="page-head">' +
        '<div class="page-head-row">' +
          '<div><p class="eyebrow">动作与常用</p><h1>动作库</h1></div>' +
          '<button class="btn btn-primary btn-sm" type="button" data-act="addExercise">添加动作</button>' +
        '</div>' +
        '<p class="page-sub">共 ' + all.length + ' 个动作 · ' + favCount + ' 个常用。常用动作会排在记录界面最前面。</p>' +
      '</header>' +
      '<div class="exercise-toolbar">' +
        '<div class="filter-row" role="group" aria-label="动作筛选">' +
          '<button class="filter-btn" type="button" data-act="filterExercises" data-filter="all" aria-pressed="' + (ui.exerciseFilter === 'all' ? 'true' : 'false') + '">全部</button>' +
          '<button class="filter-btn" type="button" data-act="filterExercises" data-filter="fav" aria-pressed="' + (ui.exerciseFilter === 'fav' ? 'true' : 'false') + '">常用</button>' +
        '</div>' +
        '<span class="tiny">' + filtered.length + ' 个</span>' +
      '</div>' +
      '<div class="exercise-list">' + list + '</div>';
  }

  function exerciseRowHtml(ex) {
    var setCount = state.sets.filter(function (set) { return set.exerciseId === ex.id; }).length;
    var meta = esc(ex.muscle || '未分类') + ' · ' + esc(METRICS[metricOf(ex)]) +
      (setCount ? ' · ' + setCount + ' 组记录' : '');
    return '<div class="exercise-row">' +
      '<div class="exercise-info">' +
        '<div class="exercise-name"><span>' + esc(ex.name) + '</span>' +
          (ex.builtin ? '<span class="mini-badge">预置</span>' : '<span class="mini-badge">自定义</span>') +
        '</div>' +
        '<div class="exercise-meta">' + meta + '</div>' +
      '</div>' +
      '<div class="exercise-actions">' +
        '<button class="fav-toggle" type="button" data-act="toggleFavorite" data-id="' + escapeAttr(ex.id) + '" aria-pressed="' +
          (ex.favorite ? 'true' : 'false') + '" aria-label="' + (ex.favorite ? '取消常用：' : '设为常用：') + esc(ex.name) + '">常用</button>' +
        (ex.builtin ? '' : '<button class="edit-btn" type="button" data-act="editExercise" data-id="' + escapeAttr(ex.id) + '">编辑</button>') +
      '</div>' +
    '</div>';
  }

  /* ------------------------------------------------------------------ *
   * Sheets
   * ------------------------------------------------------------------ */

  function renderSheet() {
    if (!ui.sheet) {
      els.sheetRoot.innerHTML = '';
      return;
    }
    var frame;
    if (ui.sheet.type === 'record') frame = buildRecordSheet();
    else if (ui.sheet.type === 'picker') frame = buildPickerSheet();
    else if (ui.sheet.type === 'finish') frame = buildFinishSheet();
    else if (ui.sheet.type === 'data') frame = buildDataSheet();
    else if (ui.sheet.type === 'exerciseForm') frame = buildExerciseFormSheet();
    else if (ui.sheet.type === 'exerciseDetail') frame = buildExerciseDetailSheet(ui.sheet.exerciseId);
    else if (ui.sheet.type === 'importPaste') frame = buildImportPasteSheet();
    else if (ui.sheet.type === 'textFallback') frame = buildTextFallbackSheet();
    else frame = sheetMarkup('提示', '', '<p class="empty-text">没有可显示的内容。</p>');

    els.sheetRoot.innerHTML =
      '<div class="sheet-scrim" data-act="closeSheet" aria-hidden="true"></div>' +
      frame;

    if (ui.focusSheet) {
      ui.focusSheet = false;
      requestAnimationFrame(function () {
        var sheet = $('#sheetRoot .sheet');
        if (sheet) sheet.focus({ preventScroll: true });
      });
    }
    if (ui.focusTarget) {
      var targetId = ui.focusTarget;
      ui.focusTarget = null;
      requestAnimationFrame(function () {
        var el = document.getElementById(targetId);
        if (!el) return;
        el.focus({ preventScroll: true });
        try { if (typeof el.select === 'function') el.select(); } catch (err) { /* noop */ }
        try { el.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (err) { /* noop */ }
      });
    }
  }

  function sheetMarkup(title, subtitle, body, foot) {
    return '<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">' +
      '<div class="sheet-grip" aria-hidden="true"></div>' +
      '<div class="sheet-head">' +
        '<div><h2 class="sheet-title" id="sheetTitle">' + esc(title) + '</h2>' +
          (subtitle ? '<p class="sheet-sub">' + subtitle + '</p>' : '') +
        '</div>' +
        '<button class="sheet-close" type="button" data-act="closeSheet" aria-label="关闭">×</button>' +
      '</div>' +
      '<div class="sheet-body">' + body + '</div>' +
      (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') +
    '</section>';
  }

  function buildRecordSheet() {
    var sheet = ui.sheet;
    var draft = sheet.draft;
    var ex = getExercise(draft.exerciseId);
    if (!ex) {
      return sheetMarkup('记录一组', '', '<p class="empty-text">动作不存在，请重新选择。</p>');
    }
    var metric = metricOf(ex);
    var editing = !!draft.editingId;
    var last = lastCompletedSet(ex.id, draft.editingId);
    var exSelector;
    if (editing) {
      exSelector = '<div class="ex-lock"><span>' + esc(ex.name) + '</span><span>编辑中不可更换动作</span></div>';
    } else {
      exSelector = '<button class="ex-select" type="button" data-act="openPicker" data-origin="record">' +
        '<span class="ex-select-main">' +
          '<span class="ex-select-name">' + esc(ex.name) + '</span>' +
          '<span class="ex-select-meta">' + esc(ex.muscle || '未分类') + ' · ' + esc(METRICS[metric]) + '</span>' +
        '</span>' +
        '<span class="ex-select-change">更换 <span class="chev" aria-hidden="true">›</span></span>' +
      '</button>';
    }

    var fields = '';

    if (metric === 'weight_reps') {
      var lastWeightText = last
        ? (Number(last.weight) > 0 ? '上次 ' + formatWeight(last.weight) + ' kg' : '上次自重')
        : '单位 kg';
      fields += '<div class="field">' +
        '<div class="field-head"><span class="field-label">重量</span><span class="field-current">' + esc(lastWeightText) + '</span></div>' +
        '<div class="value-row">' +
          (draft.customWeight
            ? '<div class="custom-inline"><input class="num-input" id="weightInput" type="number" inputmode="decimal" enterkeyhint="done" autocomplete="off" step="0.5" min="0" max="2000" value="' + escapeAttr(draft.weightInput != null ? draft.weightInput : draft.weight) + '" aria-label="自定义重量"><span class="input-unit">kg</span></div>'
            : '<div class="big-value">' + esc(formatWeight(draft.weight)) + '<span class="big-unit">kg</span></div>') +
          '<button class="text-btn" type="button" data-act="toggleWeightCustom">' + (draft.customWeight ? '收起' : '自定义') + '</button>' +
        '</div>' +
        (draft.customWeight ? '<p class="custom-hint">可以输入小数，例如 62.5。快捷步进会自动收起键盘输入。</p>' : '') +
        '<div class="step-grid">' +
          '<button class="step-btn" type="button" data-act="weightStep" data-delta="-5">−5</button>' +
          '<button class="step-btn" type="button" data-act="weightStep" data-delta="-2.5">−2.5</button>' +
          '<button class="step-btn" type="button" data-act="weightStep" data-delta="2.5">+2.5</button>' +
          '<button class="step-btn" type="button" data-act="weightStep" data-delta="5">+5</button>' +
        '</div>' +
      '</div>';
    }

    if (metric === 'weight_reps' || metric === 'reps') {
      var repsOptions = [6, 8, 10, 12, 15];
      fields += '<div class="field">' +
        '<div class="field-head">' +
          '<div><span class="field-label">次数</span><span class="field-current">当前 ' + formatReps(draft.reps) + ' 次</span></div>' +
          '<button class="text-btn" type="button" data-act="toggleRepsCustom">' + (draft.customReps ? '收起' : '自定义') + '</button>' +
        '</div>' +
        '<div class="quick-grid cols-5">' +
          repsOptions.map(function (n) {
            return '<button class="quick-btn" type="button" data-act="repsPick" data-value="' + n + '" aria-pressed="' + (Number(draft.reps) === n ? 'true' : 'false') + '">' + n + '</button>';
          }).join('') +
        '</div>' +
        (draft.customReps
          ? '<div class="custom-inline"><input class="num-input" id="repsInput" type="number" inputmode="numeric" enterkeyhint="done" autocomplete="off" step="1" min="1" max="9999" value="' + escapeAttr(draft.repsInput != null ? draft.repsInput : draft.reps) + '" aria-label="自定义次数"><span class="input-unit">次</span></div>'
          : '') +
        (last && last.reps ? '<p class="input-hint">上次 ' + formatReps(last.reps) + ' 次</p>' : '') +
      '</div>';
    }

    if (metric === 'duration') {
      var durationOptions = [
        { value: 30, label: '30 秒' },
        { value: 60, label: '1 分' },
        { value: 120, label: '2 分' },
        { value: 300, label: '5 分' }
      ];
      fields += '<div class="field">' +
        '<div class="field-head"><span class="field-label">时长</span><span class="field-current">' +
          (last && last.durationSec ? '上次 ' + fmtClockSec(last.durationSec) : '按秒记录') +
        '</span></div>' +
        '<div class="value-row">' +
          (draft.customDuration
            ? '<div class="custom-inline"><input class="num-input" id="durationInput" type="number" inputmode="numeric" enterkeyhint="done" autocomplete="off" step="1" min="1" max="604800" value="' + escapeAttr(draft.durationInput != null ? draft.durationInput : draft.durationSec) + '" aria-label="自定义时长，单位秒"><span class="input-unit">秒</span></div>'
            : '<div class="big-value">' + esc(fmtClockSec(draft.durationSec)) + '<span class="big-unit">分 : 秒</span></div>') +
          '<button class="text-btn" type="button" data-act="toggleDurationCustom">' + (draft.customDuration ? '收起' : '自定义') + '</button>' +
        '</div>' +
        (draft.customDuration ? '<p class="custom-hint">输入秒数，例如 90 = 1 分 30 秒。</p>' : '') +
        '<div class="quick-grid cols-4">' +
          durationOptions.map(function (option) {
            return '<button class="quick-btn" type="button" data-act="durationPick" data-value="' + option.value + '" aria-pressed="' + (Number(draft.durationSec) === option.value ? 'true' : 'false') + '">' + option.label + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    var rpeValues = [5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];
    var rpeQuick = '<button class="rpe-btn small-label" type="button" data-act="rpePick" data-value="none" aria-pressed="' +
      (draft.rpe == null && !draft.customRpe ? 'true' : 'false') + '">无</button>';
    rpeQuick += rpeValues.map(function (value) {
      return '<button class="rpe-btn" type="button" data-act="rpePick" data-value="' + value + '" aria-pressed="' +
        (!draft.customRpe && Number(draft.rpe) === value ? 'true' : 'false') + '">' + formatRpe(value) + '</button>';
    }).join('');
    rpeQuick += '<button class="rpe-btn small-label" type="button" data-act="toggleRpeCustom" aria-pressed="' +
      (draft.customRpe ? 'true' : 'false') + '">自定义</button>';

    fields += '<div class="field">' +
      '<div class="field-head"><span class="field-label">RPE（可选）</span><span class="field-current">' +
        (draft.rpe != null ? 'RPE ' + formatRpe(draft.rpe) : '不记录') +
      '</span></div>' +
      '<div class="rpe-grid">' + rpeQuick + '</div>' +
      (draft.customRpe
        ? '<div class="custom-inline"><input class="num-input" id="rpeInput" type="number" inputmode="decimal" enterkeyhint="done" autocomplete="off" step="0.5" min="1" max="10" value="' + escapeAttr(draft.rpeInput != null ? draft.rpeInput : (draft.rpe != null ? formatRpe(draft.rpe) : '')) + '" aria-label="自定义 RPE，范围 1 到 10"><span class="input-unit">1–10</span></div>'
        : '') +
    '</div>';

    if (editing) {
      fields += '<label class="check-row"><input type="checkbox" id="setCompleted"' + (draft.completed ? ' checked' : '') + '>' +
        '<span>这一组已完成，计入统计</span></label>';

      : '') +
      '<button class="btn btn-primary btn-lg" type="button" data-act="saveSet">' +
        (editing ? '保存修改' : '完成一组') +

    return sheetMarkup(
      editing ? '编辑记录' : '记录一组',
      editing ? '修改这一组的数值和完成状态' : '完成一组后自动开始组间休息',
      exSelector + fields,

  function buildPickerSheet() {
    var session = activeSession();
    var filtered = searchExercises(ui.pickerQuery);
    var list = pickerRowsHtml(filtered);
    var body =
      '<div class="search-wrap"><input class="search-input" id="pickerSearch" type="search" placeholder="搜索名称或肌群" autocomplete="off" value="' + escapeAttr(ui.pickerQuery) + '" aria-label="搜索动作"></div>' +
      '<div class="picker-list" id="pickerList">' + list + '</div>' +
      '<p class="input-hint">' + (session
        ? '动作库和自定义动作都在这里，常用动作排在前面。选择后立即切换当前动作。'
        : '选择动作后会直接开始一次训练。') + '</p>';
    var foot = '<button class="btn btn-outline" type="button" data-act="addExerciseFromPicker">新建动作</button>';
    return sheetMarkup(
      '选择动作',
      session ? (ensureCurrentExercise() ? '当前：' + esc(ensureCurrentExercise().name) : '选择一个动作') : '选择后开始训练',
      body,
      foot
    );
  }

  function searchExercises(query) {
    var q = String(query || '').trim().toLowerCase();
    var all = activeExercises();
    if (!q) return all;
    return all.filter(function (ex) {
      return String(ex.name).toLowerCase().indexOf(q) !== -1 ||
        String(ex.muscle || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  function pickerRowsHtml(list) {
    if (!list.length) {
      return '<div class="list-empty">没有匹配的动作。可以清空搜索，或新建一个动作。</div>';
    }
    return list.map(function (ex) {
      var last = lastCompletedSet(ex.id);
      var selected = ex.id === ui.currentExerciseId;
      var lastText = last ? '<span class="picker-last">' + esc(setCompactText(last, ex)) + '</span>' : '';
      var metaBits = '<span>' + esc(ex.muscle || '未分类') + ' · ' + esc(METRICS[metricOf(ex)]) + '</span>';
      if (last && last.createdAt) metaBits += '<span>' + esc(fmtDayShort(last.createdAt)) + '</span>';
      return '<button class="picker-row' + (selected ? ' is-selected' : '') + '" type="button" data-act="chooseExercise" data-id="' + escapeAttr(ex.id) + '">' +
        '<span class="picker-row-top">' +
          '<span class="picker-name">' + esc(ex.name) + '</span>' +
          (ex.favorite ? '<span class="mini-badge accent">常用</span>' : '') +
          lastText +
        '</span>' +
        '<span class="picker-meta">' + metaBits + '</span>' +
      '</button>';
    }).join('');
  }

  function buildFinishSheet() {
    var session = activeSession();
    if (!session) {
      return sheetMarkup('结束训练', '', '<p class="empty-text">没有进行中的训练。</p>');
    }
    var summary = summaryForSession(session);
    var elapsed = Math.max(0, (ui.finishEndAt || Date.now()) - session.startedAt);
    var body =
      '<div class="summary-grid">' +
        '<div class="summary-cell"><div class="summary-value">' + esc(fmtDurationHuman(elapsed)) + '</div><div class="summary-label">总时长</div></div>' +
        '<div class="summary-cell"><div class="summary-value">' + summary.setCount + '</div><div class="summary-label">组数</div></div>' +
        '<div class="summary-cell"><div class="summary-value">' + summary.exerciseCount + '</div><div class="summary-label">动作数</div></div>' +
        '<div class="summary-cell"><div class="summary-value">' + formatVolume(summary.volume) + '<span class="unit">kg</span></div><div class="summary-label">总容量</div></div>' +
      '</div>' +
      (summary.setCount === 0 ? '<p class="warning-line">还没有记录任何组。仍然可以结束并保存这次训练。</p>' : '') +
      '<div class="note-field">' +
        '<label class="note-label" for="finishNote">训练备注（可选）</label>' +
        '<textarea class="finish-note" id="finishNote" maxlength="500" placeholder="今天状态、动作感受、下次要调整的地方…">' + esc(session.note || '') + '</textarea>' +
      '</div>' +
      '<div class="danger-zone">' +
        '<button class="text-danger" type="button" data-act="discardSession">放弃本次训练</button>' +
      '</div>';
    var foot = '<button class="btn btn-primary btn-lg" type="button" data-act="saveFinish">结束并保存</button>';
    return sheetMarkup(
      '结束训练',
      esc(fmtDay(session.startedAt)) + ' · ' + esc(fmtTime(session.startedAt)) + ' 开始',
      body,
      foot
    );
  }

  function buildDataSheet() {
    var counts = {
      finished: finishedSessions().length,
      active: activeSession() ? 1 : 0,
      sets: state.sets.length,
      exercises: activeExercises().length
    };
    var persist = state.persisted === true
      ? { dot: 'ok', text: '浏览器已授予持久存储，数据相对不容易被清理。' }
      : state.persisted === false
        ? { dot: 'warn', text: '浏览器尚未授予持久存储。仍然建议定期导出 JSON 备份。' }
        : { dot: '', text: '无法确认持久存储状态。请定期导出 JSON 备份。' };
    var notify = notificationStatus();
    var restOptions = [45, 60, 90, 120, 180];
    var restButtons = restOptions.map(function (sec) {
      return '<button class="choice-btn" type="button" data-act="setRestDefault" data-sec="' + sec + '" aria-pressed="' +
        (Number(state.settings.restSec) === sec ? 'true' : 'false') + '">' + sec + ' 秒</button>';
    }).join('');

    var notifyBlock = '<div class="status-line"><span class="status-dot ' + notify.dot + '"></span><span>' + esc(notify.text) + '</span></div>';
    if (notify.canAsk) {
      notifyBlock += '<div class="data-actions"><button class="btn btn-outline" type="button" data-act="requestNotify">开启系统提醒</button></div>';
    }
    notifyBlock += '<p class="data-desc">倒计时结束时，页面会播放提示音并尝试震动。系统通知受浏览器支持情况限制；iOS 通常需要把页面添加到主屏幕。</p>';

    var body =
      '<section class="data-section">' +
        '<h3 class="data-title">本机存储</h3>' +
        '<p class="data-desc">IndexedDB · ' + counts.finished + ' 次已完成训练' +
          (counts.active ? ' · 1 次进行中' : '') + ' · ' + counts.sets + ' 组记录 · ' + counts.exercises + ' 个动作</p>' +
        '<div class="status-line"><span class="status-dot ' + persist.dot + '"></span><span>' + esc(persist.text) + '</span></div>' +
      '</section>' +
      '<section class="data-section">' +
        '<h3 class="data-title">备份与恢复</h3>' +
        '<p class="data-desc">数据只保存在当前浏览器里。换设备、清理浏览器或移动这个文件之前，请先导出 JSON 备份。</p>' +
        '<div class="data-actions">' +
          '<button class="btn btn-primary" type="button" data-act="exportData">导出数据</button>' +
          '<button class="btn btn-outline" type="button" data-act="copyData">复制 JSON</button>' +
          '<button class="btn btn-outline" type="button" data-act="importFile">导入文件</button>' +
          '<button class="btn btn-outline" type="button" data-act="openImportPaste">粘贴导入</button>' +
        '</div>' +
        '<p class="data-desc">导入会替换当前全部数据。导出内容包含动作库、会话、每一组记录和设置。</p>' +
      '</section>' +
      '<section class="data-section">' +
        '<h3 class="data-title">休息结束提醒</h3>' +
        notifyBlock +
      '</section>' +
      '<section class="data-section">' +
        '<h3 class="data-title">默认休息时长</h3>' +
        '<p class="data-desc">完成一组后的倒计时时长，可在休息条上继续加减。</p>' +
        '<div class="choice-grid">' + restButtons + '</div>' +
        '<div class="custom-rest">' +
          '<input id="restCustomInput" type="number" inputmode="numeric" min="15" max="900" step="15" value="' + Number(state.settings.restSec) + '" aria-label="自定义默认休息秒数">' +
          '<span class="unit">秒</span>' +
          '<button class="btn btn-outline" type="button" data-act="saveRestCustom">设置</button>' +
        '</div>' +
      '</section>';
    return sheetMarkup('数据与设置', '备份、导入和计时偏好', body);
  }

  function notificationStatus() {
    if (typeof window.Notification !== 'function') {
      return {
        canAsk: false,
        dot: 'off',
        text: '当前浏览器不支持系统通知。倒计时结束时仍会播放提示音，并在支持时震动。'
      };
    }
    if (Notification.permission === 'granted') {
      return {
        canAsk: false,
        dot: 'ok',
        text: '系统通知已开启，切到后台时也会收到休息结束提醒。'
      };
    }
    if (Notification.permission === 'denied') {
      return {
        canAsk: false,
        dot: 'off',
        text: '通知权限已被浏览器拒绝。可以在浏览器的站点设置中重新允许。'
      };
    }
    return {
      canAsk: true,
      dot: 'warn',
      text: '系统通知尚未开启。开启后，切到后台或锁屏时也能收到休息结束提醒。'
    };
  }

  function buildExerciseFormSheet() {
    var sheet = ui.sheet;
    var form = sheet.form;
    var editing = !!sheet.editId;
    var ex = editing ? getExercise(sheet.editId) : null;
    if (editing && !ex) {
      return sheetMarkup('编辑动作', '', '<p class="empty-text">这个动作不存在。</p>');
    }
    var locked = !!sheet.formLocked;
    var metricButtons = ['weight_reps', 'reps', 'duration'].map(function (metric) {
      return '<button class="metric-btn" type="button" data-act="setExerciseMetric" data-metric="' + metric + '" aria-pressed="' +
        (form.metric === metric ? 'true' : 'false') + '"' + (locked ? ' disabled' : '') + '>' + METRICS[metric] + '</button>';
    }).join('');

    var body =
      '<div class="form-field">' +
        '<label class="form-label" for="exName">名称</label>' +
        '<input class="form-input" id="exName" type="text" maxlength="40" autocomplete="off" placeholder="例如：保加利亚分腿蹲" value="' + escapeAttr(form.name) + '">' +
      '</div>' +
      '<div class="form-field">' +
        '<label class="form-label" for="exMuscle">目标肌群</label>' +
        '<input class="form-input" id="exMuscle" type="text" maxlength="30" autocomplete="off" placeholder="例如：腿 / 臀" value="' + escapeAttr(form.muscle) + '">' +
        '<p class="form-hint">留空会记为「未分类」。搜索时也会匹配这里的内容。</p>' +
      '</div>' +
      '<div class="form-field">' +
        '<span class="form-label">计量方式</span>' +
        '<div class="metric-grid" role="group" aria-label="计量方式">' + metricButtons + '</div>' +
        (locked ? '<p class="form-hint">这个动作已经有组记录，不能修改计量方式，以免历史数据被错误解读。</p>' : '<p class="form-hint">重量×次数用于负重动作；次数用于引体向上等自重动作；时长用于跑步、平板支撑。</p>') +
      '</div>' +
      '<div class="form-field">' +
        '<label class="check-row"><input id="exFavorite" type="checkbox"' + (form.favorite ? ' checked' : '') + '><span>加入常用动作，排在记录界面最前面</span></label>' +
      '</div>' +
      (editing && ex && !ex.builtin
        ? '<div class="exercise-form-remove"><button class="text-danger" type="button" data-act="removeExercise" data-id="' + escapeAttr(ex.id) + '">从动作库移除</button></div>'
        : '') +
      (editing && ex && ex.builtin ? '<p class="form-hint">预置动作只能调整常用状态，不能修改名称和计量方式。</p>' : '');

    var foot = '<button class="btn btn-primary btn-lg" type="button" data-act="saveExercise">' +
      (editing ? '保存修改' : '保存动作') + '</button>';

    return sheetMarkup(
      editing ? '编辑动作' : '添加动作',
      editing ? esc(ex.name) : '自定义动作会加入同一个动作库',
      body,
      foot
    );
  }

  function buildExerciseDetailSheet(exerciseId) {
    var ex = getExercise(exerciseId);
    if (!ex) {
      return sheetMarkup('动作详情', '', '<p class="empty-text">动作不存在。</p>');
    }
    var records = recordsForExercise(ex.id);
    var completedSets = state.sets
      .filter(function (set) { return set.exerciseId === ex.id && set.completed; })
      .sort(function (a, b) { return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0); });
    var shown = completedSets.slice(0, 80);
    var cells = prValuesFor(ex, records);
    var gridClass = cells.length === 3 ? 'summary-grid three' : 'summary-grid';
    var statsHtml = '<div class="' + gridClass + '">' + cells.map(function (cell) {
      return '<div class="summary-cell"><div class="summary-value">' + esc(cell.value) +
        (cell.unit ? '<span class="unit">' + esc(cell.unit) + '</span>' : '') +
        '</div><div class="summary-label">' + esc(cell.label) + '</div></div>';
    }).join('') + '</div>';

    var historyRows = shown.length
      ? shown.map(function (set) {
          var when = Number(set.createdAt) || 0;
          return '<div class="set-history-row">' +
            '<span class="set-history-date">' + (when ? esc(fmtDayShort(when)) + ' ' + esc(fmtTime(when)) : '—') + '</span>' +
            '<span class="set-history-val">' + esc(setCompactText(set, ex)) + '</span>' +
            '<span class="set-history-rpe">' + (set.rpe != null ? 'RPE ' + formatRpe(set.rpe) : '') + '</span>' +
          '</div>';
        }).join('')
      : '<p class="empty-text" style="padding:14px 0">还没有已完成的组记录。</p>';

    var meta = esc(ex.muscle || '未分类') + ' · ' + esc(METRICS[metricOf(ex)]) +
      ' · ' + records.completed + ' 组已完成' +
      (ex.archived ? ' · 已从动作库移除' : '');

    var body = '<p class="data-desc">' + meta + '</p>' +
      statsHtml +
      '<div class="set-history">' + historyRows + '</div>' +
      (completedSets.length > shown.length
        ? '<p class="input-hint">仅显示最近 80 组已完成记录，共 ' + completedSets.length + ' 组。所有纪录仍按全部组计算。</p>'
        : '');

    return sheetMarkup('动作详情', esc(ex.name), body);
  }

      '<textarea class="paste-textarea" id="pasteJson" spellcheck="false" placeholder="在这里粘贴 JSON…" aria-label="粘贴 JSON 内容"></textarea>';
    var foot = '<button class="btn btn-outline" type="button" data-act="closeSheet">取消</button>' +
      '<button class="btn btn-primary" type="button" data-act="validatePasteImport">校验并导入</button>';
    return sheetMarkup('粘贴导入', '只接受本应用导出的 JSON', body, foot);

  function refreshSheetKeepScroll() {
    var body = $('#sheetRoot .sheet-body');
    var scrollTop = body ? body.scrollTop : 0;
    renderSheet();
    requestAnimationFrame(function () {

      if (next) next.scrollTop = scrollTop;

  function renderDialog() {
    if (!ui.dialog) {
      els.dialogRoot.innerHTML = '';
      return;
    }
    var dialog = ui.dialog;
    els.dialogRoot.innerHTML =
      '<div class="dialog-scrim" data-act="closeDialog" aria-hidden="true"></div>' +
      '<div class="dialog-layer">' +
        '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage" tabindex="-1">' +
          '<h2 class="dialog-title" id="dialogTitle">' + esc(dialog.title) + '</h2>' +
          '<p class="dialog-message" id="dialogMessage">' + esc(dialog.message) + '</p>' +
          '<div class="dialog-actions">' +
            '<button class="btn btn-outline" id="dialogCancel" type="button" data-act="closeDialog">' + esc(dialog.cancelLabel || '取消') + '</button>' +
            '<button class="btn ' + (dialog.danger ? 'btn-danger' : 'btn-primary') + '" type="button" data-act="confirmDialog">' + esc(dialog.confirmLabel || '确认') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    if (!ui.dialogFocusShown && dialog) {
      ui.dialogFocusShown = true;
      requestAnimationFrame(function () {
        var cancel = document.getElementById('dialogCancel');
        if (cancel) cancel.focus({ preventScroll: true });
      });
    }
  }

  function showDialog(options) {
    ui.dialog = {
      title: options.title || '确认',
      message: options.message || '',
      confirmLabel: options.confirmLabel || '确认',
      cancelLabel: options.cancelLabel || '取消',
      danger: !!options.danger,
      onConfirm: options.onConfirm || null
    };
    ui.dialogBusy = false;
    ui.dialogFocusShown = false;
    renderDialog();
    syncLayers();
  }

  function closeDialog(force) {
    if (!ui.dialog) return;
    if (ui.dialogBusy && !force) return;
    ui.dialog = null;
    ui.dialogBusy = false;
    ui.dialogFocusShown = false;
    renderDialog();
    syncLayers();
    focusTopOverlay();
  }

  function confirmDialogAction() {
    if (!ui.dialog || ui.dialogBusy) return;
    var dialog = ui.dialog;
    ui.dialogBusy = true;
    var button = $('[data-act="confirmDialog"]');
    if (button) button.disabled = true;
    Promise.resolve(dialog.onConfirm ? dialog.onConfirm() : null).then(function () {
      ui.dialogBusy = false;
      closeDialog(true);
    }).catch(function (err) {
      ui.dialogBusy = false;
      if (button) button.disabled = false;
      console.error(err);
      toast(err && err.message ? '操作失败：' + err.message : '操作失败，请重试');
    });
  }

  /* ------------------------------------------------------------------ *
   * Toast
   * ------------------------------------------------------------------ */

  function toast(message, options) {
    options = options || {};
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    toastAction = typeof options.onAction === 'function' ? options.onAction : null;
    var actionLabel = options.actionLabel || (toastAction ? '撤销' : '');
    els.toastRoot.innerHTML = '<div class="toast">' +
      '<span class="toast-message">' + esc(message) + '</span>' +
      (toastAction ? '<button class="toast-action" type="button" data-act="toastAction">' + esc(actionLabel) + '</button>' : '') +
    '</div>';
    var duration = Number(options.duration) || (toastAction ? 6000 : 3000);
    toastTimer = setTimeout(function () {
      els.toastRoot.innerHTML = '';
      toastAction = null;
      toastTimer = null;
    }, duration);
  }

  function runToastAction() {
    var action = toastAction;
    toastAction = null;
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    els.toastRoot.innerHTML = '';
    if (action) {
      Promise.resolve(action()).catch(function (err) {
        console.error(err);
        toast('撤销失败：' + (err && err.message ? err.message : '未知错误'));
      });
    }
  }

  /* ------------------------------------------------------------------ *
   * Sheet open / close helpers
   * ------------------------------------------------------------------ */

  function focusView() {
    requestAnimationFrame(function () {
      try { els.view.focus({ preventScroll: true }); } catch (err) { /* noop */ }
    });
  }

  function focusTopOverlay() {
    requestAnimationFrame(function () {
      if (ui.dialog) {
        var cancel = document.getElementById('dialogCancel');
        if (cancel) cancel.focus({ preventScroll: true });
        return;
      }
      if (ui.sheet) {
        var sheet = $('#sheetRoot .sheet');
        if (sheet) sheet.focus({ preventScroll: true });
        return;
      }
      try { els.view.focus({ preventScroll: true }); } catch (err) { /* noop */ }
    });
  }

  function closeSheet() {
    if (!ui.sheet) return;
    var current = ui.sheet;
    if (current.type === 'finish') ui.finishEndAt = null;
    if (current.type === 'picker' && current.returnSheet) {
      ui.sheet = current.returnSheet;
      ui.focusSheet = true;
      renderAll();
      return;
    }
    ui.sheet = null;
    ui.focusSheet = false;
    ui.focusTarget = null;
    renderAll();
    focusView();
  }

  function openSheet(sheet) {
    ui.sheet = sheet;
    ui.focusSheet = true;
    ui.focusTarget = null;
    renderAll();
  }

  /* ------------------------------------------------------------------ *
   * Training flow
   * ------------------------------------------------------------------ */

  function startSession(exerciseId) {
    if (ui.starting) return Promise.resolve();
    if (activeSession()) {
      ui.tab = 'train';
      renderAll();
      toast('已有一场进行中的训练');
      return Promise.resolve();
    }
    var actives = activeExercises();
    if (!actives.length) {
      ui.tab = 'exercises';
      renderAll();
      window.scrollTo(0, 0);
      toast('先添加一个动作');
      return Promise.resolve();
    }
    var chosen = null;
    if (exerciseId) {
      var requested = getExercise(exerciseId);
      if (requested && !requested.archived) chosen = requested;
    }
    if (!chosen) {
      var current = ui.currentExerciseId ? getExercise(ui.currentExerciseId) : null;
      if (current && !current.archived) chosen = current;
    }
    if (!chosen) {
      var lastId = lastUsedExerciseId();
      chosen = lastId ? getExercise(lastId) : null;
    }
    if (!chosen) chosen = actives[0];

    ui.starting = true;
    var now = Date.now();
    var session = {
      id: uid('session'),
      date: dateKey(now),
      startedAt: now,
      endedAt: null,
      durationSec: null,
      note: ''
    };
    return dbPut('sessions', session).then(function () {
      state.sessions.push(session);
      ui.currentExerciseId = chosen.id;
      ui.sheet = null;
      ui.dialog = null;
      ui.finishEndAt = null;
      ui.tab = 'train';
      rest = null;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'auto' });
      toast('训练已开始');
      metaSet('ui', { currentExerciseId: chosen.id }).catch(function () { /* non-critical */ });
      metaSet('rest', null).catch(function () { /* non-critical */ });
    }).catch(function (err) {
      console.error(err);
      toast('无法开始训练：' + (err && err.message ? err.message : '未知错误'));
    }).finally(function () {
      ui.starting = false;
    });
  }

  function openRecordForCurrent() {
    var session = activeSession();
    if (!session) {
      toast('先开始训练');
      return;
    }
    var ex = ensureCurrentExercise();
    if (!ex) {
      toast('先添加一个动作');
      ui.tab = 'exercises';
      ui.sheet = null;
      renderAll();
      return;
    }
    ui.currentExerciseId = ex.id;
    rememberCurrentExercise();
    openSheet({ type: 'record', draft: makeDraft(ex, null) });
  }

  function openRecordForSet(setId) {
    var session = activeSession();
    if (!session) return;
    var set = state.sets.find(function (item) { return item.id === setId; });
    if (!set || set.sessionId !== session.id) {
      toast('这条记录属于已结束的训练，无法编辑');
      return;
    }
    var ex = getExercise(set.exerciseId);
    if (!ex) {
      toast('这条记录关联的动作不存在');
      return;
    }
    ui.currentExerciseId = ex.id;
    rememberCurrentExercise();
    openSheet({ type: 'record', draft: makeDraft(ex, set) });
  }

  function makeDraft(ex, existingSet) {
    var last = lastCompletedSet(ex.id, existingSet ? existingSet.id : null);
    var weight;
    var reps;
    var duration;
    if (existingSet) {
      weight = existingSet.weight != null ? Number(existingSet.weight) : 0;
      reps = existingSet.reps != null ? Number(existingSet.reps) : 8;
      duration = existingSet.durationSec != null ? Number(existingSet.durationSec) : 60;
    } else {
      weight = last && last.weight != null ? Number(last.weight) : 20;
      reps = last && last.reps != null && Number(last.reps) > 0 ? Number(last.reps) : 8;
      duration = last && last.durationSec != null && Number(last.durationSec) > 0 ? Number(last.durationSec) : 60;
    }
    if (!Number.isFinite(weight)) weight = 0;
    if (!Number.isFinite(reps) || reps < 1) reps = 8;
    if (!Number.isFinite(duration) || duration < 1) duration = 60;
    var rpe = existingSet && existingSet.rpe != null ? Number(existingSet.rpe) : null;
    return {
      exerciseId: ex.id,
      editingId: existingSet ? existingSet.id : null,
      weight: weight,
      weightInput: String(weight),
      reps: reps,
      repsInput: String(reps),
      durationSec: duration,
      durationInput: String(duration),
      rpe: rpe,
      rpeInput: rpe != null ? formatRpe(rpe) : '',
      completed: existingSet ? !!existingSet.completed : true,
      customWeight: false,
      customReps: false,
      customDuration: false,
      customRpe: false
    };
  }

  function syncRecordInputs() {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    var draft = ui.sheet.draft;
    var weightInput = document.getElementById('weightInput');
    if (weightInput) draft.weightInput = weightInput.value;
    var repsInput = document.getElementById('repsInput');
    if (repsInput) draft.repsInput = repsInput.value;
    var durationInput = document.getElementById('durationInput');
    if (durationInput) draft.durationInput = durationInput.value;
    var rpeInput = document.getElementById('rpeInput');
    if (rpeInput) draft.rpeInput = rpeInput.value;
  }

  function toggleRecordCustom(kind) {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    syncRecordInputs();
    var draft = ui.sheet.draft;
    if (kind === 'weight') {
      if (draft.customWeight) {
        var parsed = parseFloat(draft.weightInput);
        if (Number.isFinite(parsed)) draft.weight = clamp(parsed, 0, 2000);
        draft.weightInput = String(draft.weight);
        draft.customWeight = false;
      } else {
        draft.customWeight = true;
        draft.weightInput = String(draft.weight);
        ui.focusTarget = 'weightInput';
      }
    } else if (kind === 'reps') {
      if (draft.customReps) {
        var parsedReps = parseInt(draft.repsInput, 10);
        if (Number.isFinite(parsedReps) && parsedReps > 0) draft.reps = clamp(parsedReps, 1, 9999);
        draft.repsInput = String(draft.reps);
        draft.customReps = false;
      } else {
        draft.customReps = true;
        draft.repsInput = String(draft.reps);
        ui.focusTarget = 'repsInput';
      }
    } else if (kind === 'duration') {
      if (draft.customDuration) {
        var parsedDuration = parseInt(draft.durationInput, 10);
        if (Number.isFinite(parsedDuration) && parsedDuration > 0) draft.durationSec = clamp(parsedDuration, 1, 604800);
        draft.durationInput = String(draft.durationSec);
        draft.customDuration = false;
      } else {
        draft.customDuration = true;
        draft.durationInput = String(draft.durationSec);
        ui.focusTarget = 'durationInput';
      }
    } else if (kind === 'rpe') {
      if (draft.customRpe) {
        var parsedRpe = parseFloat(draft.rpeInput);
        if (Number.isFinite(parsedRpe) && parsedRpe >= 1 && parsedRpe <= 10) {
          draft.rpe = Math.round(parsedRpe * 2) / 2;
        }
        draft.rpeInput = draft.rpe != null ? formatRpe(draft.rpe) : '';
        draft.customRpe = false;
      } else {
        draft.customRpe = true;
        draft.rpeInput = draft.rpe != null ? formatRpe(draft.rpe) : '';
        ui.focusTarget = 'rpeInput';
      }
    }
    renderSheet();
  }

  function stepWeight(delta) {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    syncRecordInputs();
    var draft = ui.sheet.draft;
    var base = parseFloat(draft.weightInput);
    if (!Number.isFinite(base)) base = Number(draft.weight) || 0;
    var next = Math.round((base + delta) * 10) / 10;
    draft.weight = clamp(next, 0, 2000);
    draft.weightInput = String(draft.weight);
    draft.customWeight = false;
    renderSheet();
  }

  function pickReps(value) {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    syncRecordInputs();
    var draft = ui.sheet.draft;
    if (Number.isFinite(value) && value > 0) {
      draft.reps = clamp(Math.round(value), 1, 9999);
      draft.repsInput = String(draft.reps);
      draft.customReps = false;
      renderSheet();
    }
  }

  function pickDuration(value) {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    syncRecordInputs();
    var draft = ui.sheet.draft;
    if (Number.isFinite(value) && value > 0) {
      draft.durationSec = clamp(Math.round(value), 1, 604800);
      draft.durationInput = String(draft.durationSec);
      draft.customDuration = false;
      renderSheet();
    }
  }

  function pickRpe(value) {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    syncRecordInputs();
    var draft = ui.sheet.draft;
    if (value === 'none') {
      draft.rpe = null;
      draft.rpeInput = '';
      draft.customRpe = false;
    } else {
      var num = Number(value);
      if (Number.isFinite(num) && num >= 1 && num <= 10) {
        draft.rpe = Math.round(num * 2) / 2;
        draft.rpeInput = formatRpe(draft.rpe);
        draft.customRpe = false;
      }
    }
    renderSheet();
  }

  function saveDraftSet() {
    if (ui.savingSet) return;
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    var sheet = ui.sheet;
    var draft = sheet.draft;
    syncRecordInputs();
    var session = activeSession();
    if (!session) {
      toast('训练已经结束，无法保存');
      return;
    }
    var ex = getExercise(draft.exerciseId);
    if (!ex || ex.archived) {
      toast('当前动作不可用');
      return;
    }
    var metric = metricOf(ex);
    var weight = null;
    var reps = null;
    var duration = null;

    if (metric === 'weight_reps') {
      var weightValue = parseFloat(draft.customWeight ? draft.weightInput : draft.weight);
      if (!Number.isFinite(weightValue) || weightValue < 0 || weightValue > 2000) {
        toast('请输入 0–2000 kg 之间的有效重量');
        if (draft.customWeight) ui.focusTarget = 'weightInput';
        renderSheet();
        return;
      }
      weight = Math.round(weightValue * 100) / 100;
    }

    if (metric === 'weight_reps' || metric === 'reps') {
      var repsValue = parseInt(draft.customReps ? draft.repsInput : draft.reps, 10);
      if (!Number.isFinite(repsValue) || repsValue < 1 || repsValue > 9999) {
        toast('请输入 1–9999 之间的次数');
        if (draft.customReps) ui.focusTarget = 'repsInput';
        renderSheet();
        return;
      }
      reps = repsValue;
    }

    if (metric === 'duration') {
      var durationValue = parseInt(draft.customDuration ? draft.durationInput : draft.durationSec, 10);
      if (!Number.isFinite(durationValue) || durationValue < 1 || durationValue > 604800) {
        toast('请输入有效的秒数');
        if (draft.customDuration) ui.focusTarget = 'durationInput';
        renderSheet();
        return;
      }
      duration = durationValue;
    }

    var rpe = null;
    var rawRpe = draft.customRpe ? draft.rpeInput : draft.rpe;
    if (rawRpe != null && String(rawRpe).trim() !== '') {
      var rpeValue = parseFloat(rawRpe);
      if (!Number.isFinite(rpeValue) || rpeValue < 1 || rpeValue > 10) {
        toast('RPE 需要在 1 到 10 之间');
        if (draft.customRpe) ui.focusTarget = 'rpeInput';
        renderSheet();
        return;
      }
      rpe = Math.round(rpeValue * 2) / 2;
    }

    var completed = true;
    if (draft.editingId) {
      var checkbox = document.getElementById('setCompleted');
      completed = checkbox ? checkbox.checked : draft.completed;
    }
    var original = draft.editingId
      ? state.sets.find(function (set) { return set.id === draft.editingId; })
      : null;
    var record = {
      id: draft.editingId || uid('set'),
      sessionId: session.id,
      exerciseId: ex.id,
      weight: weight,
      reps: reps,
      durationSec: duration,
      rpe: rpe,
      completed: completed,
      createdAt: original ? original.createdAt : Date.now(),
      updatedAt: Date.now()
    };

    ui.savingSet = true;
    var isEditing = !!draft.editingId;
    dbPut('sets', record).then(function () {
      if (original) Object.assign(original, record);
      else state.sets.push(record);
      ui.currentExerciseId = ex.id;
      ui.sheet = null;
      ui.focusSheet = false;
      ui.focusTarget = null;
      if (!isEditing) beginRest(ex.id);
      renderAll();
      toast(isEditing
        ? '已保存修改：' + ex.name + ' ' + setCompactText(record, ex)
        : '已记录：' + ex.name + ' ' + setCompactText(record, ex) + ' · 休息 ' + state.settings.restSec + ' 秒');
      focusView();
    }).catch(function (err) {
      console.error(err);
      toast('保存失败：' + (err && err.message ? err.message : '请重试'));
    }).finally(function () {
      ui.savingSet = false;
    });
  }

  function toggleSet(setId) {
    var set = state.sets.find(function (item) { return item.id === setId; });
    if (!set) return;
    var next = !set.completed;
    set.completed = next;
    renderAll();
    dbPut('sets', set).catch(function (err) {
      console.error(err);
      set.completed = !next;
      renderAll();
      toast('状态保存失败，请重试');
    });
  }

  function deleteSetById(setId, fromSheet) {
    if (ui.deletingSet) return Promise.resolve();
    var set = state.sets.find(function (item) { return item.id === setId; });
    if (!set) return Promise.resolve();
    ui.deletingSet = true;
    return dbDelete('sets', setId).then(function () {
      state.sets = state.sets.filter(function (item) { return item.id !== setId; });
      if (fromSheet) {
        ui.sheet = null;
        ui.focusSheet = false;
      }
      renderAll();
      if (fromSheet) focusView();
      toast('已删除一组', {
        actionLabel: '撤销',
        duration: 6000,
        onAction: function () {
          return dbPut('sets', set).then(function () {
            state.sets.push(set);
            renderAll();
            toast('已恢复这一组');
          });
        }
      });
    }).catch(function (err) {
      console.error(err);
      toast('删除失败：' + (err && err.message ? err.message : '请重试'));
    }).finally(function () {
      ui.deletingSet = false;
    });
  }

  function deleteSetFromSheet() {
    if (!ui.sheet || ui.sheet.type !== 'record') return;
    var id = ui.sheet.draft.editingId;
    if (!id) return;
    deleteSetById(id, true);
  }

  function openFinishSheet() {
    if (!activeSession()) return;
    // Freeze the end time at the click on "结束"; the note sheet may stay open longer.
    ui.finishEndAt = Date.now();
    openSheet({ type: 'finish' });
  }

  function saveFinishedSession() {
    if (ui.savingFinish) return;
    var session = activeSession();
    if (!session) {
      ui.sheet = null;
      renderAll();
      return;
    }
    var noteEl = document.getElementById('finishNote');
    var note = sanitizeText(noteEl ? noteEl.value : '', 500);
    var previousEndedAt = session.endedAt;
    var previousDurationSec = session.durationSec;
    var previousNote = session.note;
    var endedAt = Math.max(ui.finishEndAt || Date.now(), session.startedAt);
    session.endedAt = endedAt;
    session.durationSec = Math.round((endedAt - session.startedAt) / 1000);
    session.note = note;
    ui.savingFinish = true;
    dbPut('sessions', session).then(function () {
      rest = null;
      persistRest();
      ui.sheet = null;
      ui.focusSheet = false;
      ui.finishEndAt = null;
      renderAll();
      toast('训练已保存 · ' + fmtDurationHuman(endedAt - session.startedAt));
      focusView();
    }).catch(function (err) {
      console.error(err);
      session.endedAt = previousEndedAt;
      session.durationSec = previousDurationSec;
      session.note = previousNote;
      toast('保存训练失败：' + (err && err.message ? err.message : '请重试'));
    }).finally(function () {
      ui.savingFinish = false;
    });
  }

  function promptDiscardSession() {
    var session = activeSession();
    if (!session) return;
    var count = setsForSession(session.id).length;
    showDialog({
      title: '放弃这次训练？',
      message: '这次训练' + (count ? '的 ' + count + ' 组记录' : '') + '会被删除，且无法恢复。',
      confirmLabel: '放弃训练',
      danger: true,
      onConfirm: function () {
        var ids = state.sets
          .filter(function (set) { return set.sessionId === session.id; })
          .map(function (set) { return set.id; });
        var ops = ids.map(function (id) { return { store: 'sets', type: 'delete', key: id }; });
        ops.push({ store: 'sessions', type: 'delete', key: session.id });
        return dbBatch(ops).then(function () {
          state.sets = state.sets.filter(function (set) { return set.sessionId !== session.id; });
          state.sessions = state.sessions.filter(function (s) { return s.id !== session.id; });
          rest = null;
          persistRest();
          ui.sheet = null;
          ui.focusSheet = false;
          ui.finishEndAt = null;
          renderAll();
          toast('已放弃本次训练');
          focusView();
        });
      }
    });
  }

  function toggleHistory(sessionId) {
    if (ui.historyExpanded.has(sessionId)) ui.historyExpanded.delete(sessionId);
    else ui.historyExpanded.add(sessionId);
    renderView();
  }

  function openLastSession(sessionId) {
    var session = state.sessions.find(function (s) { return s.id === sessionId; });
    if (!session) {
      ui.tab = 'history';
      ui.sheet = null;
      renderAll();
      return;
    }
    ui.tab = 'history';
    ui.historyExpanded.add(sessionId);
    ui.sheet = null;
    renderAll();
    requestAnimationFrame(function () {
      var el = document.getElementById('session-' + sessionId);
      if (!el) return;
      try {
        el.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      } catch (err) {
        el.scrollIntoView();
      }
    });
  }

  function promptDeleteSession(sessionId) {
    var session = state.sessions.find(function (s) { return s.id === sessionId; });
    if (!session) return;
    var summary = summaryForSession(session);
    showDialog({
      title: '删除这条训练记录？',
      message: fmtDay(session.startedAt) + '的训练和其中 ' + summary.setCount + ' 组记录会一并删除。',
      confirmLabel: '删除',
      danger: true,
      onConfirm: function () {
        var ids = state.sets
          .filter(function (set) { return set.sessionId === sessionId; })
          .map(function (set) { return set.id; });
        var ops = ids.map(function (id) { return { store: 'sets', type: 'delete', key: id }; });
        ops.push({ store: 'sessions', type: 'delete', key: sessionId });
        return dbBatch(ops).then(function () {
          state.sets = state.sets.filter(function (set) { return set.sessionId !== sessionId; });
          state.sessions = state.sessions.filter(function (s) { return s.id !== sessionId; });
          ui.historyExpanded.delete(sessionId);
          renderAll();

  function saveExerciseForm() {
    if (!ui.sheet || ui.sheet.type !== 'exerciseForm') return;
    if (ui.savingExercise) return;
    syncExerciseForm();
    var sheet = ui.sheet;
    var form = sheet.form;
    var name = sanitizeText(form.name, 40);
    var muscle = sanitizeText(form.muscle, 30) || '未分类';
    var metric = METRICS[form.metric] ? form.metric : 'weight_reps';
    if (!name) {
      toast('请填写动作名称');
      ui.focusTarget = 'exName';
      renderSheet();
      return;
    }
    var duplicate = state.exercises.some(function (ex) {
      return !ex.archived && ex.id !== sheet.editId && String(ex.name).trim().toLowerCase() === name.toLowerCase();
    });
    if (duplicate) {
      toast('动作库里已经有同名动作');
      ui.focusTarget = 'exName';
      renderSheet();
      return;
    }

    if (sheet.editId) {
      var ex = getExercise(sheet.editId);
      if (!ex) {
        toast('动作不存在');
        return;
      }
      if (ex.builtin) {
        toast('预置动作不可编辑');
        return;
      }
      if (sheet.formLocked) metric = ex.metric;
      var previous = Object.assign({}, ex);
      ex.name = name;
      ex.muscle = muscle;
      ex.metric = metric;
      ex.favorite = !!form.favorite;
      ui.savingExercise = true;
      var editButton = $('[data-act="saveExercise"]');
      if (editButton) editButton.disabled = true;
      dbPut('exercises', ex).then(function () {
        ui.sheet = null;
        ui.focusSheet = false;
        renderAll();
        toast('动作已更新');
        focusView();
      }).catch(function (err) {
        console.error(err);
        Object.assign(ex, previous);
        if (editButton) editButton.disabled = false;
        toast('保存失败：' + (err && err.message ? err.message : '请重试'));
      }).finally(function () {
        ui.savingExercise = false;
      });
      return;
    }

    var maxOrder = 0;
    state.exercises.forEach(function (item) {
      var order = Number(item.order);
      if (Number.isFinite(order) && order > maxOrder) maxOrder = order;
    });
    var newExercise = {
      id: uid('ex'),
      name: name,
      muscle: muscle,
      metric: metric,
      builtin: false,
      favorite: !!form.favorite,
      archived: false,
      order: maxOrder + 1,
      createdAt: Date.now()
    };
    ui.savingExercise = true;
    var addButton = $('[data-act="saveExercise"]');
    if (addButton) addButton.disabled = true;
    dbPut('exercises', newExercise).then(function () {
      state.exercises.push(newExercise);
      var returnTo = sheet.returnTo;
      ui.sheet = null;
      ui.focusSheet = false;
      if (returnTo === 'record' && activeSession()) {
        ui.currentExerciseId = newExercise.id;
        rememberCurrentExercise();
        openSheet({ type: 'record', draft: makeDraft(newExercise, null) });
        toast('动作已添加，可以直接记录');
      } else {
        if (returnTo === 'train') ui.tab = 'train';
        renderAll();
        toast('动作已添加');
        focusView();
      }
    }).catch(function (err) {
      console.error(err);
      if (addButton) addButton.disabled = false;
      toast('添加失败：' + (err && err.message ? err.message : '请重试'));
    }).finally(function () {
      ui.savingExercise = false;
    });
  }
